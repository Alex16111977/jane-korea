<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏥 Медицинская лексика - 6급</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #00897B, #26A69A, #80CBC4);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .nav {
            background: rgba(255,255,255,0.95);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .nav a {
            background: #00695C;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 10px;
            margin: 0 10px;
            display: inline-block;
            transition: all 0.3s;
        }

        .nav a:hover {
            background: #004D40;
            transform: translateY(-2px);
        }

        .lesson-header {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .lesson-header h1 {
            font-size: 2.2em;
            color: #00695C;
            margin-bottom: 10px;
        }

        .topic-animation {
            position: relative;
            height: 100px;
            margin: 20px 0;
            overflow: hidden;
            border-radius: 15px;
            background: linear-gradient(to bottom, #E0F2F1, #B2DFDB);
        }

        .topic-emoji {
            position: absolute;
            font-size: 2.5em;
            animation: float 6s ease-in-out infinite;
        }

        .item1 { top: 20px; left: 10%; animation-delay: 0s; }
        .item2 { top: 40px; left: 30%; animation-delay: -1.5s; }
        .item3 { top: 15px; left: 50%; animation-delay: -3s; }
        .item4 { top: 35px; left: 70%; animation-delay: -4.5s; }

        .vocabulary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .vocab-card {
            background: rgba(255,255,255,0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .vocab-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00695C, #26A69A);
        }

        .vocab-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .korean-word {
            font-size: 1.8em;
            font-weight: bold;
            color: #00695C;
            margin-bottom: 8px;
            text-align: center;
        }

        .pronunciation {
            font-size: 1.1em;
            color: #26A69A;
            margin-bottom: 10px;
            font-style: italic;
            text-align: center;
        }

        .translation {
            font-size: 1.1em;
            color: #00897B;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 500;
        }

        .example-sentence {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #00695C;
            font-size: 0.9em;
        }

        .korean-sentence { font-weight: bold; margin-bottom: 5px; }

        .speak-btn {
            background: #26A69A;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
            font-size: 0.9em;
            color: white;
        }

        .speak-btn:hover { background: #00695C; }

        .study-mode {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: #26A69A;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-btn.active { background: #00695C; }

        .flashcard {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 20px;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            position: relative;
        }

        .flashcard:hover { transform: rotateY(3deg) scale(1.02); }

        .flashcard::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00695C, #26A69A);
            border-radius: 20px 20px 0 0;
        }

        .quiz-section {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .quiz-question { font-size: 1.3em; margin-bottom: 20px; text-align: center; }

        .quiz-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .quiz-option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .quiz-option:hover { background: #e9ecef; }
        .quiz-option.correct { background: #d4edda; border-color: #28a745; }
        .quiz-option.wrong { background: #f8d7da; border-color: #dc3545; }

        .progress-bar {
            background: #e9ecef;
            border-radius: 10px;
            height: 20px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #00695C, #26A69A);
            height: 100%;
            width: 0%;
            transition: width 0.5s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="../index.html">← К 6급</a>
            <a href="../../index.html">🏠 Главная</a>
        </div>

        <div class="lesson-header">
            <h1>🏥 Медицинская лексика (의료 용어)</h1>
            <p>Диагноз, лечение, клинические испытания — язык здравоохранения на уровне носителя</p>

            <div class="topic-animation">
                <div class="topic-emoji item1">🩺</div>
                <div class="topic-emoji item2">💊</div>
                <div class="topic-emoji item3">🏥</div>
                <div class="topic-emoji item4">🧬</div>
            </div>
        </div>

        <div class="study-mode">
            <button class="mode-btn active" onclick="showVocabulary()">📚 Медицинская лексика</button>
            <button class="mode-btn" onclick="showFlashcards()">🃏 Карточки</button>
            <button class="mode-btn" onclick="showQuiz()">🎯 Тест</button>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div id="vocabulary-section">
            <div class="vocabulary-grid" id="vocabularyGrid"></div>
        </div>

        <div id="flashcard-section" style="display: none;">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div id="flashcard-content">
                    <div class="korean-word" id="flashcard-korean">진단</div>
                    <button class="speak-btn" onclick="speak(document.getElementById('flashcard-korean').textContent, event)">🔊</button>
                </div>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="mode-btn" onclick="prevCard()">← Предыдущая</button>
                <span id="card-counter">1 / 12</span>
                <button class="mode-btn" onclick="nextCard()">Следующая →</button>
            </div>
            <div style="text-align: center; margin-top: 10px; color: #666;">
                <small>Нажмите на карточку для переворота или используйте Пробел</small>
            </div>
        </div>

        <div id="quiz-section" style="display: none;">
            <div class="quiz-section">
                <h2>🎯 Тест: Медицинская лексика</h2>
                <div class="quiz-question" id="quiz-question">Как по-корейски "диагноз"?</div>
                <div class="quiz-options" id="quiz-options"></div>
                <div style="text-align: center; margin-top: 20px;">
                    <button class="mode-btn" onclick="nextQuestion()">Следующий вопрос</button>
                    <button class="mode-btn" onclick="restartQuiz()">Начать заново</button>
                </div>
                <div id="quiz-stats" style="text-align: center; margin-top: 20px;">
                    Правильных ответов: <span id="correct-count">0</span> из <span id="total-count">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const vocabulary = [
            {
                korean: '진단',
                pronunciation: 'чиндан',
                translation: 'диагноз',
                example: '환자는 정밀 검사 끝에 초기 위암이라는 진단을 받았으며, 의료진은 조기 발견이 무엇보다 중요하다고 강조했다',
                exampleTranslation: 'После тщательного обследования пациенту поставили диагноз "рак желудка на ранней стадии", и медики подчеркнули, что раннее выявление важнее всего'
            },
            {
                korean: '처방전',
                pronunciation: 'чхобанджон',
                translation: 'рецепт (медицинский)',
                example: '의사는 항생제 처방전을 발급하면서 반드시 정해진 복용량과 기간을 지켜야 내성이 생기지 않는다고 당부했다',
                exampleTranslation: 'Выписывая рецепт на антибиотики, врач настоятельно посоветовал строго соблюдать дозировку и срок приёма, чтобы не выработалась устойчивость'
            },
            {
                korean: '부작용',
                pronunciation: 'буджагён',
                translation: 'побочный эффект',
                example: '신약 개발 과정에서 일부 환자들에게서 예상치 못한 부작용이 보고되어, 임상시험이 일시 중단되었다',
                exampleTranslation: 'В процессе разработки нового препарата у части пациентов были зафиксированы неожиданные побочные эффекты, из-за чего клинические испытания были временно приостановлены'
            },
            {
                korean: '만성질환',
                pronunciation: 'мансончжирхван',
                translation: 'хроническое заболевание',
                example: '당뇨병과 같은 만성질환은 완치보다는 꾸준한 관리를 통해 합병증을 예방하는 것이 치료의 핵심이다',
                exampleTranslation: 'При таких хронических заболеваниях, как диабет, ключевая цель лечения — не полное излечение, а постоянный контроль для профилактики осложнений'
            },
            {
                korean: '감염',
                pronunciation: 'камём',
                translation: 'инфекция',
                example: '병원 측은 수술 부위 감염을 예방하기 위해 철저한 소독 절차를 도입했다고 밝혔다',
                exampleTranslation: 'В больнице заявили, что внедрили строгие процедуры дезинфекции для профилактики инфекции в области операции'
            },
            {
                korean: '백신',
                pronunciation: 'пэксин',
                translation: 'вакцина',
                example: '보건 당국은 겨울철 유행에 대비해 고위험군을 대상으로 백신 접종을 서둘러야 한다고 권고했다',
                exampleTranslation: 'Органы здравоохранения рекомендовали как можно скорее провести вакцинацию групп риска в преддверии зимней эпидемии'
            },
            {
                korean: '수술',
                pronunciation: 'сусуль',
                translation: 'операция (хирургическая)',
                example: '장시간에 걸친 수술 끝에 환자는 무사히 회복실로 옮겨졌으며, 경과는 양호한 것으로 전해졌다',
                exampleTranslation: 'После продолжительной операции пациента благополучно перевели в палату восстановления, и, как сообщается, состояние удовлетворительное'
            },
            {
                korean: '예후',
                pronunciation: 'йеху',
                translation: 'прогноз (медицинский)',
                example: '조기에 발견하여 적절한 치료를 받을 경우 예후가 상당히 좋아진다는 것이 전문가들의 공통된 의견이다',
                exampleTranslation: 'Общее мнение специалистов таково: при раннем выявлении и своевременном лечении прогноз значительно улучшается'
            },
            {
                korean: '임상시험',
                pronunciation: 'имсансихом',
                translation: 'клиническое испытание',
                example: '해당 제약회사는 신약의 효과를 입증하기 위해 대규모 임상시험을 진행 중이라고 발표했다',
                exampleTranslation: 'Фармацевтическая компания заявила, что проводит масштабное клиническое испытание для подтверждения эффективности нового препарата'
            },
            {
                korean: '전염병',
                pronunciation: 'чоньёмбён',
                translation: 'инфекционное заболевание, эпидемия',
                example: '전염병이 확산됨에 따라 정부는 국경 통제를 강화하고 대규모 집회를 제한하는 조치를 취했다',
                exampleTranslation: 'В связи с распространением инфекционного заболевания правительство усилило контроль на границах и ввело ограничения на массовые собрания'
            },
            {
                korean: '응급실',
                pronunciation: 'ынгыпсиль',
                translation: 'приёмный покой, скорая помощь',
                example: '교통사고를 당한 환자가 응급실로 실려 왔으나, 신속한 처치 덕분에 생명에는 지장이 없다고 한다',
                exampleTranslation: 'Пострадавшего в ДТП доставили в приёмный покой, однако благодаря оперативной помощи его жизни, как сообщается, ничто не угрожает'
            },
            {
                korean: '면역력',
                pronunciation: 'мёнённёк',
                translation: 'иммунитет',
                example: '규칙적인 운동과 충분한 수면은 면역력을 높이는 데 가장 기본적이면서도 효과적인 방법으로 꼽힌다',
                exampleTranslation: 'Регулярные физические упражнения и достаточный сон считаются самым базовым и в то же время эффективным способом повышения иммунитета'
            }
        ];

        let currentCardIndex = 0;
        let isFlipped = false;
        let quizCurrentIndex = 0;
        let correctAnswers = 0;
        let totalQuestions = 0;

        function loadVocabulary() {
            const grid = document.getElementById('vocabularyGrid');
            grid.innerHTML = '';

            vocabulary.forEach((word, index) => {
                const card = document.createElement('div');
                card.className = 'vocab-card';
                card.innerHTML = `
                    <div class="korean-word">${word.korean}</div>
                    <div class="pronunciation">${word.pronunciation}</div>
                    <div class="translation">${word.translation}</div>
                    <div class="example-sentence">
                        <div class="korean-sentence">${word.example}</div>
                        <div>${word.exampleTranslation}</div>
                    </div>
                    <button class="speak-btn" onclick="speak('${word.korean}', event)">🔊 Слово</button>
                    <button class="speak-btn" onclick="speak('${word.example}', event)">🔊 Пример</button>
                `;
                grid.appendChild(card);
            });

            updateProgress();
        }

        function speak(text, event) {
            if (event) event.stopPropagation();
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            }
        }

        function showVocabulary() {
            document.getElementById('vocabulary-section').style.display = 'block';
            document.getElementById('flashcard-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'none';
            updateActiveButton(0);
        }

        function showFlashcards() {
            document.getElementById('vocabulary-section').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'block';
            document.getElementById('quiz-section').style.display = 'none';
            updateActiveButton(1);
            updateFlashcard();
        }

        function showQuiz() {
            document.getElementById('vocabulary-section').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            updateActiveButton(2);
            generateQuizQuestion();
        }

        function updateActiveButton(index) {
            const buttons = document.querySelectorAll('.mode-btn');
            buttons.forEach((btn, i) => btn.classList.toggle('active', i === index));
        }

        function updateFlashcard() {
            const word = vocabulary[currentCardIndex];
            const content = document.getElementById('flashcard-content');

            if (isFlipped) {
                content.innerHTML = `
                    <div class="pronunciation">${word.pronunciation}</div>
                    <div class="translation">${word.translation}</div>
                    <div class="example-sentence" style="margin-top: 15px;">
                        <div class="korean-sentence">${word.example}</div>
                        <div style="font-size: 0.9em; color: #666;">${word.exampleTranslation}</div>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <div class="korean-word">${word.korean}</div>
                    <button class="speak-btn" onclick="speak('${word.korean}', event)">🔊 Произнести</button>
                `;
            }

            document.getElementById('card-counter').textContent = `${currentCardIndex + 1} / ${vocabulary.length}`;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            const flashcard = document.getElementById('flashcard');
            flashcard.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
            setTimeout(() => {
                updateFlashcard();
                flashcard.style.transform = 'rotateY(0deg)';
            }, 150);
        }

        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % vocabulary.length;
            isFlipped = false;
            updateFlashcard();
        }

        function prevCard() {
            currentCardIndex = (currentCardIndex - 1 + vocabulary.length) % vocabulary.length;
            isFlipped = false;
            updateFlashcard();
        }

        function generateQuizQuestion() {
            const word = vocabulary[quizCurrentIndex % vocabulary.length];
            const options = [word];

            while (options.length < 4) {
                const randomWord = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                if (!options.includes(randomWord)) options.push(randomWord);
            }

            options.sort(() => Math.random() - 0.5);

            const questionTypes = [
                `Как по-корейски "${word.translation}"?`,
                `Что означает "${word.korean}"?`
            ];

            const questionType = Math.floor(Math.random() * questionTypes.length);
            document.getElementById('quiz-question').textContent = questionTypes[questionType];

            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';

            options.forEach(option => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'quiz-option';

                if (questionType === 0) {
                    optionDiv.innerHTML = `${option.korean} <br><small>(${option.pronunciation})</small>`;
                } else {
                    optionDiv.textContent = option.translation;
                }

                optionDiv.onclick = () => selectAnswer(option, word);
                optionsContainer.appendChild(optionDiv);
            });
        }

        function selectAnswer(selected, correct) {
            totalQuestions++;
            const options = document.querySelectorAll('.quiz-option');

            options.forEach(option => {
                option.onclick = null;
                if (option.textContent.includes(correct.korean) || option.textContent.includes(correct.translation)) {
                    option.classList.add('correct');
                } else if (option.textContent.includes(selected.korean) || option.textContent.includes(selected.translation)) {
                    option.classList.add('wrong');
                }
            });

            if (selected.korean === correct.korean) correctAnswers++;

            document.getElementById('correct-count').textContent = correctAnswers;
            document.getElementById('total-count').textContent = totalQuestions;
        }

        function nextQuestion() {
            quizCurrentIndex++;
            generateQuizQuestion();
        }

        function restartQuiz() {
            quizCurrentIndex = 0;
            correctAnswers = 0;
            totalQuestions = 0;
            document.getElementById('correct-count').textContent = '0';
            document.getElementById('total-count').textContent = '0';
            generateQuizQuestion();
        }

        function updateProgress() {
            document.getElementById('progress').style.width = '100%';
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadVocabulary();
            updateFlashcard();
            generateQuizQuestion();

            const cards = document.querySelectorAll('.vocab-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.5s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });

        document.addEventListener('keydown', function(e) {
            if (document.getElementById('flashcard-section').style.display !== 'none') {
                if (e.code === 'Space') { e.preventDefault(); flipCard(); }
                else if (e.code === 'ArrowRight') nextCard();
                else if (e.code === 'ArrowLeft') prevCard();
            }
        });
    </script>
    <!-- Кнопка завершения урока -->
    <div style="text-align: center; margin: 40px 0; padding: 30px;">
        <button id="completeLessonBtn" onclick="completeLesson()" style="
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.2em;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(76,175,80,0.3);
            font-family: 'Noto Sans KR', sans-serif;
        ">Отметить урок как пройденный</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="../../js/firebase-config.js"></script>
    <script src="../../js/firebase-sync.js"></script>
    <script src="../../js/firebase-auth.js"></script>
    <script src="../../js/progress-tracker.js"></script>
    <script>
        var LESSON_ID = 'level6_lesson_medical_vocabulary';

        function completeLesson() {
            if (window.ProgressTracker) {
                if (!ProgressTracker.markLessonCompleted(LESSON_ID)) return;
                var btn = document.getElementById('completeLessonBtn');
                btn.textContent = 'Пройдено!';
                btn.style.background = '#2e7d32';
                btn.style.cursor = 'default';
                btn.disabled = true;
                btn.style.opacity = '0.85';
                console.log('[OK] Lesson completed:', LESSON_ID);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (window.ProgressTracker) {
                var progress = ProgressTracker.get();
                if (progress && progress.completedLessons && progress.completedLessons[LESSON_ID]) {
                    var btn = document.getElementById('completeLessonBtn');
                    if (btn) {
                        btn.textContent = 'Пройдено!';
                        btn.style.background = '#2e7d32';
                        btn.style.cursor = 'default';
                        btn.disabled = true;
                        btn.style.opacity = '0.85';
                    }
                }
            }
        });
    </script>
