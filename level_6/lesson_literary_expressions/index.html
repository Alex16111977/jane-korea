<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 Литературные выражения - 6급</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2f6fd0, #1a3f8f, #1a3f8f);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .nav {
            background: rgba(255,255,255,0.95);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .nav a {
            background: #8B5CF6;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 10px;
            margin: 0 10px;
            display: inline-block;
            transition: all 0.3s;
        }
        
        .nav a:hover {
            background: #7C3AED;
            transform: translateY(-2px);
        }
        
        .lesson-header {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .lesson-header h1 {
            font-size: 2.5em;
            color: #8B5CF6;
            margin-bottom: 10px;
        }
        
        .literary-animation {
            position: relative;
            height: 100px;
            margin: 20px 0;
            overflow: hidden;
            border-radius: 15px;
            background: linear-gradient(to bottom, #f6f4ff, #ece9f6);
        }
        
        .literary-emoji {
            position: absolute;
            font-size: 2.5em;
            animation: float 6s ease-in-out infinite;
        }
        
        .item1 {
            top: 20px;
            left: 10%;
            animation-delay: 0s;
        }
        
        .item2 {
            top: 40px;
            left: 30%;
            animation-delay: -1.5s;
        }
        
        .item3 {
            top: 15px;
            left: 50%;
            animation-delay: -3s;
        }
        
        .item4 {
            top: 35px;
            left: 70%;
            animation-delay: -4.5s;
        }
        
        .vocabulary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .vocab-card {
            background: rgba(255,255,255,0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .vocab-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #6c5ce7, #4b3fb8);
        }
        
        .vocab-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .korean-word {
            font-size: 1.8em;
            font-weight: bold;
            color: #8B5CF6;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .pronunciation {
            font-size: 1.1em;
            color: #EC4899;
            margin-bottom: 10px;
            font-style: italic;
            text-align: center;
        }
        
        .translation {
            font-size: 1.1em;
            color: #F59E0B;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 500;
        }
        
        .literary-context {
            background: #FDF2F8;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: #831843;
            border-left: 3px solid #EC4899;
        }
        
        .example-sentence {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #8B5CF6;
            font-size: 0.9em;
        }
        
        .korean-sentence {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .speak-btn {
            background: #F59E0B;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
            font-size: 0.9em;
            color: white;
        }
        
        .speak-btn:hover {
            background: #8B5CF6;
        }
        
        .study-mode {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .mode-btn {
            background: #F59E0B;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .mode-btn.active {
            background: #8B5CF6;
        }
        
        .flashcard {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 20px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .flashcard:hover {
            transform: rotateY(3deg) scale(1.02);
        }
        
        .flashcard::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #6c5ce7, #4b3fb8);
            border-radius: 20px 20px 0 0;
        }
        
        .quiz-section {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .quiz-question {
            font-size: 1.3em;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .quiz-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .quiz-option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .quiz-option:hover {
            background: #e9ecef;
        }
        
        .quiz-option.correct {
            background: #d4edda;
            border-color: #28a745;
        }
        
        .quiz-option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
        }
        
        .progress-bar {
            background: #e9ecef;
            border-radius: 10px;
            height: 20px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            background: linear-gradient(90deg, #6c5ce7, #4b3fb8);
            height: 100%;
            width: 0%;
            transition: width 0.5s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
    </style>
    <link rel="stylesheet" href="../../css/lesson-theme.css">
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="../index.html">← К 6급</a>
            <a href="../../index.html">🏠 Главная</a>
        </div>
        
        <div class="lesson-header">
            <h1>📖 Литературные выражения</h1>
            <p>Изучаем высокий стиль и поэтическую лексику корейского языка</p>
            
            <div class="literary-animation">
                <div class="literary-emoji item1">📜</div>
                <div class="literary-emoji item2">✒️</div>
                <div class="literary-emoji item3">🌙</div>
                <div class="literary-emoji item4">🌸</div>
            </div>
        </div>
        
        <div class="study-mode">
            <button class="mode-btn active" onclick="showVocabulary()">📚 Литературная лексика</button>
            <button class="mode-btn" onclick="showFlashcards()">🃏 Карточки</button>
            <button class="mode-btn" onclick="showQuiz()">🎯 Тест</button>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        
        <div id="vocabulary-section">
            <div class="vocabulary-grid" id="vocabularyGrid">
                <!-- Будет заполнено JS -->
            </div>
        </div>
        
        <div id="flashcard-section" style="display: none;">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div id="flashcard-content">
                    <div class="korean-word" id="flashcard-korean">그리움</div>
                    <button class="speak-btn" onclick="speak(document.getElementById('flashcard-korean').textContent, event)">🔊</button>
                </div>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="mode-btn" onclick="prevCard()">← Предыдущая</button>
                <span id="card-counter">1 / 10</span>
                <button class="mode-btn" onclick="nextCard()">Следующая →</button>
            </div>
            <div style="text-align: center; margin-top: 10px; color: #666;">
                <small>Нажмите на карточку для переворота или используйте Пробел</small>
            </div>
        </div>
        
        <div id="quiz-section" style="display: none;">
            <div class="quiz-section">
                <h2>🎯 Тест: Литературные выражения</h2>
                <div class="quiz-question" id="quiz-question">
                    Что означает "그리움"?
                </div>
                <div class="quiz-options" id="quiz-options">
                    <!-- Будет заполнено JS -->
                </div>
                <div style="text-align: center; margin-top: 20px;">
                    <button class="mode-btn" onclick="nextQuestion()">Следующий вопрос</button>
                    <button class="mode-btn" onclick="restartQuiz()">Начать заново</button>
                </div>
                <div id="quiz-stats" style="text-align: center; margin-top: 20px;">
                    Правильных ответов: <span id="correct-count">0</span> из <span id="total-count">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const vocabulary = [
            {
                korean: '그리움',
                pronunciation: 'кы-ри-ум',
                translation: 'тоска, ностальгия',
                context: 'Глубокое поэтическое чувство, часто используется в литературе',
                example: '가을밤 홀로 창가에 앉아 있으면, 두고 온 고향에 대한 그리움이 안개처럼 스며들곤 하였다',
                exampleTranslation: 'Осенними ночами, сидя в одиночестве у окна, тоска по оставленной родине то и дело окутывала сердце, точно туман'
            },
            {
                korean: '한',
                pronunciation: 'хан',
                translation: 'хан (особое корейское чувство)',
                context: 'Уникальное корейское понятие - смесь печали, скорби и надежды',
                example: '평생을 눈물로 지새운 어머니의 한은 죽어서도 풀리지 않을 듯하였다',
                exampleTranslation: 'Хан матери, всю жизнь проведшей в слезах, казалось, не рассеется даже после смерти'
            },
            {
                korean: '정',
                pronunciation: 'чон',
                translation: 'чон (сердечная привязанность)',
                context: 'Особая корейская эмоция - глубокая сердечная связь',
                example: '말없이 나눈 술 한 잔에도 오랜 벗과의 정은 해가 갈수록 깊어만 갔다',
                exampleTranslation: 'Даже в безмолвно разделённой чаше вина сердечная связь со старым другом с каждым годом становилась лишь глубже'
            },
            {
                korean: '애잔하다',
                pronunciation: 'э-джан-ха-да',
                translation: 'быть трогательно-печальным',
                context: 'Изящное выражение нежной грусти',
                example: '붉게 물든 강물 위로, 애잔하게 저물어 가는 석양이 말없이 스러졌다',
                exampleTranslation: 'Над окрасившейся багрянцем рекой трогательно-печальный закат безмолвно угасал'
            },
            {
                korean: '서정적',
                pronunciation: 'со-чон-чжок',
                translation: 'лирический, поэтичный',
                context: 'Литературный термин для описания поэтического настроения',
                example: '잊혀진 옛사랑을 노래하듯, 서정적인 시구 하나하나가 가슴을 적셔 왔다',
                exampleTranslation: 'Будто воспевая забытую былую любовь, каждая лирическая строка одна за другой омывала сердце'
            },
            {
                korean: '운치',
                pronunciation: 'ун-чхи',
                translation: 'поэтическое очарование',
                context: 'Эстетическое понятие, красота с глубиным смыслом',
                example: '달빛이 소리 없이 내려앉은 정원에는, 말로 다 못할 운치가 은은히 감돌았다',
                exampleTranslation: 'В саду, где безмолвно осел лунный свет, тихо витало неизъяснимое поэтическое очарование'
            },
            {
                korean: '풍류',
                pronunciation: 'пхун-рю',
                translation: 'изящное наслаждение жизнью',
                context: 'Традиционное корейское понятие эстетического образа жизни',
                example: '거문고 한 자락과 술 한 잔이면 족하니, 옛 선비는 그렇듯 풍류를 벗 삼아 한평생을 살아갔다',
                exampleTranslation: 'Довольствуясь одним напевом каягыма да чашей вина, старый учёный муж всю жизнь так и прожил, взяв изящное наслаждение жизнью себе в друзья'
            },
            {
                korean: '멋',
                pronunciation: 'мот',
                translation: 'изысканная красота, стиль',
                context: 'Особое корейское понятие эстетической красоты',
                example: '바람에 나부끼는 치맛자락 한 폭에서도, 한복의 은은한 멋이 고스란히 배어 나왔다',
                exampleTranslation: 'Даже в единственном подоле юбки, трепещущем на ветру, безраздельно проступала утончённая красота ханбока'
            },
            {
                korean: '여운',
                pronunciation: 'ё-ун',
                translation: 'послевкусие, отзвук',
                context: 'Литературное понятие - оставшееся впечатление',
                example: '마지막 선율이 그친 후에도, 그 깊은 여운은 청중의 가슴속에 오래도록 머물러 있었다',
                exampleTranslation: 'Даже после того как отзвучала последняя мелодия, глубокое послевкусие ещё долго не покидало сердца слушателей'
            },
            {
                korean: '수묵화',
                pronunciation: 'су-мок-хва',
                translation: 'живопись тушью',
                context: 'Традиционный жанр восточной живописи',
                example: '한 획 한 획 먹빛으로 스며든 수묵화 앞에서, 그 담백한 아름다움에 절로 숨을 죽이게 되었다',
                exampleTranslation: 'Перед картиной тушью, где каждый мазок растворился в чёрных чернилах, невольно затаил дыхание перед её сдержанной красотой'
            }
        ];
        
        let currentCardIndex = 0;
        let isFlipped = false;
        let quizCurrentIndex = 0;
        let correctAnswers = 0;
        let totalQuestions = 0;
        
        function loadVocabulary() {
            const grid = document.getElementById('vocabularyGrid');
            grid.innerHTML = '';
            
            vocabulary.forEach((word, index) => {
                const card = document.createElement('div');
                card.className = 'vocab-card';
                card.innerHTML = `
                    <div class="korean-word">${word.korean}</div>
                    <div class="pronunciation">${word.pronunciation}</div>
                    <div class="translation">${word.translation}</div>
                    <div class="literary-context">📝 ${word.context}</div>
                    <div class="example-sentence">
                        <div class="korean-sentence">${word.example}</div>
                        <div>${word.exampleTranslation}</div>
                    </div>
                    <button class="speak-btn" onclick="speak('${word.korean}', event)">🔊 Слово</button>
                    <button class="speak-btn" onclick="speak('${word.example}', event)">🔊 Пример</button>
                `;
                grid.appendChild(card);
            });
            
            updateProgress();
        }
        
        function speak(text, event) {
            if (event) {
                event.stopPropagation(); // Предотвращаем переворот карточки
            }
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.7;
                speechSynthesis.speak(utterance);
            }
        }
        
        function showVocabulary() {
            document.getElementById('vocabulary-section').style.display = 'block';
            document.getElementById('flashcard-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'none';
            updateActiveButton(0);
        }
        
        function showFlashcards() {
            document.getElementById('vocabulary-section').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'block';
            document.getElementById('quiz-section').style.display = 'none';
            updateActiveButton(1);
            updateFlashcard();
        }
        
        function showQuiz() {
            document.getElementById('vocabulary-section').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            updateActiveButton(2);
            generateQuizQuestion();
        }
        
        function updateActiveButton(index) {
            const buttons = document.querySelectorAll('.mode-btn');
            buttons.forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        function updateFlashcard() {
            const word = vocabulary[currentCardIndex];
            const content = document.getElementById('flashcard-content');
            
            if (isFlipped) {
                content.innerHTML = `
                    <div class="pronunciation">${word.pronunciation}</div>
                    <div class="translation">${word.translation}</div>
                    <div class="literary-context">📝 ${word.context}</div>
                    <div class="example-sentence" style="margin-top: 15px;">
                        <div class="korean-sentence">${word.example}</div>
                        <div style="font-size: 0.9em; color: #666;">${word.exampleTranslation}</div>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <div class="korean-word">${word.korean}</div>
                    <button class="speak-btn" onclick="speak('${word.korean}', event)">🔊 Произнести</button>
                `;
            }
            
            document.getElementById('card-counter').textContent = `${currentCardIndex + 1} / ${vocabulary.length}`;
        }
        
        function flipCard() {
            isFlipped = !isFlipped;
            const flashcard = document.getElementById('flashcard');
            flashcard.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
            setTimeout(() => {
                updateFlashcard();
                flashcard.style.transform = 'rotateY(0deg)';
            }, 150);
        }
        
        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % vocabulary.length;
            isFlipped = false;
            updateFlashcard();
        }
        
        function prevCard() {
            currentCardIndex = (currentCardIndex - 1 + vocabulary.length) % vocabulary.length;
            isFlipped = false;
            updateFlashcard();
        }
        
        function generateQuizQuestion() {
            const word = vocabulary[quizCurrentIndex % vocabulary.length];
            const options = [word];
            
            while (options.length < 4) {
                const randomWord = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                if (!options.includes(randomWord)) {
                    options.push(randomWord);
                }
            }
            
            options.sort(() => Math.random() - 0.5);
            
            const questionTypes = [
                `Что означает "${word.korean}"?`,
                `Как по-корейски "${word.translation}"?`
            ];
            
            const questionType = Math.floor(Math.random() * questionTypes.length);
            document.getElementById('quiz-question').textContent = questionTypes[questionType];
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            options.forEach(option => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'quiz-option';
                
                if (questionType === 0) {
                    optionDiv.textContent = option.translation;
                } else {
                    optionDiv.innerHTML = `${option.korean} <br><small>(${option.pronunciation})</small>`;
                }
                
                optionDiv.onclick = () => selectAnswer(option, word);
                optionsContainer.appendChild(optionDiv);
            });
        }
        
        function selectAnswer(selected, correct) {
            totalQuestions++;
            const options = document.querySelectorAll('.quiz-option');
            
            options.forEach(option => {
                option.onclick = null;
                if (option.textContent.includes(correct.korean) || option.textContent.includes(correct.translation)) {
                    option.classList.add('correct');
                } else if (option.textContent.includes(selected.korean) || option.textContent.includes(selected.translation)) {
                    option.classList.add('wrong');
                }
            });
            
            if (selected.korean === correct.korean) {
                correctAnswers++;
            }
            
            document.getElementById('correct-count').textContent = correctAnswers;
            document.getElementById('total-count').textContent = totalQuestions;
        }
        
        function nextQuestion() {
            quizCurrentIndex++;
            generateQuizQuestion();
        }
        
        function restartQuiz() {
            quizCurrentIndex = 0;
            correctAnswers = 0;
            totalQuestions = 0;
            document.getElementById('correct-count').textContent = '0';
            document.getElementById('total-count').textContent = '0';
            generateQuizQuestion();
        }
        
        function updateProgress() {
            const progress = 100;
            document.getElementById('progress').style.width = progress + '%';
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            loadVocabulary();
            updateFlashcard();
            generateQuizQuestion();
            
            // Анимация появления карточек
            const cards = document.querySelectorAll('.vocab-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.5s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 120);
            });
        });
        
        // Горячие клавиши
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('flashcard-section').style.display !== 'none') {
                if (e.code === 'Space') {
                    e.preventDefault();
                    flipCard();
                } else if (e.code === 'ArrowRight') {
                    nextCard();
                } else if (e.code === 'ArrowLeft') {
                    prevCard();
                }
            }
        });
    </script>
    <!-- Кнопка завершения урока -->
    <div style="text-align: center; margin: 40px 0; padding: 30px;">
        <button id="completeLessonBtn" onclick="completeLesson()" style="
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.2em;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(76,175,80,0.3);
            font-family: 'Noto Sans KR', sans-serif;
        ">Отметить урок как пройденный</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="../../js/firebase-config.js"></script>
    <script src="../../js/firebase-sync.js"></script>
    <script src="../../js/firebase-auth.js"></script>
    <script src="../../js/progress-tracker.js"></script>
    <script>
        var LESSON_ID = 'level6_lesson_15_literary';

        function completeLesson() {
            if (window.ProgressTracker) {
                if (!ProgressTracker.markLessonCompleted(LESSON_ID)) return;
                var btn = document.getElementById('completeLessonBtn');
                btn.textContent = 'Пройдено!';
                btn.style.background = '#2e7d32';
                btn.style.cursor = 'default';
                btn.disabled = true;
                btn.style.opacity = '0.85';
                console.log('[OK] Lesson completed:', LESSON_ID);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (window.ProgressTracker) {
                var progress = ProgressTracker.get();
                if (progress && progress.completedLessons && progress.completedLessons[LESSON_ID]) {
                    var btn = document.getElementById('completeLessonBtn');
                    if (btn) {
                        btn.textContent = 'Пройдено!';
                        btn.style.background = '#2e7d32';
                        btn.style.cursor = 'default';
                        btn.disabled = true;
                        btn.style.opacity = '0.85';
                    }
                }
            }
        });
    </script>
