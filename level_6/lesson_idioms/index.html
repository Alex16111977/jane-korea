<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 Идиомы и фразеологизмы - 6급</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FF6B6B, #FF8E53, #FFD93D);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .nav {
            background: rgba(255,255,255,0.95);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .nav a {
            background: #FF6B6B;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 10px;
            margin: 0 10px;
            display: inline-block;
            transition: all 0.3s;
        }
        
        .nav a:hover {
            background: #FF5252;
            transform: translateY(-2px);
        }
        
        .lesson-header {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .lesson-header h1 {
            font-size: 2.5em;
            color: #FF6B6B;
            margin-bottom: 10px;
        }
        
        .idiom-animation {
            position: relative;
            height: 100px;
            margin: 20px 0;
            overflow: hidden;
            border-radius: 15px;
            background: linear-gradient(to bottom, #FFE0E0, #FFF3E0);
        }
        
        .idiom-emoji {
            position: absolute;
            font-size: 2.5em;
            animation: float 6s ease-in-out infinite;
        }
        
        .item1 {
            top: 20px;
            left: 10%;
            animation-delay: 0s;
        }
        
        .item2 {
            top: 40px;
            left: 30%;
            animation-delay: -1.5s;
        }
        
        .item3 {
            top: 15px;
            left: 50%;
            animation-delay: -3s;
        }
        
        .item4 {
            top: 35px;
            left: 70%;
            animation-delay: -4.5s;
        }
        
        .vocabulary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .vocab-card {
            background: rgba(255,255,255,0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .vocab-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #FF6B6B, #FF8E53);
        }
        
        .vocab-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .korean-idiom {
            font-size: 1.8em;
            font-weight: bold;
            color: #FF6B6B;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .literal-meaning {
            font-size: 1em;
            color: #888;
            margin-bottom: 10px;
            font-style: italic;
            text-align: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        
        .idiom-meaning {
            font-size: 1.1em;
            color: #FF8E53;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 500;
        }
        
        .example-sentence {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 8px;
            border-left: 3px solid #FF6B6B;
            font-size: 0.9em;
        }
        
        .korean-sentence {
            font-weight: bold;
            margin-bottom: 3px;
        }
        
        .speak-btn {
            background: #FF8E53;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
            font-size: 0.9em;
            color: white;
        }
        
        .speak-btn:hover {
            background: #FF6B6B;
        }
        
        .study-mode {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .mode-btn {
            background: #FF8E53;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .mode-btn.active {
            background: #FF6B6B;
        }
        
        .flashcard {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 20px;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .flashcard:hover {
            transform: rotateY(3deg) scale(1.02);
        }
        
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        
        .flashcard::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #FF6B6B, #FF8E53);
            border-radius: 20px 20px 0 0;
        }
        
        .quiz-section {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .quiz-question {
            font-size: 1.3em;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .quiz-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .quiz-option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .quiz-option:hover {
            background: #e9ecef;
        }
        
        .quiz-option.correct {
            background: #d4edda;
            border-color: #28a745;
        }
        
        .quiz-option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
        }
        
        .progress-bar {
            background: #e9ecef;
            border-radius: 10px;
            height: 20px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            background: linear-gradient(90deg, #FF6B6B, #FF8E53);
            height: 100%;
            width: 0%;
            transition: width 0.5s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="../index.html">← К 6급</a>
            <a href="../../index.html">🏠 Главная</a>
        </div>
        
        <div class="lesson-header">
            <h1>🎭 Идиомы и фразеологизмы</h1>
            <p>Изучаем образные выражения и культурные особенности корейского языка</p>
            
            <div class="idiom-animation">
                <div class="idiom-emoji item1">🌸</div>
                <div class="idiom-emoji item2">🌙</div>
                <div class="idiom-emoji item3">⭐</div>
                <div class="idiom-emoji item4">🎋</div>
            </div>
        </div>
        
        <div class="study-mode">
            <button class="mode-btn active" onclick="showVocabulary()">📚 Идиомы</button>
            <button class="mode-btn" onclick="showFlashcards()">🃏 Карточки</button>
            <button class="mode-btn" onclick="showQuiz()">🎯 Тест</button>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        
        <div id="vocabulary-section">
            <div class="vocabulary-grid" id="vocabularyGrid">
                <!-- Будет заполнено JS -->
            </div>
        </div>
        
        <div id="flashcard-section" style="display: none;">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div id="flashcard-content">
                    <div class="korean-idiom" id="flashcard-korean">눈 깜짝할 사이</div>
                    <button class="speak-btn" onclick="speak(document.getElementById('flashcard-korean').textContent, event)">🔊</button>
                </div>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="mode-btn" onclick="prevCard()">← Предыдущая</button>
                <span id="card-counter">1 / 10</span>
                <button class="mode-btn" onclick="nextCard()">Следующая →</button>
            </div>
            <div style="text-align: center; margin-top: 10px; color: #666;">
                <small>Нажмите на карточку для переворота или используйте Пробел</small>
            </div>
        </div>
        
        <div id="quiz-section" style="display: none;">
            <div class="quiz-section">
                <h2>🎯 Тест: Идиомы и фразеологизмы</h2>
                <div class="quiz-question" id="quiz-question">
                    Что означает идиома "눈 깜짝할 사이"?
                </div>
                <div class="quiz-options" id="quiz-options">
                    <!-- Будет заполнено JS -->
                </div>
                <div style="text-align: center; margin-top: 20px;">
                    <button class="mode-btn" onclick="nextQuestion()">Следующий вопрос</button>
                    <button class="mode-btn" onclick="restartQuiz()">Начать заново</button>
                </div>
                <div id="quiz-stats" style="text-align: center; margin-top: 20px;">
                    Правильных ответов: <span id="correct-count">0</span> из <span id="total-count">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const idioms = [
            {
                korean: '눈 깜짝할 사이',
                literal: 'промежуток времени, когда моргаешь',
                meaning: 'в мгновение ока, очень быстро',
                example: '목격자들은 사고가 눈 깜짝할 사이에 일어나서 미처 손 쓸 새도 없었다고 입을 모아 증언했다',
                exampleTranslation: 'Свидетели в один голос утверждали, что авария произошла в мгновение ока, так что никто не успел ничего предпринять'
            },
            {
                korean: '발등에 불이 떨어지다',
                literal: 'огонь упал на ступню',
                meaning: 'дело стало срочным, припекло',
                example: '팀장은 발표 자료가 하나도 준비되지 않았다는 사실을 회의 직전에야 깨닫고서야 발등에 불이 떨어진 듯 부서 전체를 독촉하기 시작했다',
                exampleTranslation: 'Руководитель отдела, осознав прямо перед совещанием, что материалы для презентации совсем не готовы, спохватился и стал в панике торопить весь отдел'
            },
            {
                korean: '고래 싸움에 새우 등 터진다',
                literal: 'когда дерутся киты, у креветки спина лопается',
                meaning: 'страдают невинные',
                example: '두 강대국이 무역 전쟁을 벌이는 사이, 정작 피해를 입는 쪽은 힘없는 중소기업들이니 고래 싸움에 새우 등 터진다는 말이 이보다 더 잘 들어맞을 수 없다',
                exampleTranslation: 'Пока две сверхдержавы ведут торговую войну, реально страдают беззащитные малые предприятия — трудно найти более точную иллюстрацию поговорки о том, что от драки китов лопается спина креветки'
            },
            {
                korean: '닭 쫓던 개 지붕 쳐다본다',
                literal: 'собака, гонявшая курицу, смотрит на крышу',
                meaning: 'остаться ни с чем, упустить возможность',
                example: '그는 몇 년 동안 공들여 온 프로젝트가 경쟁사에 넘어가는 것을 지켜보며, 닭 쫓던 개 지붕 쳐다보듯 허탈한 표정으로 자리에 주저앉고 말았다',
                exampleTranslation: 'Наблюдая, как проект, над которым он трудился несколько лет, достался конкурентам, он лишь беспомощно опустился на стул — точь-в-точь как пёс, упустивший курицу и растерянно глядящий на крышу'
            },
            {
                korean: '원숭이도 나무에서 떨어진다',
                literal: 'и обезьяна падает с дерева',
                meaning: 'даже мастер может ошибиться',
                example: '할머니는 실수로 접시를 깨뜨려 울상이 된 손녀에게, 원숭이도 나무에서 떨어지는 법이니 너무 자책하지 말라며 다정하게 등을 두드려 주셨다',
                exampleTranslation: 'Бабушка, ласково погладив по спине внучку, расстроившуюся из-за разбитой тарелки, сказала, что и обезьяна порой падает с дерева, так что не стоит слишком корить себя'
            },
            {
                korean: '소 잃고 외양간 고친다',
                literal: 'потерял корову и чинит хлев',
                meaning: 'принимать меры после того, как беда уже случилась',
                example: '안전 점검을 미루다가 결국 화재로 큰 피해를 낸 뒤에야 소방 시설을 정비하겠다고 나서는 당국의 태도는 소 잃고 외양간 고친다는 비판을 피하기 어려워 보인다',
                exampleTranslation: 'Власти, откладывавшие проверку безопасности и взявшиеся ремонтировать противопожарные системы лишь после серьёзного пожара, едва ли избегут критики за то, что чинят хлев уже после пропажи коровы'
            },
            {
                korean: '우물 안 개구리',
                literal: 'лягушка в колодце',
                meaning: 'ограниченный человек с узким кругозором',
                example: '유학을 다녀오고 나서야 나는 그동안 내가 얼마나 우물 안 개구리처럼 좁은 세상만 보고 살아왔는지 뼈저리게 깨달았다',
                exampleTranslation: 'Только вернувшись из-за границы после учёбы, я остро осознал, насколько узким был мой взгляд на мир — я жил, словно лягушка, не покидающая колодца'
            },
            {
                korean: '가는 말이 고와야 오는 말이 곱다',
                literal: 'если уходящие слова хороши, то и приходящие будут хороши',
                meaning: 'как аукнется, так и откликнется',
                example: '어머니는 다투고 돌아온 나에게, 가는 말이 고와야 오는 말이 곱다는 옛말을 되새기며 상대에게 먼저 곱게 말을 건네 보라고 타이르셨다',
                exampleTranslation: 'Мама, узнав, что я поссорилась и вернулась домой расстроенной, напомнила старую поговорку — как аукнется, так и откликнется — и посоветовала первой заговорить с человеком по-доброму'
            },
            {
                korean: '바늘구멍으로 황소 바람 들어온다',
                literal: 'через игольное ушко входит ветер от быка',
                meaning: 'мелочи могут привести к большим проблемам',
                example: '사소한 보안 허점 하나를 방치했다가 회사 전체 전산망이 마비된 이번 사건을 보면, 바늘구멍으로 황소 바람 들어온다는 옛말이 결코 과장이 아님을 알 수 있다',
                exampleTranslation: 'Глядя на этот случай, когда из-за одной незначительной бреши в безопасности вышла из строя вся компьютерная сеть компании, понимаешь, что старая поговорка о том, что через игольное ушко может ворваться ветер от быка, вовсе не преувеличение'
            },
            {
                korean: '돌다리도 두드려 보고 건너라',
                literal: 'даже каменный мост проверь, постучав по нему, прежде чем переходить',
                meaning: 'будь осторожен даже в безопасных ситуациях',
                example: '할아버지는 계약서에 도장을 찍기 전에 조항을 몇 번이나 다시 확인하시더니, 돌다리도 두드려 보고 건너라는 법이라며 신중함을 잃지 말라고 당부하셨다',
                exampleTranslation: 'Прежде чем поставить печать на договоре, дедушка ещё несколько раз перечитал все пункты и, повторив, что даже каменный мост нужно проверить, прежде чем перейти, наказал мне никогда не терять осторожности'
            }
        ];
        
        let currentCardIndex = 0;
        let isFlipped = false;
        let quizCurrentIndex = 0;
        let correctAnswers = 0;
        let totalQuestions = 0;
        
        function loadVocabulary() {
            const grid = document.getElementById('vocabularyGrid');
            grid.innerHTML = '';
            
            idioms.forEach((idiom, index) => {
                const card = document.createElement('div');
                card.className = 'vocab-card';
                card.innerHTML = `
                    <div class="korean-idiom">${idiom.korean}</div>
                    <div class="literal-meaning">💭 ${idiom.literal}</div>
                    <div class="idiom-meaning">✨ ${idiom.meaning}</div>
                    <div class="example-sentence">
                        <div class="korean-sentence">${idiom.example}</div>
                        <div>${idiom.exampleTranslation}</div>
                    </div>
                    <button class="speak-btn" onclick="speak('${idiom.korean}', event)">🔊 Идиома</button>
                    <button class="speak-btn" onclick="speak('${idiom.example}', event)">🔊 Пример</button>
                `;
                grid.appendChild(card);
            });
            
            updateProgress();
        }
        
        function speak(text, event) {
            if (event) {
                event.stopPropagation(); // Предотвращаем переворот карточки
            }
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.7;
                speechSynthesis.speak(utterance);
            }
        }
        
        function showVocabulary() {
            document.getElementById('vocabulary-section').style.display = 'block';
            document.getElementById('flashcard-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'none';
            updateActiveButton(0);
        }
        
        function showFlashcards() {
            document.getElementById('vocabulary-section').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'block';
            document.getElementById('quiz-section').style.display = 'none';
            updateActiveButton(1);
            updateFlashcard();
        }
        
        function showQuiz() {
            document.getElementById('vocabulary-section').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            updateActiveButton(2);
            generateQuizQuestion();
        }
        
        function updateActiveButton(index) {
            const buttons = document.querySelectorAll('.mode-btn');
            buttons.forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        function updateFlashcard() {
            const idiom = idioms[currentCardIndex];
            const content = document.getElementById('flashcard-content');
            
            if (isFlipped) {
                content.innerHTML = `
                    <div class="literal-meaning">💭 ${idiom.literal}</div>
                    <div class="idiom-meaning">✨ ${idiom.meaning}</div>
                    <div class="example-sentence" style="margin-top: 15px;">
                        <div class="korean-sentence">${idiom.example}</div>
                        <div style="font-size: 0.9em; color: #666;">${idiom.exampleTranslation}</div>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <div class="korean-idiom">${idiom.korean}</div>
                    <button class="speak-btn" onclick="speak('${idiom.korean}', event)">🔊 Произнести</button>
                `;
            }
            
            document.getElementById('card-counter').textContent = `${currentCardIndex + 1} / ${idioms.length}`;
        }
        
        function flipCard() {
            isFlipped = !isFlipped;
            const flashcard = document.getElementById('flashcard');
            flashcard.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
            setTimeout(() => {
                updateFlashcard();
                flashcard.style.transform = 'rotateY(0deg)';
            }, 150);
        }
        
        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % idioms.length;
            isFlipped = false;
            updateFlashcard();
        }
        
        function prevCard() {
            currentCardIndex = (currentCardIndex - 1 + idioms.length) % idioms.length;
            isFlipped = false;
            updateFlashcard();
        }
        
        function generateQuizQuestion() {
            const idiom = idioms[quizCurrentIndex % idioms.length];
            const options = [idiom];
            
            while (options.length < 4) {
                const randomIdiom = idioms[Math.floor(Math.random() * idioms.length)];
                if (!options.includes(randomIdiom)) {
                    options.push(randomIdiom);
                }
            }
            
            options.sort(() => Math.random() - 0.5);
            
            const questionTypes = [
                `Что означает идиома "${idiom.korean}"?`,
                `Какая идиома означает "${idiom.meaning}"?`
            ];
            
            const questionType = Math.floor(Math.random() * questionTypes.length);
            document.getElementById('quiz-question').textContent = questionTypes[questionType];
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            options.forEach(option => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'quiz-option';
                
                if (questionType === 0) {
                    optionDiv.textContent = option.meaning;
                } else {
                    optionDiv.innerHTML = `${option.korean}<br><small>${option.literal}</small>`;
                }
                
                optionDiv.onclick = () => selectAnswer(option, idiom);
                optionsContainer.appendChild(optionDiv);
            });
        }
        
        function selectAnswer(selected, correct) {
            totalQuestions++;
            const options = document.querySelectorAll('.quiz-option');
            
            options.forEach(option => {
                option.onclick = null;
                if (option.textContent.includes(correct.korean) || option.textContent.includes(correct.meaning)) {
                    option.classList.add('correct');
                } else if (option.textContent.includes(selected.korean) || option.textContent.includes(selected.meaning)) {
                    option.classList.add('wrong');
                }
            });
            
            if (selected.korean === correct.korean) {
                correctAnswers++;
            }
            
            document.getElementById('correct-count').textContent = correctAnswers;
            document.getElementById('total-count').textContent = totalQuestions;
        }
        
        function nextQuestion() {
            quizCurrentIndex++;
            generateQuizQuestion();
        }
        
        function restartQuiz() {
            quizCurrentIndex = 0;
            correctAnswers = 0;
            totalQuestions = 0;
            document.getElementById('correct-count').textContent = '0';
            document.getElementById('total-count').textContent = '0';
            generateQuizQuestion();
        }
        
        function updateProgress() {
            const progress = 100;
            document.getElementById('progress').style.width = progress + '%';
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            loadVocabulary();
            updateFlashcard();
            generateQuizQuestion();
            
            // Анимация появления карточек
            const cards = document.querySelectorAll('.vocab-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.5s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });
        
        // Горячие клавиши
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('flashcard-section').style.display !== 'none') {
                if (e.code === 'Space') {
                    e.preventDefault();
                    flipCard();
                } else if (e.code === 'ArrowRight') {
                    nextCard();
                } else if (e.code === 'ArrowLeft') {
                    prevCard();
                }
            }
        });
    </script>
    <!-- Кнопка завершения урока -->
    <div style="text-align: center; margin: 40px 0; padding: 30px;">
        <button id="completeLessonBtn" onclick="completeLesson()" style="
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.2em;

            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(76,175,80,0.3);
            font-family: 'Noto Sans KR', sans-serif;
        ">Отметить урок как пройденный</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        var LESSON_ID = 'level6_lesson_13_idioms';

        function completeLesson() {
            if (window.ProgressTracker) {
                if (!ProgressTracker.markLessonCompleted(LESSON_ID)) return;
                var btn = document.getElementById('completeLessonBtn');
                btn.textContent = 'Пройдено!';
                btn.style.background = '#2e7d32';
                btn.style.cursor = 'default';
                btn.disabled = true;
                btn.style.opacity = '0.85';
                console.log('[OK] Lesson completed:', LESSON_ID);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (window.ProgressTracker) {
                var progress = ProgressTracker.get();
                if (progress && progress.completedLessons && progress.completedLessons[LESSON_ID]) {
                    var btn = document.getElementById('completeLessonBtn');
                    if (btn) {
                        btn.textContent = 'Пройдено!';
                        btn.style.background = '#2e7d32';
                        btn.style.cursor = 'default';
                        btn.disabled = true;
                        btn.style.opacity = '0.85';
                    }
                }
            }
        });
    </script>
