<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Академическая лексика - 6급</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6c5ce7, #4b3fb8, #4b3fb8);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .nav {
            background: rgba(255,255,255,0.95);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .nav a {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 10px;
            margin: 0 10px;
            display: inline-block;
            transition: all 0.3s;
        }
        
        .nav a:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }
        
        .lesson-header {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .lesson-header h1 {
            font-size: 2.5em;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .academic-animation {
            position: relative;
            height: 100px;
            margin: 20px 0;
            overflow: hidden;
            border-radius: 15px;
            background: linear-gradient(to bottom, #eef4ff, #dbe7fb);
        }
        
        .academic-emoji {
            position: absolute;
            font-size: 2.5em;
            animation: float 6s ease-in-out infinite;
        }
        
        .item1 {
            top: 20px;
            left: 10%;
            animation-delay: 0s;
        }
        
        .item2 {
            top: 40px;
            left: 30%;
            animation-delay: -1.5s;
        }
        
        .item3 {
            top: 15px;
            left: 50%;
            animation-delay: -3s;
        }
        
        .item4 {
            top: 35px;
            left: 70%;
            animation-delay: -4.5s;
        }
        
        .vocabulary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .vocab-card {
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .vocab-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #2f6fd0, #1a3f8f);
        }
        
        .vocab-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .korean-word {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
            text-align: center;
        }
        
        .pronunciation {
            font-size: 1.1em;
            color: #764ba2;
            margin-bottom: 10px;
            font-style: italic;
            text-align: center;
        }
        
        .translation {
            font-size: 1em;
            color: #666;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .example-sentence {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
            font-size: 0.9em;
        }
        
        .korean-sentence {
            font-weight: bold;
            margin-bottom: 3px;
        }
        
        .speak-btn {
            background: #764ba2;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
            font-size: 0.9em;
            color: white;
        }
        
        .speak-btn:hover {
            background: #667eea;
        }
        
        .study-mode {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .mode-btn {
            background: #764ba2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .mode-btn.active {
            background: #667eea;
        }
        
        .section {
            background: rgba(255,255,255,0.95);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .flashcard {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 20px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .flashcard:hover {
            transform: rotateY(3deg) scale(1.02);
        }
        
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        
        .flashcard::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #2f6fd0, #1a3f8f);
            border-radius: 20px 20px 0 0;
        }
        
        .quiz-section {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .quiz-question {
            font-size: 1.3em;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .quiz-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .quiz-option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .quiz-option:hover {
            background: #e9ecef;
        }
        
        .quiz-option.correct {
            background: #d4edda;
            border-color: #28a745;
        }
        
        .quiz-option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
        }
        
        .progress-bar {
            background: #e9ecef;
            border-radius: 10px;
            height: 20px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            background: linear-gradient(90deg, #2f6fd0, #1a3f8f);
            height: 100%;
            width: 0%;
            transition: width 0.5s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
    </style>
    <link rel="stylesheet" href="../../css/lesson-theme.css">
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="../index.html">← К 6급</a>

        </div>
        
        <div class="lesson-header">
            <h1>📚 Академическая лексика</h1>
            <p>Изучаем научные термины и академический стиль корейского языка</p>
            
            <div class="academic-animation">
                <div class="academic-emoji item1">📊</div>
                <div class="academic-emoji item2">🔬</div>

        </div>
        
        <div class="study-mode">
            <button class="mode-btn active" onclick="showVocabulary()">📚 Словарь</button>
            <button class="mode-btn" onclick="showFlashcards()">🃏 Карточки</button>
            <button class="mode-btn" onclick="showQuiz()">🎯 Тест</button>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        
        <div id="vocabulary-section">
            <div class="vocabulary-grid" id="vocabularyGrid">
                <!-- Будет заполнено JS -->
            </div>
        </div>
        
        <div id="flashcard-section" style="display: none;">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div id="flashcard-content">
                    <div class="korean-word" id="flashcard-korean">학술적</div>
                    <button class="speak-btn" onclick="speak(document.getElementById('flashcard-korean').textContent, event)">🔊</button>
                </div>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="mode-btn" onclick="prevCard()">← Предыдущая</button>
                <span id="card-counter">1 / 12</span>
                <button class="mode-btn" onclick="nextCard()">Следующая →</button>
            </div>
            <div style="text-align: center; margin-top: 10px; color: #666;">
                <small>Нажмите на карточку для переворота или используйте Пробел</small>
            </div>
        </div>
        
        <div id="quiz-section" style="display: none;">
            <div class="quiz-section">
                <h2>🎯 Тест: Академическая лексика</h2>
                <div class="quiz-question" id="quiz-question">
                    Как по-корейски "анализировать"?
                </div>
                <div class="quiz-options" id="quiz-options">
                    <!-- Будет заполнено JS -->
                </div>
                <div style="text-align: center; margin-top: 20px;">
                    <button class="mode-btn" onclick="nextQuestion()">Следующий вопрос</button>
                    <button class="mode-btn" onclick="restartQuiz()">Начать заново</button>
                </div>
                <div id="quiz-stats" style="text-align: center; margin-top: 20px;">
                    Правильных ответов: <span id="correct-count">0</span> из <span id="total-count">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const vocabulary = [
            {
                korean: '학술적',
                pronunciation: 'хак-суль-чжок',
                translation: 'академический',
                example: '학술적 엄밀성을 갖추지 못한 주장일지라도 대중의 공감을 얻는 경우가 적지 않다는 점에서, 학문적 신뢰성과 사회적 파급력은 반드시 비례하지 않는다고 볼 수 있다',
                exampleTranslation: 'Даже утверждения, лишённые академической строгости, нередко находят широкий отклик у публики, из чего можно заключить, что научная достоверность и общественное влияние отнюдь не всегда прямо пропорциональны'
            },
            {
                korean: '분석하다',
                pronunciation: 'пун-сок-ха-да',
                translation: 'анализировать',
                example: '방대한 데이터를 다각도로 분석함으로써 기존 통념으로는 설명되지 않던 현상의 이면을 규명할 수 있었다',
                exampleTranslation: 'Проанализировав обширный массив данных с разных сторон, удалось прояснить скрытые причины явления, которое прежние общепринятые представления объяснить не могли'
            },
            {
                korean: '객관적',
                pronunciation: 'кэк-гван-чжок',
                translation: 'объективный',
                example: '연구자 개인의 신념이나 이해관계로 인해 판단이 흐려질 수 있다는 점을 감안할 때, 객관적 기준에 근거한 평가 체계를 마련하는 일이야말로 학문적 공정성을 담보하는 요체라 할 것이다',
                exampleTranslation: 'Учитывая, что личные убеждения или интересы исследователя способны исказить суждение, именно разработка системы оценки, опирающейся на объективные критерии, и является тем стержнем, что обеспечивает научную беспристрастность'
            },
            {
                korean: '주관적',
                pronunciation: 'чу-гван-чжок',
                translation: 'субъективный',
                example: '아무리 논리를 갖추어 서술한다 하더라도 해석의 틀 자체가 연구자의 주관적 경험에서 비롯된 것이라면, 그 결론 또한 완전히 중립적일 수는 없다고 주장하는 학자들이 적지 않다',
                exampleTranslation: 'Немало учёных утверждает, что, сколь бы логично ни было изложение, если сама интерпретационная рамка проистекает из субъективного опыта исследователя, то и выводы не могут быть полностью нейтральными'
            },
            {
                korean: '논리적',
                pronunciation: 'нон-ни-чжок',
                translation: 'логический',
                example: '전제와 결론 사이의 연결 고리가 성글다는 지적이 제기될지라도, 논리적 정합성을 끝까지 추구하려는 태도야말로 학문적 논증이 갖추어야 할 최소한의 조건이라 할 수 있다',
                exampleTranslation: 'Даже если и высказываются замечания о слабости связи между посылкой и выводом, именно стремление до конца выдерживать логическую последовательность и есть тот минимум, которому должна отвечать научная аргументация'
            },
            {
                korean: '체계적',
                pronunciation: 'че-ге-чжок',
                translation: 'систематический',
                example: '산발적인 자료 수집만으로는 전체 흐름을 파악하기 어렵기에, 체계적으로 분류된 방법론에 입각하여 연구를 진행하는 것이 장기적으로 볼 때 훨씬 효율적이라는 결론에 이르렀다',
                exampleTranslation: 'Поскольку разрозненный сбор материалов не позволяет уяснить общую картину, был сделан вывод, что проведение исследования на основе систематически упорядоченной методологии в долгосрочной перспективе куда эффективнее'
            },
            {
                korean: '연구하다',
                pronunciation: 'ён-гу-ха-да',
                translation: 'исследовать',
                example: '선행 연구가 미비한 분야일수록 오히려 새로운 관점에서 연구할 만한 가치가 있다고 판단한 그는, 십 년이 넘도록 한 우물만 파며 해당 주제를 파고들었다',
                exampleTranslation: 'Рассудив, что именно те области, где предшествующих исследований недостаточно, тем более заслуживают изучения под новым углом, он более десяти лет упорно, не отвлекаясь ни на что иное, погружался в эту тему'
            },
            {
                korean: '가설',
                pronunciation: 'ка-соль',
                translation: 'гипотеза',
                example: '기존 이론으로는 설명되지 않는 변수가 발견됨에 따라, 연구진은 그 원인을 규명하고자 새로운 가설을 세우는 한편 이를 검증할 실험 설계에 착수하였다',
                exampleTranslation: 'После того как была обнаружена переменная, не объяснимая существующей теорией, исследовательская группа, стремясь установить её причину, выдвинула новую гипотезу и одновременно приступила к разработке эксперимента для её проверки'
            },
            {
                korean: '실험',
                pronunciation: 'силь-хом',
                translation: 'эксперимент',
                example: '변수를 통제한 상태에서 동일한 조건 하에 실험을 반복적으로 실시함으로써만 우연에 의한 결과와 필연적 인과관계를 구별해 낼 수 있다는 것이 방법론적으로 확립된 견해이다',
                exampleTranslation: 'Методологически устоявшимся считается мнение, что отличить случайный результат от необходимой причинной связи возможно лишь путём многократного проведения эксперимента при контролируемых переменных в одинаковых условиях'
            },
            {
                korean: '이론',
                pronunciation: 'и-рон',
                translation: 'теория',
                example: '기존 패러다임으로 설명되지 않는 현상이 누적되자, 그는 학계의 반발을 무릅쓰고서라도 이를 통합적으로 해석할 새로운 이론을 제시하기에 이르렀다',
                exampleTranslation: 'Когда накопились явления, не объяснимые прежней парадигмой, он в конце концов представил новую теорию, способную объединить их толкование, невзирая на неизбежное сопротивление научного сообщества'
            },
            {
                korean: '증명하다',
                pronunciation: 'чын-мён-ха-да',
                translation: 'доказывать',
                example: '반증 가능성을 열어 둔 채로 설계된 실험이었기에, 도출된 결과가 가설을 증명한다고 단정 짓기보다는 잠정적으로 뒷받침한다고 표현하는 편이 학문적으로 타당하다고 본다',
                exampleTranslation: 'Поскольку эксперимент изначально был спроектирован с допущением фальсифицируемости, с научной точки зрения корректнее говорить, что полученные результаты лишь предварительно подтверждают гипотезу, нежели утверждать, будто они её окончательно доказывают'
            },
            {
                korean: '결론',
                pronunciation: 'кёль-лон',
                translation: 'заключение',
                example: '표본의 규모가 제한적이었다는 한계에도 불구하고, 수집된 자료가 일관되게 동일한 경향을 보였다는 점에 근거하여 잠정적인 결론을 내리는 데는 무리가 없다고 판단된다',
                exampleTranslation: 'Несмотря на ограниченность, обусловленную небольшим объёмом выборки, представляется вполне обоснованным сделать предварительное заключение, опираясь на то, что собранные данные неизменно демонстрировали одну и ту же тенденцию'
            }
        ];
        
        let currentCardIndex = 0;
        let isFlipped = false;
        let quizCurrentIndex = 0;
        let correctAnswers = 0;
        let totalQuestions = 0;
        
        function loadVocabulary() {
            const grid = document.getElementById('vocabularyGrid');
            grid.innerHTML = '';
            
            vocabulary.forEach((word, index) => {
                const card = document.createElement('div');
                card.className = 'vocab-card';
                card.innerHTML = `
                    <div class="korean-word">${word.korean}</div>
                    <div class="pronunciation">${word.pronunciation}</div>
                    <div class="translation">${word.translation}</div>
                    <div class="example-sentence">
                        <div class="korean-sentence">${word.example}</div>
                        <div>${word.exampleTranslation}</div>
                    </div>
                    <button class="speak-btn" onclick="speak('${word.korean}', event)">🔊 Слово</button>
                    <button class="speak-btn" onclick="speak('${word.example}', event)">🔊 Пример</button>
                `;
                grid.appendChild(card);
            });
            
            updateProgress();
        }
        
        function speak(text, event) {
            if (event) {
                event.stopPropagation(); // Предотвращаем переворот карточки
            }
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            }
        }
        
        function showVocabulary() {
            document.getElementById('vocabulary-section').style.display = 'block';
            document.getElementById('flashcard-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'none';
            updateActiveButton(0);
        }
        
        function showFlashcards() {
            document.getElementById('vocabulary-section').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'block';
            document.getElementById('quiz-section').style.display = 'none';
            updateActiveButton(1);
            updateFlashcard();
        }
        
        function showQuiz() {
            document.getElementById('vocabulary-section').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            updateActiveButton(2);
            generateQuizQuestion();
        }
        
        function updateActiveButton(index) {
            const buttons = document.querySelectorAll('.mode-btn');
            buttons.forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        function updateFlashcard() {
            const word = vocabulary[currentCardIndex];
            const content = document.getElementById('flashcard-content');
            
            if (isFlipped) {
                content.innerHTML = `
                    <div class="pronunciation">${word.pronunciation}</div>
                    <div class="translation">${word.translation}</div>
                    <div class="example-sentence" style="margin-top: 15px;">
                        <div class="korean-sentence">${word.example}</div>
                        <div style="font-size: 0.9em; color: #666;">${word.exampleTranslation}</div>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <div class="korean-word">${word.korean}</div>
                    <button class="speak-btn" onclick="speak('${word.korean}', event)">🔊 Слово</button>
                `;
            }
            
            document.getElementById('card-counter').textContent = `${currentCardIndex + 1} / ${vocabulary.length}`;
        }
        
        function flipCard() {
            isFlipped = !isFlipped;
            const flashcard = document.getElementById('flashcard');
            flashcard.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
            setTimeout(() => {
                updateFlashcard();
                flashcard.style.transform = 'rotateY(0deg)';
            }, 150);
        }
        
        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % vocabulary.length;
            isFlipped = false;
            updateFlashcard();
        }
        
        function prevCard() {
            currentCardIndex = (currentCardIndex - 1 + vocabulary.length) % vocabulary.length;
            isFlipped = false;
            updateFlashcard();
        }
        
        function generateQuizQuestion() {
            const word = vocabulary[quizCurrentIndex % vocabulary.length];
            const options = [word];
            
            while (options.length < 4) {
                const randomWord = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                if (!options.includes(randomWord)) {
                    options.push(randomWord);
                }
            }
            
            options.sort(() => Math.random() - 0.5);
            
            const questionTypes = [
                `Как по-корейски "${word.translation}"?`,
                `Что означает "${word.korean}"?`
            ];
            
            const questionType = Math.floor(Math.random() * questionTypes.length);
            document.getElementById('quiz-question').textContent = questionTypes[questionType];
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            options.forEach(option => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'quiz-option';
                
                if (questionType === 0) {
                    optionDiv.innerHTML = `${option.korean} <br><small>(${option.pronunciation})</small>`;
                } else {
                    optionDiv.textContent = option.translation;
                }
                
                optionDiv.onclick = () => selectAnswer(option, word);
                optionsContainer.appendChild(optionDiv);
            });
        }
        
        function selectAnswer(selected, correct) {
            totalQuestions++;
            const options = document.querySelectorAll('.quiz-option');
            
            options.forEach(option => {
                option.onclick = null;
                if (option.textContent.includes(correct.korean) || option.textContent.includes(correct.translation)) {
                    option.classList.add('correct');
                } else if (option.textContent.includes(selected.korean) || option.textContent.includes(selected.translation)) {
                    option.classList.add('wrong');
                }
            });
            
            if (selected.korean === correct.korean) {
                correctAnswers++;
            }
            
            document.getElementById('correct-count').textContent = correctAnswers;
            document.getElementById('total-count').textContent = totalQuestions;
        }
        
        function nextQuestion() {
            quizCurrentIndex++;
            generateQuizQuestion();
        }
        
        function restartQuiz() {
            quizCurrentIndex = 0;
            correctAnswers = 0;
            totalQuestions = 0;
            document.getElementById('correct-count').textContent = '0';
            document.getElementById('total-count').textContent = '0';
            generateQuizQuestion();
        }
        
        function updateProgress() {
            const progress = 100;
            document.getElementById('progress').style.width = progress + '%';
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            loadVocabulary();
            updateFlashcard();
            generateQuizQuestion();
            
            // Анимация появления карточек
            const cards = document.querySelectorAll('.vocab-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.5s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });
        
        // Горячие клавиши
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('flashcard-section').style.display !== 'none') {
                if (e.code === 'Space') {
                    e.preventDefault();
                    flipCard();
                } else if (e.code === 'ArrowRight') {
                    nextCard();
                } else if (e.code === 'ArrowLeft') {
                    prevCard();
                }
            }
        });
    </script>
    <!-- Кнопка завершения урока -->
    <div style="text-align: center; margin: 40px 0; padding: 30px;">
        <button id="completeLessonBtn" onclick="completeLesson()" style="
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.2em;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(76,175,80,0.3);
            font-family: 'Noto Sans KR', sans-serif;
        ">Отметить урок как пройденный</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="../../js/firebase-config.js"></script>
    <script src="../../js/firebase-sync.js"></script>
    <script src="../../js/firebase-auth.js"></script>
    <script src="../../js/progress-tracker.js"></script>
    <script>
        var LESSON_ID = 'level6_lesson_12_academic';

        function completeLesson() {
            if (window.ProgressTracker) {
                if (!ProgressTracker.markLessonCompleted(LESSON_ID)) return;
                var btn = document.getElementById('completeLessonBtn');
                btn.textContent = 'Пройдено!';
                btn.style.background = '#2e7d32';
                btn.style.cursor = 'default';
                btn.disabled = true;
                btn.style.opacity = '0.85';
                console.log('[OK] Lesson completed:', LESSON_ID);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (window.ProgressTracker) {
                var progress = ProgressTracker.get();
                if (progress && progress.completedLessons && progress.completedLessons[LESSON_ID]) {
                    var btn = document.getElementById('completeLessonBtn');
                    if (btn) {
                        btn.textContent = 'Пройдено!';
                        btn.style.background = '#2e7d32';
                        btn.style.cursor = 'default';
                        btn.disabled = true;
                        btn.style.opacity = '0.85';
                    }
                }
            }
        });
    </script>
