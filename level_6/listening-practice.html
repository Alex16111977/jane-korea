</div>

var SPEAKER_LABEL = { W: '여자', M: '남자' };

// ================================================================
// STATE
// ================================================================
var LISTEN_KEY = 'koreanListeningPractice';
var state = { catKey: null, speed: 1.0, idx: 0, score: 0, answers: [] };

function loadStats() {
    try { var d = localStorage.getItem(LISTEN_KEY); return d ? JSON.parse(d) : {}; }
    catch (e) { console.error('[ERROR] loadStats:', e); return {}; }
}
function saveStats(stats) {
    try { localStorage.setItem(LISTEN_KEY, JSON.stringify(stats)); }
    catch (e) { console.error('[ERROR] saveStats:', e); }
}
function recordResult(catKey, score, total) {
    var stats = loadStats();
    var pct = Math.round((score / total) * 100);
    var prev = stats[catKey] || { best: 0, attempts: 0 };
    stats[catKey] = { best: Math.max(prev.best || 0, pct), attempts: (prev.attempts || 0) + 1, lastPct: pct };
    saveStats(stats);
}

// ================================================================
// TTS PLAYBACK
// ================================================================
function speak(text, rate, pitch, onend) {
    if (!('speechSynthesis' in window)) { if (onend) onend(); return; }
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = rate;
    u.pitch = pitch;
    u.onend = function() { if (onend) onend(); };
    u.onerror = function() { if (onend) onend(); };
    window.speechSynthesis.speak(u);
}

function playItem(item, speakerEl) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    speakerEl.classList.add('playing');

    if (item.script) {
        speak(item.script, state.speed, 1.0, function() { speakerEl.classList.remove('playing'); });
        return;
    }

    var turns = item.turns;
    var i = 0;
    function playNext() {
        if (i >= turns.length) { speakerEl.classList.remove('playing'); return; }
        var turn = turns[i];
        var pitch = turn.spk === 'W' ? 1.25 : 0.82;
        i++;
        speak(turn.t, state.speed, pitch, function() {
            setTimeout(playNext, 350);
        });
    }
    playNext();
}

function getTranscript(item) {
    if (item.script) return item.script;
    return item.turns.map(function(t) { return SPEAKER_LABEL[t.spk] + ': ' + t.t; }).join('\n');
}

// ================================================================
// CATEGORY GRID
// ================================================================
function renderGrid() {
    var stats = loadStats();
    var grid = document.getElementById('categoryGrid');
    grid.innerHTML = '';
    Object.keys(CATEGORIES).forEach(function(key) {
        var cat = CATEGORIES[key];
        var s = stats[key];
        var card = document.createElement('div');
        card.className = 'cat-card';
        card.onclick = function() { openCategory(key); };
        var metaText = cat.items.length + ' заданий';
        if (s) metaText += ' <span class="cat-best">· лучший результат: ' + s.best + '%</span>';
        card.innerHTML =
            '<div class="cat-icon">' + cat.icon + '</div>' +
            '<div class="cat-title">' + cat.title + '</div>' +
            '<div class="cat-subtitle">' + cat.subtitle + '</div>' +
            '<div class="cat-meta">' + metaText + '</div>';
        grid.appendChild(card);
    });
}

window.openCategory = function(key) {
    state.catKey = key;
    var cat = CATEGORIES[key];
    document.getElementById('gridScreen').classList.add('hidden');
    document.getElementById('startScreen').classList.remove('hidden');
    document.getElementById('startEmoji').textContent = cat.icon;
    document.getElementById('startTitle').textContent = cat.title + ' (' + cat.subtitle + ')';
    document.getElementById('startDesc').textContent = cat.items.length + ' заданий на слух. Каждое можно переслушать сколько угодно раз.';
};

window.backToGrid = function() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('progressWrapper').classList.add('hidden');
    document.getElementById('itemCard').classList.add('hidden');
    document.getElementById('resultsCard').classList.add('hidden');
    document.getElementById('gridScreen').classList.remove('hidden');
    renderGrid();
};

window.setSpeed = function(val) {
    state.speed = val;
    document.getElementById('speedSlow').classList.toggle('active', val === 0.85);
    document.getElementById('speedNormal').classList.toggle('active', val === 1.0);
};

// ================================================================
// PRACTICE FLOW
// ================================================================
window.startCategory = function() {
    state.idx = 0;
    state.score = 0;
    state.answers = [];

    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('resultsCard').classList.add('hidden');
    document.getElementById('progressWrapper').classList.remove('hidden');
    document.getElementById('itemCard').classList.remove('hidden');
    renderItem();
};

function goNext() {
    state.idx++;
    var items = CATEGORIES[state.catKey].items;
    if (state.idx < items.length) {
        renderItem();
    } else {
        showResults();
    }
}

function renderItem() {
    var cat = CATEGORIES[state.catKey];
    var item = cat.items[state.idx];
    var total = cat.items.length;

    document.getElementById('progressLabel').textContent = 'Задание ' + (state.idx + 1) + ' из ' + total;
    document.getElementById('progressCat').textContent = cat.icon + ' ' + cat.title;
    document.getElementById('progressFill').style.width = ((state.idx / total) * 100) + '%';

    var card = document.getElementById('itemCard');
    card.innerHTML = '';

    var speaker = document.createElement('div');
    speaker.className = 'audio-speaker';
    speaker.textContent = '🔊';
    speaker.onclick = function() { playItem(item, speaker); };
    card.appendChild(speaker);

    var hint = document.createElement('div');
    hint.className = 'audio-hint';
    hint.textContent = 'Нажмите на динамик, чтобы прослушать';
    card.appendChild(hint);

    var replayRow = document.createElement('div');
    replayRow.className = 'replay-row';
    var replayBtn = document.createElement('button');
    replayBtn.className = 'replay-btn';
    replayBtn.textContent = '🔁 Переслушать';
    replayBtn.onclick = function() { playItem(item, speaker); };
    replayRow.appendChild(replayBtn);
    card.appendChild(replayRow);

    var qEl = document.createElement('div');
    qEl.className = 'question-text';
    qEl.textContent = item.q;
    card.appendChild(qEl);

    var list = document.createElement('ul');
    list.className = 'options-list';
    item.opts.forEach(function(opt, i) {
        var li = document.createElement('li');
        var btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = function() { answerItem(i, item, btn, list); };
        li.appendChild(btn);
        list.appendChild(li);
    });
    card.appendChild(list);

    var toggleBtn = document.createElement('button');
    toggleBtn.className = 'transcript-toggle';
    toggleBtn.textContent = '스크립트 보기 (после ответа)';
    toggleBtn.disabled = true;
    var transcriptBox = document.createElement('div');
    transcriptBox.className = 'transcript-box';
    transcriptBox.textContent = getTranscript(item);
    toggleBtn.onclick = function() { transcriptBox.classList.toggle('visible'); };
    card.appendChild(toggleBtn);
    card.appendChild(transcriptBox);

    var next = document.createElement('button');
    next.className = 'next-btn';
    next.textContent = 'Далее →';
    next.onclick = goNext;
    card.appendChild(next);

    // Autoplay once on render so listening doesn't require an extra click every time
    setTimeout(function() { playItem(item, speaker); }, 300);
}

function answerItem(selected, item, btnEl, listEl) {
    var buttons = listEl.querySelectorAll('.option-btn');
    if (buttons[0].classList.contains('disabled')) return;
    for (var i = 0; i < buttons.length; i++) buttons[i].classList.add('disabled');

    var ok = selected === item.c;
    btnEl.classList.add(ok ? 'correct' : 'wrong');
    if (!ok) buttons[item.c].classList.add('correct');
    if (ok) state.score++;

    state.answers.push({ q: item.q, selected: item.opts[selected], correct: item.opts[item.c], ok: ok });

    var card = document.getElementById('itemCard');
    card.querySelector('.transcript-toggle').disabled = false;
    card.querySelector('.next-btn').classList.add('visible');
}

// ================================================================
// RESULTS
// ================================================================
function showResults() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    document.getElementById('progressWrapper').classList.add('hidden');
    document.getElementById('itemCard').classList.add('hidden');
    document.getElementById('resultsCard').classList.remove('hidden');

    var cat = CATEGORIES[state.catKey];
    var total = cat.items.length;
    var pct = Math.round((state.score / total) * 100);
    recordResult(state.catKey, state.score, total);

    var emoji, title, verdictHtml, verdictClass;
    if (pct >= 90) {
        emoji = '🏆'; title = 'Отлично слышите на слух!';
        verdictHtml = '<h3>🌟 Уверенное понимание на слух</h3><p>Попробуйте следующую категорию или увеличьте скорость воспроизведения для ещё большего вызова.</p>';
        verdictClass = 'background:#e8f5e9;border-left:4px solid #4caf50;';
    } else if (pct >= 70) {
        emoji = '👍'; title = 'Хороший результат';
        verdictHtml = '<h3>✅ Хорошее понимание на слух</h3><p>Разберите ошибки ниже, переслушайте скрипт и попробуйте снова через день-два.</p>';
        verdictClass = 'background:#fff8e1;border-left:4px solid #ffc107;';
    } else if (pct >= 50) {
        emoji = '💪'; title = 'Есть над чем поработать';
        verdictHtml = '<h3>📖 Средний результат</h3><p>Попробуйте режим 0.85x для тренировки, прежде чем переходить на реальную скорость.</p>';
        verdictClass = 'background:#fff3e0;border-left:4px solid #ff9800;';
    } else {
        emoji = '📚'; title = 'Нужно больше практики';
        verdictHtml = '<h3>🌱 Продолжайте тренироваться</h3><p>Понимание быстрой неотредактированной речи — самый сложный навык C2. Начните с медленной скорости и переслушивайте каждое задание несколько раз.</p>';
        verdictClass = 'background:#ffebee;border-left:4px solid #f44336;';
    }

    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultScore').textContent = cat.icon + ' ' + cat.title + ': ' + state.score + ' из ' + total + ' (' + pct + '%)';
    var verdict = document.getElementById('resultVerdict');
    verdict.innerHTML = verdictHtml;
    verdict.style.cssText = verdictClass + 'border-radius:0 14px 14px 0;padding:18px 20px;';

    var list = document.getElementById('reviewList');
    list.innerHTML = '';
    state.answers.forEach(function(a, i) {
        var div = document.createElement('div');
        div.className = 'review-item ' + (a.ok ? 'correct-item' : 'wrong-item');
        var html = '<strong>' + (i + 1) + '.</strong> ' + a.q + '<br>';
        if (a.ok) {
            html += 'Ваш ответ: <span style="color:#2e7d32">' + a.selected + '</span>';
        } else {
            html += 'Ваш ответ: <span style="color:#c62828;text-decoration:line-through">' + a.selected + '</span> → <span style="color:#2e7d32">' + a.correct + '</span>';
        }
        div.innerHTML = html;
        list.appendChild(div);
    });

    console.log('[OK] Listening practice (' + state.catKey + '): ' + state.score + '/' + total);
}

window.toggleReview = function() {
    var list = document.getElementById('reviewList');
    var btn = document.getElementById('reviewToggle');
    list.classList.toggle('open');
    btn.textContent = list.classList.contains('open') ? 'Скрыть разбор ответов' : 'Показать разбор ответов';
};

renderGrid();
