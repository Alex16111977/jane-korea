<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💻 IT-лексика - 6급</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2f6fd0, #1a3f8f, #1a3f8f);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .nav {
            background: rgba(255,255,255,0.95);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .nav a {
            background: #0D47A1;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 10px;
            margin: 0 10px;
            display: inline-block;
            transition: all 0.3s;
        }

        .nav a:hover {
            background: #08306B;
            transform: translateY(-2px);
        }

        .lesson-header {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .lesson-header h1 {
            font-size: 2.2em;
            color: #0D47A1;
            margin-bottom: 10px;
        }

        .topic-animation {
            position: relative;
            height: 100px;
            margin: 20px 0;
            overflow: hidden;
            border-radius: 15px;
            background: linear-gradient(to bottom, #eef4ff, #dbe7fb);
        }

        .topic-emoji {
            position: absolute;
            font-size: 2.5em;
            animation: float 6s ease-in-out infinite;
        }

        .item1 { top: 20px; left: 10%; animation-delay: 0s; }
        .item2 { top: 40px; left: 30%; animation-delay: -1.5s; }
        .item3 { top: 15px; left: 50%; animation-delay: -3s; }
        .item4 { top: 35px; left: 70%; animation-delay: -4.5s; }

        .vocabulary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .vocab-card {
            background: rgba(255,255,255,0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .vocab-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #2f6fd0, #1a3f8f);
        }

        .vocab-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .korean-word {
            font-size: 1.8em;
            font-weight: bold;
            color: #0D47A1;
            margin-bottom: 8px;
            text-align: center;
        }

        .pronunciation {
            font-size: 1.1em;
            color: #1565C0;
            margin-bottom: 10px;
            font-style: italic;
            text-align: center;
        }

        .translation {
            font-size: 1.1em;
            color: #1976D2;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 500;
        }

        .example-sentence {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #0D47A1;
            font-size: 0.9em;
        }

        .korean-sentence { font-weight: bold; margin-bottom: 5px; }

        .speak-btn {
            background: #1565C0;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
            font-size: 0.9em;
            color: white;
        }

        .speak-btn:hover { background: #0D47A1; }

        .study-mode {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: #1565C0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-btn.active { background: #0D47A1; }

        .flashcard {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 20px;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            position: relative;
        }

        .flashcard:hover { transform: rotateY(3deg) scale(1.02); }

        .flashcard::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #2f6fd0, #1a3f8f);
            border-radius: 20px 20px 0 0;
        }

        .quiz-section {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .quiz-question { font-size: 1.3em; margin-bottom: 20px; text-align: center; }

        .quiz-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .quiz-option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .quiz-option:hover { background: #e9ecef; }
        .quiz-option.correct { background: #d4edda; border-color: #28a745; }
        .quiz-option.wrong { background: #f8d7da; border-color: #dc3545; }

        .progress-bar {
            background: #e9ecef;
            border-radius: 10px;
            height: 20px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #2f6fd0, #1a3f8f);
            height: 100%;
            width: 0%;
            transition: width 0.5s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
    </style>
    <link rel="stylesheet" href="../../css/lesson-theme.css">
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="../index.html">← К 6급</a>
            <a href="../../index.html">🏠 Главная</a>
        </div>

        <div class="lesson-header">
            <h1>💻 IT-лексика (IT·기술 용어)</h1>
            <p>Алгоритмы, кибербезопасность, облачные технологии — язык индустрии на уровне носителя</p>

            <div class="topic-animation">
                <div class="topic-emoji item1">💻</div>
                <div class="topic-emoji item2">🔐</div>
                <div class="topic-emoji item3">☁️</div>
                <div class="topic-emoji item4">🖥️</div>
            </div>
        </div>

        <div class="study-mode">
            <button class="mode-btn active" onclick="showVocabulary()">📚 IT-лексика</button>
            <button class="mode-btn" onclick="showFlashcards()">🃏 Карточки</button>
            <button class="mode-btn" onclick="showQuiz()">🎯 Тест</button>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div id="vocabulary-section">
            <div class="vocabulary-grid" id="vocabularyGrid"></div>
        </div>

        <div id="flashcard-section" style="display: none;">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div id="flashcard-content">
                    <div class="korean-word" id="flashcard-korean">알고리즘</div>
                    <button class="speak-btn" onclick="speak(document.getElementById('flashcard-korean').textContent, event)">🔊</button>
                </div>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="mode-btn" onclick="prevCard()">← Предыдущая</button>
                <span id="card-counter">1 / 12</span>
                <button class="mode-btn" onclick="nextCard()">Следующая →</button>
            </div>
            <div style="text-align: center; margin-top: 10px; color: #666;">
                <small>Нажмите на карточку для переворота или используйте Пробел</small>
            </div>
        </div>

        <div id="quiz-section" style="display: none;">
            <div class="quiz-section">
                <h2>🎯 Тест: IT-лексика</h2>
                <div class="quiz-question" id="quiz-question">Как по-корейски "алгоритм"?</div>
                <div class="quiz-options" id="quiz-options"></div>
                <div style="text-align: center; margin-top: 20px;">
                    <button class="mode-btn" onclick="nextQuestion()">Следующий вопрос</button>
                    <button class="mode-btn" onclick="restartQuiz()">Начать заново</button>
                </div>
                <div id="quiz-stats" style="text-align: center; margin-top: 20px;">
                    Правильных ответов: <span id="correct-count">0</span> из <span id="total-count">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const vocabulary = [
            {
                korean: '알고리즘',
                pronunciation: 'альгоридым',
                translation: 'алгоритм',
                example: '이 회사는 사용자의 취향을 정교하게 분석하는 추천 알고리즘을 개발함으로써 매출을 크게 늘렸다고 밝혔다',
                exampleTranslation: 'Компания заявила, что значительно увеличила выручку благодаря разработке алгоритма рекомендаций, тонко анализирующего вкусы пользователей'
            },
            {
                korean: '클라우드 컴퓨팅',
                pronunciation: 'кыллаудеу компхютхин',
                translation: 'облачные вычисления',
                example: '기업들은 초기 투자 비용을 줄이고자 자체 서버 대신 클라우드 컴퓨팅 서비스로 전환하는 추세를 보이고 있다',
                exampleTranslation: 'Наблюдается тенденция, при которой компании переходят с собственных серверов на облачные вычисления, чтобы снизить первоначальные инвестиционные затраты'
            },
            {
                korean: '사이버 보안',
                pronunciation: 'сайбо боан',
                translation: 'кибербезопасность',
                example: '최근 대규모 해킹 사건이 잇따라 발생하면서 기업들은 사이버 보안에 대한 투자를 대폭 확대하고 있다',
                exampleTranslation: 'После череды крупных хакерских атак компании значительно увеличивают инвестиции в кибербезопасность'
            },
            {
                korean: '데이터 유출',
                pronunciation: 'тэйтхо ючхуль',
                translation: 'утечка данных',
                example: '해당 업체는 고객 수백만 명의 개인정보가 데이터 유출로 인해 노출되었다고 공식 사과했다',
                exampleTranslation: 'Компания официально принесла извинения за то, что из-за утечки данных были раскрыты личные данные миллионов клиентов'
            },
            {
                korean: '소프트웨어 개발',
                pronunciation: 'сопхытхыуэо кэбаль',
                translation: 'разработка ПО',
                example: '소프트웨어 개발 기간을 단축하기 위해 팀은 애자일 방식을 도입하기로 결정했다',
                exampleTranslation: 'Чтобы сократить сроки разработки ПО, команда решила внедрить гибкую (Agile) методологию'
            },
            {
                korean: '서버',
                pronunciation: 'собо',
                translation: 'сервер',
                example: '접속자가 폭주하면서 서버가 다운되는 사태가 발생하자, 회사는 긴급히 인프라를 증설했다',
                exampleTranslation: 'Когда наплыв пользователей привёл к падению сервера, компания в срочном порядке расширила инфраструктуру'
            },
            {
                korean: '프로그래밍 언어',
                pronunciation: 'пхырогырэминъ оно',
                translation: 'язык программирования',
                example: '입문자에게는 문법이 비교적 간단한 프로그래밍 언어부터 배우는 것이 효율적이라고 전문가들은 조언한다',
                exampleTranslation: 'Эксперты советуют новичкам начинать с изучения языков программирования с относительно простым синтаксисом'
            },
            {
                korean: '빅데이터',
                pronunciation: 'пиктэйтхо',
                translation: 'большие данные',
                example: '기업은 소비자 행동을 예측하기 위해 빅데이터 분석 기술을 적극적으로 활용하고 있다',
                exampleTranslation: 'Компания активно использует технологии анализа больших данных для прогнозирования потребительского поведения'
            },
            {
                korean: '해킹',
                pronunciation: 'хэкхинъ',
                translation: 'хакерство, взлом',
                example: '정부 기관을 겨냥한 해킹 시도가 급증하면서 관련 부처는 비상 대응 체계를 가동했다',
                exampleTranslation: 'В связи с резким ростом попыток взлома, направленных против правительственных учреждений, соответствующее ведомство запустило систему экстренного реагирования'
            },
            {
                korean: '암호화',
                pronunciation: 'амхохва',
                translation: 'шифрование',
                example: '민감한 개인정보는 전송 과정에서 반드시 암호화되어야 하며, 그렇지 않을 경우 법적 책임을 물을 수 있다',
                exampleTranslation: 'Конфиденциальные персональные данные обязательно должны шифроваться при передаче, в противном случае возможна юридическая ответственность'
            },
            {
                korean: '플랫폼',
                pronunciation: 'пхыллэтпхом',
                translation: 'платформа',
                example: '이 스타트업은 자체 플랫폼을 통해 판매자와 소비자를 직접 연결함으로써 유통 비용을 대폭 절감했다',
                exampleTranslation: 'Этот стартап значительно снизил издержки на дистрибуцию, напрямую соединяя продавцов и потребителей через собственную платформу'
            },
            {
                korean: '사물인터넷',
                pronunciation: 'самуль-индонет',
                translation: 'интернет вещей (IoT)',
                example: '사물인터넷 기술의 발달로 가전제품들을 스마트폰 하나로 손쉽게 제어할 수 있게 되었다',
                exampleTranslation: 'Благодаря развитию технологий интернета вещей бытовую технику теперь можно легко управлять с помощью одного смартфона'
            }
        ];

        let currentCardIndex = 0;
        let isFlipped = false;
        let quizCurrentIndex = 0;
        let correctAnswers = 0;
        let totalQuestions = 0;

        function loadVocabulary() {
            const grid = document.getElementById('vocabularyGrid');
            grid.innerHTML = '';

            vocabulary.forEach((word, index) => {
                const card = document.createElement('div');
                card.className = 'vocab-card';
                card.innerHTML = `
                    <div class="korean-word">${word.korean}</div>
                    <div class="pronunciation">${word.pronunciation}</div>
                    <div class="translation">${word.translation}</div>
                    <div class="example-sentence">
                        <div class="korean-sentence">${word.example}</div>
                        <div>${word.exampleTranslation}</div>
                    </div>
                    <button class="speak-btn" onclick="speak('${word.korean}', event)">🔊 Слово</button>
                    <button class="speak-btn" onclick="speak('${word.example}', event)">🔊 Пример</button>
                `;
                grid.appendChild(card);
            });

            updateProgress();
        }

        function speak(text, event) {
            if (event) event.stopPropagation();
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            }
        }

        function showVocabulary() {
            document.getElementById('vocabulary-section').style.display = 'block';
            document.getElementById('flashcard-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'none';
            updateActiveButton(0);
        }

        function showFlashcards() {
            document.getElementById('vocabulary-section').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'block';
            document.getElementById('quiz-section').style.display = 'none';
            updateActiveButton(1);
            updateFlashcard();
        }

        function showQuiz() {
            document.getElementById('vocabulary-section').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            updateActiveButton(2);
            generateQuizQuestion();
        }

        function updateActiveButton(index) {
            const buttons = document.querySelectorAll('.mode-btn');
            buttons.forEach((btn, i) => btn.classList.toggle('active', i === index));
        }

        function updateFlashcard() {
            const word = vocabulary[currentCardIndex];
            const content = document.getElementById('flashcard-content');

            if (isFlipped) {
                content.innerHTML = `
                    <div class="pronunciation">${word.pronunciation}</div>
                    <div class="translation">${word.translation}</div>
                    <div class="example-sentence" style="margin-top: 15px;">
                        <div class="korean-sentence">${word.example}</div>
                        <div style="font-size: 0.9em; color: #666;">${word.exampleTranslation}</div>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <div class="korean-word">${word.korean}</div>
                    <button class="speak-btn" onclick="speak('${word.korean}', event)">🔊 Произнести</button>
                `;
            }

            document.getElementById('card-counter').textContent = `${currentCardIndex + 1} / ${vocabulary.length}`;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            const flashcard = document.getElementById('flashcard');
            flashcard.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
            setTimeout(() => {
                updateFlashcard();
                flashcard.style.transform = 'rotateY(0deg)';
            }, 150);
        }

        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % vocabulary.length;
            isFlipped = false;
            updateFlashcard();
        }

        function prevCard() {
            currentCardIndex = (currentCardIndex - 1 + vocabulary.length) % vocabulary.length;
            isFlipped = false;
            updateFlashcard();
        }

        function generateQuizQuestion() {
            const word = vocabulary[quizCurrentIndex % vocabulary.length];
            const options = [word];

            while (options.length < 4) {
                const randomWord = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                if (!options.includes(randomWord)) options.push(randomWord);
            }

            options.sort(() => Math.random() - 0.5);

            const questionTypes = [
                `Как по-корейски "${word.translation}"?`,
                `Что означает "${word.korean}"?`
            ];

            const questionType = Math.floor(Math.random() * questionTypes.length);
            document.getElementById('quiz-question').textContent = questionTypes[questionType];

            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';

            options.forEach(option => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'quiz-option';

                if (questionType === 0) {
                    optionDiv.innerHTML = `${option.korean} <br><small>(${option.pronunciation})</small>`;
                } else {
                    optionDiv.textContent = option.translation;
                }

                optionDiv.onclick = () => selectAnswer(option, word);
                optionsContainer.appendChild(optionDiv);
            });
        }

        function selectAnswer(selected, correct) {
            totalQuestions++;
            const options = document.querySelectorAll('.quiz-option');

            options.forEach(option => {
                option.onclick = null;
                if (option.textContent.includes(correct.korean) || option.textContent.includes(correct.translation)) {
                    option.classList.add('correct');
                } else if (option.textContent.includes(selected.korean) || option.textContent.includes(selected.translation)) {
                    option.classList.add('wrong');
                }
            });

            if (selected.korean === correct.korean) correctAnswers++;

            document.getElementById('correct-count').textContent = correctAnswers;
            document.getElementById('total-count').textContent = totalQuestions;
        }

        function nextQuestion() {
            quizCurrentIndex++;
            generateQuizQuestion();
        }

        function restartQuiz() {
            quizCurrentIndex = 0;
            correctAnswers = 0;
            totalQuestions = 0;
            document.getElementById('correct-count').textContent = '0';
            document.getElementById('total-count').textContent = '0';
            generateQuizQuestion();
        }

        function updateProgress() {
            document.getElementById('progress').style.width = '100%';
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadVocabulary();
            updateFlashcard();
            generateQuizQuestion();

            const cards = document.querySelectorAll('.vocab-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.5s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });

        document.addEventListener('keydown', function(e) {
            if (document.getElementById('flashcard-section').style.display !== 'none') {
                if (e.code === 'Space') { e.preventDefault(); flipCard(); }
                else if (e.code === 'ArrowRight') nextCard();
                else if (e.code === 'ArrowLeft') prevCard();
            }
        });
    </script>
    <!-- Кнопка завершения урока -->
    <div style="text-align: center; margin: 40px 0; padding: 30px;">
        <button id="completeLessonBtn" onclick="completeLesson()" style="
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.2em;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(76,175,80,0.3);
            font-family: 'Noto Sans KR', sans-serif;
        ">Отметить урок как пройденный</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="../../js/firebase-config.js"></script>
    <script src="../../js/firebase-sync.js"></script>
    <script src="../../js/firebase-auth.js"></script>
    <script src="../../js/progress-tracker.js"></script>
    <script>
        var LESSON_ID = 'level6_lesson_it_vocabulary';

        function completeLesson() {
            if (window.ProgressTracker) {
                if (!ProgressTracker.markLessonCompleted(LESSON_ID)) return;
                var btn = document.getElementById('completeLessonBtn');
                btn.textContent = 'Пройдено!';
                btn.style.background = '#2e7d32';
                btn.style.cursor = 'default';
                btn.disabled = true;
                btn.style.opacity = '0.85';
                console.log('[OK] Lesson completed:', LESSON_ID);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (window.ProgressTracker) {
                var progress = ProgressTracker.get();
                if (progress && progress.completedLessons && progress.completedLessons[LESSON_ID]) {
                    var btn = document.getElementById('completeLessonBtn');
                    if (btn) {
                        btn.textContent = 'Пройдено!';
                        btn.style.background = '#2e7d32';
                        btn.style.cursor = 'default';
                        btn.disabled = true;
                        btn.style.opacity = '0.85';
                    }
                }
            }
        });
    </script>
<script src="../../js/global-nav.js"></script>
