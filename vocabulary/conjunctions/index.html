<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🔗 Союзы - 접속사</title>
    <link href="../../css/style.css" rel="stylesheet"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .vocab-header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 40px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }
        .vocab-header h1 { font-size: 2.5em; color: #2c3e50; margin-bottom: 10px; }
        .korean-title { font-size: 1.8em; color: #1976d2; margin-bottom: 15px; font-weight: 600; }
        .study-mode { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .mode-btn {
            padding: 12px 25px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .mode-btn:hover { background: rgba(255,255,255,0.3); }
        .mode-btn.active { background: #1976d2; border-color: #1976d2; }
        .vocabulary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .word-card {
            background: white;
            border-radius: 20px;
            padding: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            text-align: center;
        }
        .word-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        .word-emoji {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: white;
        }
        .word-korean { font-size: 1.6em; font-weight: bold; color: #2c3e50; padding: 12px 15px 5px; }
        .word-romanization { font-size: 0.95em; color: #888; font-style: italic; padding: 0 15px; }
        .word-translation { font-size: 1em; color: #555; padding: 5px 15px 5px; }
        .word-example { font-size: 0.85em; color: #1976d2; padding: 5px 15px 10px; line-height: 1.5; }
        .speak-btn {
            background: none; border: none; font-size: 1.3em;
            cursor: pointer; padding: 5px 10px 15px; transition: transform 0.2s;
        }
        .speak-btn:hover { transform: scale(1.3); }
        .flashcard {
            background: rgba(255,255,255,0.95); padding: 50px 40px; border-radius: 25px;
            margin: 20px auto; max-width: 500px; min-height: 220px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1); user-select: none;
        }
        .flashcard:hover { transform: scale(1.02); box-shadow: 0 20px 50px rgba(0,0,0,0.15); }
        .flashcard .card-emoji { font-size: 3em; margin-bottom: 15px; }
        .flashcard .card-korean { font-size: 2.5em; font-weight: bold; color: #2c3e50; margin-bottom: 10px; }
        .flashcard .card-romanization { font-size: 1.2em; color: #888; font-style: italic; }
        .flashcard .card-translation { font-size: 1.5em; color: #555; margin-top: 10px; }
        .flashcard .card-example { font-size: 1em; color: #1976d2; margin-top: 10px; }
        .flashcard-nav { text-align: center; margin-top: 25px; display: flex; justify-content: center; align-items: center; gap: 20px; }
        .flashcard-nav .mode-btn { min-width: 130px; }
        .card-counter { color: white; font-size: 1.1em; font-weight: 500; min-width: 80px; text-align: center; }
        .card-hint { text-align: center; color: rgba(255,255,255,0.7); margin-top: 15px; font-size: 0.9em; }
        .quiz-section {
            background: rgba(255,255,255,0.95); border-radius: 25px; padding: 40px;
            max-width: 600px; margin: 20px auto; box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }
        .quiz-question { font-size: 1.5em; color: #2c3e50; margin-bottom: 25px; text-align: center; }
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .quiz-option {
            padding: 15px; background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 12px;
            cursor: pointer; transition: all 0.3s ease; font-weight: 500; text-align: center; font-size: 1.1em;
        }
        .quiz-option:hover { background: #e9ecef; transform: translateY(-2px); }
        .quiz-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .quiz-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .quiz-result { text-align: center; font-size: 1.2em; margin-top: 20px; font-weight: 500; }
        .quiz-stats { text-align: center; margin-top: 15px; color: #666; }
        .quiz-buttons { text-align: center; margin-top: 20px; display: flex; justify-content: center; gap: 15px; }
        .quiz-buttons button {
            padding: 12px 25px; border: none; border-radius: 12px; font-size: 1em;
            cursor: pointer; transition: all 0.3s ease; font-weight: 500;
        }
        .quiz-buttons .next-btn { background: #1976d2; color: white; }
        .quiz-buttons .restart-btn { background: #6c757d; color: white; }
        .search-bar { max-width: 500px; margin: 0 auto 25px; padding: 0 20px; }
        .search-bar input {
            width: 100%; padding: 12px 20px; border: 2px solid rgba(255,255,255,0.3);
            border-radius: 25px; background: rgba(255,255,255,0.15); color: white;
            font-size: 16px; outline: none; transition: all 0.3s ease; box-sizing: border-box;
        }
        .search-bar input::placeholder { color: rgba(255,255,255,0.6); }
        .search-bar input:focus { border-color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.25); }
        @media (max-width: 768px) {
            .vocab-header h1 { font-size: 1.8em; }
            .korean-title { font-size: 1.4em; }
            .vocabulary-grid { grid-template-columns: 1fr; gap: 12px; }
            .flashcard { padding: 30px 20px; min-height: 180px; }
            .flashcard .card-korean { font-size: 2em; }
            .quiz-options { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap;">
            <a href="../../level_1/index.html" style="color: white; text-decoration: none; font-size: 1.1em; padding: 12px 25px; background: rgba(255,255,255,0.15); border-radius: 15px; transition: all 0.3s ease; backdrop-filter: blur(10px);">← К 1급</a>
        </div>

        <div class="vocab-header">
            <h1>🔗 Союзы</h1>
            <div class="korean-title">접속사 [чопсокса]</div>
            <p>Связываем предложения на корейском языке!</p>
        </div>

        <div class="study-mode">
            <button class="mode-btn active" onclick="showMode('vocabulary')">📚 Словарь</button>
            <button class="mode-btn" onclick="showMode('flashcards')">🃏 Карточки</button>
            <button class="mode-btn" onclick="showMode('quiz')">🎯 Тест</button>
        </div>

        <div id="vocabulary-section">
            <div class="search-bar">
                <input type="text" id="vocabSearch" placeholder="🔍 Поиск слова..." oninput="filterVocabulary()">
            </div>
            <div class="vocabulary-grid" id="vocabularyGrid"></div>
        </div>

        <div id="flashcard-section" style="display: none;">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div id="flashcard-content"></div>
            </div>
            <div class="flashcard-nav">
                <button class="mode-btn" onclick="prevCard()">← Назад</button>
                <span class="card-counter" id="card-counter">1 / 10</span>
                <button class="mode-btn" onclick="nextCard()">Вперёд →</button>
            </div>
            <div class="card-hint">Нажмите на карточку или пробел для переворота. ←→ для навигации</div>
        </div>

        <div id="quiz-section" style="display: none;">
            <div class="quiz-section">
                <h2 style="text-align: center; color: #2c3e50; margin-bottom: 20px;">🎯 Тест</h2>
                <div class="quiz-question" id="quiz-question"></div>
                <div class="quiz-options" id="quiz-options"></div>
                <div class="quiz-result" id="quiz-result"></div>
                <div class="quiz-buttons">
                    <button class="next-btn" onclick="nextQuestion()">Следующий вопрос</button>
                    <button class="restart-btn" onclick="restartQuiz()">Начать заново</button>
                </div>
                <div class="quiz-stats" id="quiz-stats">Правильно: <span id="correct-count">0</span> из <span id="total-count">0</span></div>
            </div>
        </div>

        <div style="text-align: center; margin: 40px 0; padding: 30px; background: rgba(255,255,255,0.95); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
            <h3 style="color: #2c3e50; margin-bottom: 20px;">🎉 Отлично!</h3>
            <a href="../../level_1/index.html" style="display: inline-block; background: #1976d2; color: white; padding: 15px 30px; border-radius: 25px; text-decoration: none; font-size: 1.1em; font-weight: 500; transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">← К урокам 1급</a>
        </div>
    
        <!-- Кнопка завершения урока -->
        <div style="text-align: center; margin: 40px 0; padding: 30px;">
            <button id="completeLessonBtn" onclick="completeLesson()" style="
                background: linear-gradient(135deg, #4CAF50, #45a049);
                color: white;
                border: none;
                padding: 18px 40px;
                font-size: 1.2em;
                font-weight: 600;
                border-radius: 30px;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 6px 20px rgba(76,175,80,0.3);
                font-family: 'Noto Sans KR', sans-serif;
            ">Отметить урок как пройденный</button>
        </div>
    </div>

    <script>
        const vocabulary = [
            {emoji: '➕', korean: '그리고', romanization: 'geurigo', translation: 'и, а также', example: '사과 그리고 바나나 — Яблоко и банан'},
            {emoji: '🔄', korean: '그런데', romanization: 'geureonde', translation: 'но, однако', example: '예쁜데 비싸요. 그런데 사고 싶어요 — Красивый, но дорогой. Однако хочу купить'},
            {emoji: '➡️', korean: '그래서', romanization: 'geuraeseo', translation: 'поэтому, так что', example: '비가 왔어요. 그래서 우산을 가져갔어요 — Пошёл дождь. Поэтому взял зонт'},
            {emoji: '🔀', korean: '그러면', romanization: 'geureomyeon', translation: 'тогда, в таком случае', example: '시간이 없어요? 그러면 내일 만나요 — Нет времени? Тогда встретимся завтра'},
            {emoji: '📋', korean: '그러니까', romanization: 'geureonikka', translation: 'поэтому, значит', example: '늦었어요. 그러니까 빨리 가요 — Опоздали. Поэтому идём быстрее'},
            {emoji: '🔃', korean: '하지만', romanization: 'hajiman', translation: 'но, тем не менее', example: '어렵지만 재미있어요 — Сложно, но интересно'},
            {emoji: '🤔', korean: '아니면', romanization: 'animyeon', translation: 'или (же), а может', example: '커피 아니면 차? — Кофе или чай?'},
            {emoji: '📎', korean: '그리고 나서', romanization: 'geurigo naseo', translation: 'а потом, после этого', example: '밥을 먹고 나서 공부해요 — После еды учусь'},
            {emoji: '💡', korean: '왜냐하면', romanization: 'waenyahamyeon', translation: 'потому что', example: '안 갔어요. 왜냐하면 아팠어요 — Не пошёл. Потому что болел'},
            {emoji: '✅', korean: '또한', romanization: 'ttohan', translation: 'также, к тому же', example: '한국어를 배워요. 또한 일본어도 배워요 — Учу корейский. Также учу японский'}
        ];

        let currentCardIndex = 0;
        let isFlipped = false;
        let quizCurrentIndex = 0;
        let correctAnswers = 0;
        let totalQuestions = 0;

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            }
        }

        function filterVocabulary() {
            const query = document.getElementById('vocabSearch').value.toLowerCase();
            const cards = document.querySelectorAll('.word-card');
            cards.forEach(card => { card.style.display = card.textContent.toLowerCase().includes(query) ? '' : 'none'; });
        }

        function loadVocabulary() {
            const grid = document.getElementById('vocabularyGrid');
            grid.innerHTML = '';
            vocabulary.forEach(word => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.onclick = () => speak(word.korean);
                card.innerHTML = '<div class="word-emoji">' + word.emoji + '</div>' +
                    '<div class="word-korean">' + word.korean + '</div>' +
                    '<div class="word-romanization">' + word.romanization + '</div>' +
                    '<div class="word-translation">' + word.translation + '</div>' +
                    '<div class="word-example">' + word.example + '</div>' +
                    '<button class="speak-btn" onclick="event.stopPropagation(); speak(\'' + word.korean + '\')">🔊</button>';
                grid.appendChild(card);
            });
        }

        function showMode(mode) {
            document.getElementById('vocabulary-section').style.display = mode === 'vocabulary' ? 'block' : 'none';
            document.getElementById('flashcard-section').style.display = mode === 'flashcards' ? 'block' : 'none';
            document.getElementById('quiz-section').style.display = mode === 'quiz' ? 'block' : 'none';
            var buttons = document.querySelectorAll('.study-mode .mode-btn');
            buttons.forEach(function(btn, i) {
                btn.classList.toggle('active', (mode === 'vocabulary' && i === 0) || (mode === 'flashcards' && i === 1) || (mode === 'quiz' && i === 2));
            });
            if (mode === 'flashcards') updateFlashcard();
            if (mode === 'quiz') generateQuizQuestion();
        }

        function updateFlashcard() {
            var word = vocabulary[currentCardIndex];
            var content = document.getElementById('flashcard-content');
            if (isFlipped) {
                content.innerHTML = '<div class="card-emoji">' + word.emoji + '</div>' +
                    '<div class="card-romanization">' + word.romanization + '</div>' +
                    '<div class="card-translation">' + word.translation + '</div>' +
                    '<div class="card-example">' + word.example + '</div>';
            } else {
                content.innerHTML = '<div class="card-emoji">' + word.emoji + '</div>' +
                    '<div class="card-korean">' + word.korean + '</div>' +
                    '<button class="speak-btn" onclick="event.stopPropagation(); speak(\'' + word.korean + '\')">🔊</button>';
            }
            document.getElementById('card-counter').textContent = (currentCardIndex + 1) + ' / ' + vocabulary.length;
        }

        function flipCard() { isFlipped = !isFlipped; updateFlashcard(); }
        function nextCard() { currentCardIndex = (currentCardIndex + 1) % vocabulary.length; isFlipped = false; updateFlashcard(); }
        function prevCard() { currentCardIndex = (currentCardIndex - 1 + vocabulary.length) % vocabulary.length; isFlipped = false; updateFlashcard(); }

        function generateQuizQuestion() {
            var word = vocabulary[quizCurrentIndex % vocabulary.length];
            var options = [word];
            while (options.length < 4) { var rw = vocabulary[Math.floor(Math.random() * vocabulary.length)]; if (!options.includes(rw)) options.push(rw); }
            options.sort(function() { return Math.random() - 0.5; });
            document.getElementById('quiz-question').textContent = 'Что означает "' + word.korean + '"?';
            var container = document.getElementById('quiz-options');
            container.innerHTML = '';
            options.forEach(function(opt) {
                var div = document.createElement('div');
                div.className = 'quiz-option';
                div.textContent = opt.translation;
                div.onclick = function() { checkAnswer(opt, word); };
                container.appendChild(div);
            });
            document.getElementById('quiz-result').textContent = '';
        }

        function checkAnswer(selected, correct) {
            totalQuestions++;
            var options = document.querySelectorAll('.quiz-option');
            options.forEach(function(opt) {
                opt.onclick = null;
                if (opt.textContent === correct.translation) opt.classList.add('correct');
                else if (opt.textContent === selected.translation) opt.classList.add('wrong');
            });
            if (selected.korean === correct.korean) {
                correctAnswers++;
                document.getElementById('quiz-result').innerHTML = '[OK] Правильно!';
                document.getElementById('quiz-result').style.color = '#28a745';
            } else {
                document.getElementById('quiz-result').innerHTML = '[!] Неправильно! Ответ: ' + correct.translation;
                document.getElementById('quiz-result').style.color = '#dc3545';
            }
            document.getElementById('correct-count').textContent = correctAnswers;
            document.getElementById('total-count').textContent = totalQuestions;
        }

        function nextQuestion() { quizCurrentIndex++; generateQuizQuestion(); }
        function restartQuiz() { quizCurrentIndex = 0; correctAnswers = 0; totalQuestions = 0; document.getElementById('correct-count').textContent = '0'; document.getElementById('total-count').textContent = '0'; generateQuizQuestion(); }

        document.addEventListener('DOMContentLoaded', function() { loadVocabulary(); updateFlashcard(); console.log('[OK] Conjunctions vocabulary loaded'); });
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('flashcard-section').style.display !== 'none') {
                if (e.code === 'Space') { e.preventDefault(); flipCard(); }
                else if (e.code === 'ArrowRight') nextCard();
                else if (e.code === 'ArrowLeft') prevCard();
            }
        });
    </script>
    <script src="../../js/global-nav.js"></script>
    <script src="../../js/progress-tracker.js"></script>
    <script>
        // Кнопка завершения урока
        var LESSON_ID = 'vocabulary_conjunctions';

        function completeLesson() {
            if (window.ProgressTracker) {
                ProgressTracker.markLessonCompleted(LESSON_ID);
                var btn = document.getElementById('completeLessonBtn');
                btn.textContent = 'Пройдено!';
                btn.style.background = '#2e7d32';
                btn.style.cursor = 'default';
                btn.disabled = true;
                btn.style.opacity = '0.85';
                console.log('[OK] Lesson completed:', LESSON_ID);
            }
        }

        // Проверяем статус при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            if (window.ProgressTracker) {
                var progress = ProgressTracker.get();
                if (progress && progress.completedLessons && progress.completedLessons[LESSON_ID]) {
                    var btn = document.getElementById('completeLessonBtn');
                    if (btn) {
                        btn.textContent = 'Пройдено!';
                        btn.style.background = '#2e7d32';
                        btn.style.cursor = 'default';
                        btn.disabled = true;
                        btn.style.opacity = '0.85';
                    }
                }
            }
        });
    </script>
</body>
</html>
