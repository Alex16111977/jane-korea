<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Урок: Офис и работа</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #78909c, #607d8b, #90a4ae);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .nav {
            background: rgba(255,255,255,0.95);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .nav a {
            background: #607d8b;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 10px;
            margin: 0 10px;
            display: inline-block;
            transition: all 0.3s;
        }

        .nav a:hover {
            background: #455a64;
            transform: translateY(-2px);
        }

        .lesson-header {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .lesson-header h1 {
            font-size: 2.5em;
            color: #607d8b;
            margin-bottom: 10px;
        }

        .vocabulary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .word-card {
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        .word-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .korean-word {
            font-size: 2em;
            font-weight: bold;
            color: #607d8b;
            margin-bottom: 5px;
        }

        .pronunciation {
            font-size: 1.2em;
            color: #90a4ae;
            margin-bottom: 10px;
            font-style: italic;
        }

        .translation {
            font-size: 1.1em;
            color: #666;
        }

        .speak-btn {
            background: #feca57;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
            transition: all 0.3s;
        }

        .speak-btn:hover {
            background: #ff9ff3;
        }

        .quiz-section {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .quiz-question {
            font-size: 1.3em;
            margin-bottom: 20px;
            text-align: center;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .quiz-option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .quiz-option:hover {
            background: #e9ecef;
        }

        .quiz-option.correct {
            background: #d4edda;
            border-color: #28a745;
        }

        .quiz-option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
        }

        .result {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .progress-bar {
            background: #e9ecef;
            border-radius: 10px;
            height: 20px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #607d8b, #90a4ae);
            height: 100%;
            width: 0%;
            transition: width 0.5s;
        }

        .study-mode {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .mode-btn {
            background: #48dbfb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: #607d8b;
        }

        .flashcard {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 20px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .flashcard:hover {
            transform: rotateY(5deg);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .search-bar {
            background: rgba(255,255,255,0.95);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .search-bar input {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-bar input:focus {
            border-color: #999;
        }
    </style>
    <link rel="stylesheet" href="../../css/lesson-theme.css">
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="../../level_2/index.html">← К 2급</a>
            <a href="../../index.html">🏠 Главная</a>
        </div>

        <div class="lesson-header">
            <h1>🏢 Офис и работа (사무실과 일)</h1>
            <p>Изучаем слова для офисной жизни и рабочего процесса</p>
        </div>

        <div class="study-mode">
            <button class="mode-btn active" onclick="showVocabulary()">📚 Словарь</button>
            <button class="mode-btn" onclick="showFlashcards()">🃏 Карточки</button>
            <button class="mode-btn" onclick="showQuiz()">🎯 Тест</button>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <div class="search-bar">
            <input type="text" id="vocabSearch" placeholder="🔍 Поиск слова..." oninput="filterVocabulary()">
        </div>
        <div id="vocabulary-section">
            <div class="vocabulary-grid" id="vocabularyGrid">
                <!-- Будет заполнено JS -->
            </div>
        </div>

        <div id="flashcard-section" style="display: none;">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div id="flashcard-content">
                    <div class="korean-word" id="flashcard-korean">회사</div>
                    <button class="speak-btn" onclick="speak('회사')">🔊</button>
                </div>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="mode-btn" onclick="prevCard()">← Предыдущая</button>
                <span id="card-counter">1 / 56</span>
                <button class="mode-btn" onclick="nextCard()">Следующая →</button>
            </div>
        </div>

        <div id="quiz-section" style="display: none;">
            <div class="quiz-section">
                <h2>🎯 Тест: Офис и работа</h2>
                <div class="quiz-question" id="quiz-question">
                    Как по-корейски "компания"?
                </div>
                <div class="quiz-options" id="quiz-options">
                    <!-- Будет заполнено JS -->
                </div>
                <div class="result" id="quiz-result"></div>
                <div style="text-align: center; margin-top: 20px;">
                    <button class="mode-btn" onclick="nextQuestion()">Следующий вопрос</button>
                    <button class="mode-btn" onclick="restartQuiz()">Начать заново</button>
                </div>
                <div id="quiz-stats" style="text-align: center; margin-top: 20px;">
                    Правильных ответов: <span id="correct-count">0</span> из <span id="total-count">0</span>
                </div>
            </div>
        </div>

        <!-- Кнопка завершения урока -->
        <div style="text-align: center; margin: 40px 0; padding: 30px;">
            <button id="completeLessonBtn" onclick="completeLesson()" style="
                background: linear-gradient(135deg, #4CAF50, #45a049);
                color: white;
                border: none;
                padding: 18px 40px;
                font-size: 1.2em;
                font-weight: 600;
                border-radius: 30px;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 6px 20px rgba(76,175,80,0.3);
                font-family: 'Noto Sans KR', sans-serif;
            ">Отметить урок как пройденный</button>
        </div>
    </div>

    <script>
        const vocabulary = [
            {korean: '회사', pronunciation: 'хвеса', translation: 'компания'},
            {korean: '통역', pronunciation: 'тхонёк', translation: 'устный перевод'},
            {korean: '통장', pronunciation: 'тхончжан', translation: 'банковская книжка, счёт'},
            {korean: '출장', pronunciation: 'чхульчжан', translation: 'командировка'},
            {korean: '취직', pronunciation: 'чхвичжик', translation: 'трудоустройство'},
            {korean: '판매', pronunciation: 'пханмэ', translation: 'продажа, сбыт'},
            {korean: '팩스', pronunciation: 'пхэксы', translation: 'факс'},
            {korean: '필요', pronunciation: 'пхирё', translation: 'необходимость'},
            {korean: '현금', pronunciation: 'хёнгым', translation: 'наличные'},
            {korean: '환전', pronunciation: 'хванчжон', translation: 'обмен валюты'},
            {korean: '홈페이지', pronunciation: 'хомпхеичжи', translation: 'сайт, домашняя страница'},
            {korean: '전기', pronunciation: 'чонги', translation: 'электричество'},
            {korean: '전자', pronunciation: 'чончжа', translation: 'электроника, электронный'},
            {korean: '정보', pronunciation: 'чонбо', translation: 'информация'},
            {korean: '전화기', pronunciation: 'чонхваги', translation: 'телефонный аппарат'},
            {korean: '주소', pronunciation: 'чусо', translation: 'адрес'},
            {korean: '정리', pronunciation: 'чонни', translation: 'приведение в порядок, разбор'},
            {korean: '승진하다', pronunciation: 'сынчжинхада', translation: 'получать повышение'},
            {korean: '신청', pronunciation: 'синчхон', translation: 'заявка, заявление'},
            {korean: '신제품', pronunciation: 'синчжепхум', translation: 'новинка, новый товар'},
            {korean: '심부름', pronunciation: 'симбурым', translation: 'поручение, мелкое дело'},
            {korean: '올림', pronunciation: 'ольлим', translation: '«с уважением» (подпись в письме)'},
            {korean: '우편', pronunciation: 'упхён', translation: 'почта, почтовая пересылка'},
            {korean: '우표', pronunciation: 'упхё', translation: 'почтовая марка'},
            {korean: '운전', pronunciation: 'унчжон', translation: 'вождение'},
            {korean: '이용', pronunciation: 'иён', translation: 'использование, пользование'},
            {korean: '선택', pronunciation: 'сонтхэк', translation: 'выбор'},
            {korean: '소포', pronunciation: 'сопхо', translation: 'посылка'},
            {korean: '복사', pronunciation: 'покса', translation: 'копия, ксерокопия'},
            {korean: '비서', pronunciation: 'писо', translation: 'секретарь'},
            {korean: '부탁', pronunciation: 'путхак', translation: 'просьба'},
            {korean: '상품', pronunciation: 'санпхум', translation: 'товар'},
            {korean: '수고', pronunciation: 'суго', translation: 'труд, старание («спасибо за работу»)'},
            {korean: '무역', pronunciation: 'муёк', translation: 'внешняя торговля'},
            {korean: '번호', pronunciation: 'понхо', translation: 'номер'},
            {korean: '법', pronunciation: 'поп', translation: 'закон'},
            {korean: '번역', pronunciation: 'понёк', translation: 'перевод (письменный)'},
            {korean: '답장', pronunciation: 'тапчжан', translation: 'ответное письмо, ответ'},
            {korean: '도장', pronunciation: 'точжан', translation: 'личная печать (вместо подписи)'},
            {korean: '디자인', pronunciation: 'тичжаин', translation: 'дизайн'},
            {korean: '광고', pronunciation: 'кванго', translation: 'реклама'},
            {korean: '근무', pronunciation: 'кынму', translation: 'работа, рабочая смена'},
            {korean: '사무실', pronunciation: 'самусиль', translation: 'офис'},
            {korean: '회의', pronunciation: 'хвеый', translation: 'совещание'},
            {korean: '컴퓨터', pronunciation: 'кхомпхютхо', translation: 'компьютер'},
            {korean: '상사', pronunciation: 'сансса', translation: 'начальник'},
            {korean: '동료', pronunciation: 'тонънё', translation: 'коллега'},
            {korean: '월급', pronunciation: 'вольгып', translation: 'зарплата'},
            {korean: '출근', pronunciation: 'чхульгын', translation: 'приход на работу'},
            {korean: '퇴근', pronunciation: 'тхвегын', translation: 'уход с работы'},
            {korean: '서류', pronunciation: 'сорю', translation: 'документы'},
            {korean: '이력서', pronunciation: 'ирёксо', translation: 'резюме'},
            {korean: '면접', pronunciation: 'мёнджоп', translation: 'собеседование'},
            {korean: '프린터', pronunciation: 'пхыринтхо', translation: 'принтер'},
            {korean: '야근', pronunciation: 'ягын', translation: 'сверхурочная работа'},
            {korean: '휴가', pronunciation: 'хюга', translation: 'отпуск'}
        ];

        let currentCardIndex = 0;
        let isFlipped = false;
        let quizCurrentIndex = 0;
        let correctAnswers = 0;
        let totalQuestions = 0;

        function filterVocabulary() {
            const query = document.getElementById('vocabSearch').value.toLowerCase();
            const cards = document.querySelectorAll('.word-card');
            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(query) ? '' : 'none';
            });
        }

        function loadVocabulary() {
            const grid = document.getElementById('vocabularyGrid');
            grid.innerHTML = '';

            vocabulary.forEach((word, index) => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerHTML = `
                    <div class="korean-word">${word.korean}</div>
                    <div class="pronunciation">${word.pronunciation}</div>
                    <div class="translation">${word.translation}</div>
                    <button class="speak-btn" onclick="speak('${word.korean}')">🔊</button>
                `;
                grid.appendChild(card);
            });

            updateProgress();
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            }
        }

        function showVocabulary() {
            document.getElementById('vocabulary-section').style.display = 'block';
            document.getElementById('flashcard-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'none';
            updateActiveButton(0);
        }

        function showFlashcards() {
            document.getElementById('vocabulary-section').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'block';
            document.getElementById('quiz-section').style.display = 'none';
            updateActiveButton(1);
            updateFlashcard();
        }

        function showQuiz() {
            document.getElementById('vocabulary-section').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            updateActiveButton(2);
            generateQuizQuestion();
        }

        function updateActiveButton(index) {
            const buttons = document.querySelectorAll('.mode-btn');
            buttons.forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function updateFlashcard() {
            const word = vocabulary[currentCardIndex];
            const flashcard = document.getElementById('flashcard');
            const content = document.getElementById('flashcard-content');

            if (isFlipped) {
                content.innerHTML = `
                    <div class="pronunciation">${word.pronunciation}</div>
                    <div class="translation">${word.translation}</div>
                `;
            } else {
                content.innerHTML = `
                    <div class="korean-word">${word.korean}</div>
                    <button class="speak-btn" onclick="speak('${word.korean}')">🔊</button>
                `;
            }

            document.getElementById('card-counter').textContent = `${currentCardIndex + 1} / ${vocabulary.length}`;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            updateFlashcard();
        }

        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % vocabulary.length;
            isFlipped = false;
            updateFlashcard();
        }

        function prevCard() {
            currentCardIndex = (currentCardIndex - 1 + vocabulary.length) % vocabulary.length;
            isFlipped = false;
            updateFlashcard();
        }

        function generateQuizQuestion() {
            const word = vocabulary[quizCurrentIndex % vocabulary.length];
            const options = [word];

            // Добавляем 3 случайных неправильных варианта
            while (options.length < 4) {
                const randomWord = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                if (!options.includes(randomWord)) {
                    options.push(randomWord);
                }
            }

            // Перемешиваем варианты
            options.sort(() => Math.random() - 0.5);

            document.getElementById('quiz-question').textContent = `Как по-корейски "${word.translation}"?`;

            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';

            options.forEach(option => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'quiz-option';
                optionDiv.textContent = `${option.korean} (${option.pronunciation})`;
                optionDiv.onclick = () => selectAnswer(option, word);
                optionsContainer.appendChild(optionDiv);
            });

            document.getElementById('quiz-result').textContent = '';
        }

        function selectAnswer(selected, correct) {
            totalQuestions++;
            const options = document.querySelectorAll('.quiz-option');

            options.forEach(option => {
                option.onclick = null; // Отключаем клики
                if (option.textContent.includes(correct.korean)) {
                    option.classList.add('correct');
                } else if (option.textContent.includes(selected.korean)) {
                    option.classList.add('wrong');
                }
            });

            if (selected.korean === correct.korean) {
                correctAnswers++;
                document.getElementById('quiz-result').innerHTML = 'Правильно!';
                document.getElementById('quiz-result').style.color = '#28a745';
            } else {
                document.getElementById('quiz-result').innerHTML = 'Неправильно!';
                document.getElementById('quiz-result').style.color = '#dc3545';
            }

            document.getElementById('correct-count').textContent = correctAnswers;
            document.getElementById('total-count').textContent = totalQuestions;
        }

        function nextQuestion() {
            quizCurrentIndex++;
            generateQuizQuestion();
        }

        function restartQuiz() {
            quizCurrentIndex = 0;
            correctAnswers = 0;
            totalQuestions = 0;
            document.getElementById('correct-count').textContent = '0';
            document.getElementById('total-count').textContent = '0';
            generateQuizQuestion();
        }

        function updateProgress() {
            const progress = Math.min(100, (vocabulary.length / 15) * 100);
            document.getElementById('progress').style.width = progress + '%';
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            loadVocabulary();
            updateFlashcard();
            generateQuizQuestion();
        });

        // Горячие клавиши
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('flashcard-section').style.display !== 'none') {
                if (e.code === 'Space') {
                    e.preventDefault();
                    flipCard();
                } else if (e.code === 'ArrowRight') {
                    nextCard();
                } else if (e.code === 'ArrowLeft') {
                    prevCard();
                }
            }
        });
    </script>
<script src="../../js/dictionary.js"></script>
    <script src="../../js/dictionary-inject.js"></script>
    <script src="../../js/global-nav.js"></script>
    <script src="../../js/progress-tracker.js"></script>
    <script>
        // Кнопка завершения урока
        var LESSON_ID = 'level2_vocab_office';

        function completeLesson() {
            if (window.ProgressTracker) {
                if (!ProgressTracker.markLessonCompleted(LESSON_ID)) return;
                var btn = document.getElementById('completeLessonBtn');
                btn.textContent = 'Пройдено!';
                btn.style.background = '#2e7d32';
                btn.style.cursor = 'default';
                btn.disabled = true;
                btn.style.opacity = '0.85';
                console.log('[OK] Lesson completed:', LESSON_ID);
            }
        }

        // Проверяем статус при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            if (window.ProgressTracker) {
                var progress = ProgressTracker.get();
                if (progress && progress.completedLessons && progress.completedLessons[LESSON_ID]) {
                    var btn = document.getElementById('completeLessonBtn');
                    if (btn) {
                        btn.textContent = 'Пройдено!';
                        btn.style.background = '#2e7d32';
                        btn.style.cursor = 'default';
                        btn.disabled = true;
                        btn.style.opacity = '0.85';
                    }
                }
            }
        });
    </script>
</body>
</html>
