<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Урок: Здоровье и симптомы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e57373, #ef5350, #f48fb1);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .nav {
            background: rgba(255,255,255,0.95);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .nav a {
            background: #e57373;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 10px;
            margin: 0 10px;
            display: inline-block;
            transition: all 0.3s;
        }

        .nav a:hover {
            background: #d32f2f;
            transform: translateY(-2px);
        }

        .lesson-header {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .lesson-header h1 {
            font-size: 2.5em;
            color: #e57373;
            margin-bottom: 10px;
        }

        .vocabulary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .word-card {
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        .word-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .korean-word {
            font-size: 2em;
            font-weight: bold;
            color: #e57373;
            margin-bottom: 5px;
        }

        .pronunciation {
            font-size: 1.2em;
            color: #f48fb1;
            margin-bottom: 10px;
            font-style: italic;
        }

        .translation {
            font-size: 1.1em;
            color: #666;
        }

        .speak-btn {
            background: #feca57;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
            transition: all 0.3s;
        }

        .speak-btn:hover {
            background: #ff9ff3;
        }

        .quiz-section {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .quiz-question {
            font-size: 1.3em;
            margin-bottom: 20px;
            text-align: center;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .quiz-option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .quiz-option:hover {
            background: #e9ecef;
        }

        .quiz-option.correct {
            background: #d4edda;
            border-color: #28a745;
        }

        .quiz-option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
        }

        .result {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .progress-bar {
            background: #e9ecef;
            border-radius: 10px;
            height: 20px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #e57373, #f48fb1);
            height: 100%;
            width: 0%;
            transition: width 0.5s;
        }

        .study-mode {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .mode-btn {
            background: #48dbfb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: #e57373;
        }

        .flashcard {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 20px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .flashcard:hover {
            transform: rotateY(5deg);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .search-bar {
            background: rgba(255,255,255,0.95);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .search-bar input {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-bar input:focus {
            border-color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="../../level_2/index.html">← К 2급</a>
            <a href="../../index.html">🏠 Главная</a>
        </div>

        <div class="lesson-header">
            <h1>🏥 Здоровье и симптомы (건강과 증상)</h1>
            <p>Изучаем слова о здоровье, болезнях и визитах к врачу</p>
        </div>

        <div class="study-mode">
            <button class="mode-btn active" onclick="showVocabulary()">📚 Словарь</button>
            <button class="mode-btn" onclick="showFlashcards()">🃏 Карточки</button>
            <button class="mode-btn" onclick="showQuiz()">🎯 Тест</button>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <div class="search-bar">
            <input type="text" id="vocabSearch" placeholder="🔍 Поиск слова..." oninput="filterVocabulary()">
        </div>
        <div id="vocabulary-section">
            <div class="vocabulary-grid" id="vocabularyGrid">
                <!-- Будет заполнено JS -->
            </div>
        </div>

        <div id="flashcard-section" style="display: none;">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div id="flashcard-content">
                    <div class="korean-word" id="flashcard-korean">병원</div>
                    <button class="speak-btn" onclick="speak('병원')">🔊</button>
                </div>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="mode-btn" onclick="prevCard()">← Предыдущая</button>
                <span id="card-counter">1 / 15</span>
                <button class="mode-btn" onclick="nextCard()">Следующая →</button>
            </div>
        </div>

        <div id="quiz-section" style="display: none;">
            <div class="quiz-section">
                <h2>🎯 Тест: Здоровье</h2>
                <div class="quiz-question" id="quiz-question">
                    Как по-корейски "больница"?
                </div>
                <div class="quiz-options" id="quiz-options">
                    <!-- Будет заполнено JS -->
                </div>
                <div class="result" id="quiz-result"></div>
                <div style="text-align: center; margin-top: 20px;">
                    <button class="mode-btn" onclick="nextQuestion()">Следующий вопрос</button>
                    <button class="mode-btn" onclick="restartQuiz()">Начать заново</button>
                </div>
                <div id="quiz-stats" style="text-align: center; margin-top: 20px;">
                    Правильных ответов: <span id="correct-count">0</span> из <span id="total-count">0</span>
                </div>
            </div>
        </div>

        <!-- Кнопка завершения урока -->
        <div style="text-align: center; margin: 40px 0; padding: 30px;">
            <button id="completeLessonBtn" onclick="completeLesson()" style="
                background: linear-gradient(135deg, #4CAF50, #45a049);
                color: white;
                border: none;
                padding: 18px 40px;
                font-size: 1.2em;
                font-weight: 600;
                border-radius: 30px;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 6px 20px rgba(76,175,80,0.3);
                font-family: 'Noto Sans KR', sans-serif;
            ">Отметить урок как пройденный</button>
        </div>
    </div>

    <script>
        const vocabulary = [
            {korean: '병원', pronunciation: 'пёнвон', translation: 'больница'},
            {korean: '약', pronunciation: 'як', translation: 'лекарство'},
            {korean: '의사', pronunciation: 'ыйса', translation: 'врач'},
            {korean: '간호사', pronunciation: 'канхоса', translation: 'медсестра'},
            {korean: '아프다', pronunciation: 'апхыда', translation: 'болеть, быть больным'},
            {korean: '머리', pronunciation: 'мори', translation: 'голова'},
            {korean: '배', pronunciation: 'пэ', translation: 'живот'},
            {korean: '감기', pronunciation: 'камги', translation: 'простуда'},
            {korean: '열', pronunciation: 'ёль', translation: 'температура (жар)'},
            {korean: '기침', pronunciation: 'кичхим', translation: 'кашель'},
            {korean: '약국', pronunciation: 'яккук', translation: 'аптека'},
            {korean: '두통', pronunciation: 'тутхонг', translation: 'головная боль'},
            {korean: '치과', pronunciation: 'чхигва', translation: 'стоматология'},
            {korean: '주사', pronunciation: 'чуса', translation: 'укол'},
            {korean: '건강', pronunciation: 'конган', translation: 'здоровье'}
        ];

        let currentCardIndex = 0;
        let isFlipped = false;
        let quizCurrentIndex = 0;
        let correctAnswers = 0;
        let totalQuestions = 0;

        function filterVocabulary() {
            const query = document.getElementById('vocabSearch').value.toLowerCase();
            const cards = document.querySelectorAll('.word-card');
            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(query) ? '' : 'none';
            });
        }

        function loadVocabulary() {
            const grid = document.getElementById('vocabularyGrid');
            grid.innerHTML = '';

            vocabulary.forEach((word, index) => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerHTML = `
                    <div class="korean-word">${word.korean}</div>
                    <div class="pronunciation">${word.pronunciation}</div>
                    <div class="translation">${word.translation}</div>
                    <button class="speak-btn" onclick="speak('${word.korean}')">🔊</button>
                `;
                grid.appendChild(card);
            });

            updateProgress();
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            }
        }

        function showVocabulary() {
            document.getElementById('vocabulary-section').style.display = 'block';
            document.getElementById('flashcard-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'none';
            updateActiveButton(0);
        }

        function showFlashcards() {
            document.getElementById('vocabulary-section').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'block';
            document.getElementById('quiz-section').style.display = 'none';
            updateActiveButton(1);
            updateFlashcard();
        }

        function showQuiz() {
            document.getElementById('vocabulary-section').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            updateActiveButton(2);
            generateQuizQuestion();
        }

        function updateActiveButton(index) {
            const buttons = document.querySelectorAll('.mode-btn');
            buttons.forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function updateFlashcard() {
            const word = vocabulary[currentCardIndex];
            const flashcard = document.getElementById('flashcard');
            const content = document.getElementById('flashcard-content');

            if (isFlipped) {
                content.innerHTML = `
                    <div class="pronunciation">${word.pronunciation}</div>
                    <div class="translation">${word.translation}</div>
                `;
            } else {
                content.innerHTML = `
                    <div class="korean-word">${word.korean}</div>
                    <button class="speak-btn" onclick="speak('${word.korean}')">🔊</button>
                `;
            }

            document.getElementById('card-counter').textContent = `${currentCardIndex + 1} / ${vocabulary.length}`;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            updateFlashcard();
        }

        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % vocabulary.length;
            isFlipped = false;
            updateFlashcard();
        }

        function prevCard() {
            currentCardIndex = (currentCardIndex - 1 + vocabulary.length) % vocabulary.length;
            isFlipped = false;
            updateFlashcard();
        }

        function generateQuizQuestion() {
            const word = vocabulary[quizCurrentIndex % vocabulary.length];
            const options = [word];

            // Добавляем 3 случайных неправильных варианта
            while (options.length < 4) {
                const randomWord = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                if (!options.includes(randomWord)) {
                    options.push(randomWord);
                }
            }

            // Перемешиваем варианты
            options.sort(() => Math.random() - 0.5);

            document.getElementById('quiz-question').textContent = `Как по-корейски "${word.translation}"?`;

            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';

            options.forEach(option => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'quiz-option';
                optionDiv.textContent = `${option.korean} (${option.pronunciation})`;
                optionDiv.onclick = () => selectAnswer(option, word);
                optionsContainer.appendChild(optionDiv);
            });

            document.getElementById('quiz-result').textContent = '';
        }

        function selectAnswer(selected, correct) {
            totalQuestions++;
            const options = document.querySelectorAll('.quiz-option');

            options.forEach(option => {
                option.onclick = null; // Отключаем клики
                if (option.textContent.includes(correct.korean)) {
                    option.classList.add('correct');
                } else if (option.textContent.includes(selected.korean)) {
                    option.classList.add('wrong');
                }
            });

            if (selected.korean === correct.korean) {
                correctAnswers++;
                document.getElementById('quiz-result').innerHTML = '✅ Правильно!';
                document.getElementById('quiz-result').style.color = '#28a745';
            } else {
                document.getElementById('quiz-result').innerHTML = '❌ Неправильно!';
                document.getElementById('quiz-result').style.color = '#dc3545';
            }

            document.getElementById('correct-count').textContent = correctAnswers;
            document.getElementById('total-count').textContent = totalQuestions;
        }

        function nextQuestion() {
            quizCurrentIndex++;
            generateQuizQuestion();
        }

        function restartQuiz() {
            quizCurrentIndex = 0;
            correctAnswers = 0;
            totalQuestions = 0;
            document.getElementById('correct-count').textContent = '0';
            document.getElementById('total-count').textContent = '0';
            generateQuizQuestion();
        }

        function updateProgress() {
            const progress = Math.min(100, (vocabulary.length / 15) * 100);
            document.getElementById('progress').style.width = progress + '%';
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            loadVocabulary();
            updateFlashcard();
            generateQuizQuestion();
        });

        // Горячие клавиши
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('flashcard-section').style.display !== 'none') {
                if (e.code === 'Space') {
                    e.preventDefault();
                    flipCard();
                } else if (e.code === 'ArrowRight') {
                    nextCard();
                } else if (e.code === 'ArrowLeft') {
                    prevCard();
                }
            }
        });
    </script>
<script src="../../js/dictionary.js"></script>
    <script src="../../js/dictionary-inject.js"></script>
    <script src="../../js/global-nav.js"></script>
    <script src="../../js/progress-tracker.js"></script>
    <script>
        // Кнопка завершения урока
        var LESSON_ID = 'level2_vocab_health';

        function completeLesson() {
            if (window.ProgressTracker) {
                if (!ProgressTracker.markLessonCompleted(LESSON_ID)) return;
                var btn = document.getElementById('completeLessonBtn');
                btn.textContent = 'Пройдено!';
                btn.style.background = '#2e7d32';
                btn.style.cursor = 'default';
                btn.disabled = true;
                btn.style.opacity = '0.85';
                console.log('[OK] Lesson completed:', LESSON_ID);
            }
        }

        // Проверяем статус при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            if (window.ProgressTracker) {
                var progress = ProgressTracker.get();
                if (progress && progress.completedLessons && progress.completedLessons[LESSON_ID]) {
                    var btn = document.getElementById('completeLessonBtn');
                    if (btn) {
                        btn.textContent = 'Пройдено!';
                        btn.style.background = '#2e7d32';
                        btn.style.cursor = 'default';
                        btn.disabled = true;
                        btn.style.opacity = '0.85';
                    }
                }
            }
        });
    </script>
</body>
</html>
