<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🏠 Дом и мебель - 집과 가구</title>
    <link href="../../css/style.css" rel="stylesheet"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { 
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            margin: 0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .vocab-header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 40px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        .vocab-header h1 {
            font-size: 2.5em;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .korean-title {
            font-size: 1.8em;
            color: #E91E63;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .study-mode {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 12px 25px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .mode-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .mode-btn.active {
            background: #E91E63;
            border-color: #E91E63;
        }

        .vocabulary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .word-card {
            background: white;
            border-radius: 20px;
            padding: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            text-align: center;
        }

        .word-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .word-emoji {
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .word-korean {
            font-size: 1.6em;
            font-weight: bold;
            color: #2c3e50;
            padding: 10px 15px 5px;
        }

        .word-romanization {
            font-size: 0.95em;
            color: #888;
            font-style: italic;
            padding: 0 15px;
        }

        .word-translation {
            font-size: 1em;
            color: #555;
            padding: 5px 15px 10px;
        }

        .speak-btn {
            background: none;
            border: none;
            font-size: 1.3em;
            cursor: pointer;
            padding: 5px 10px 15px;
            transition: transform 0.2s;
        }

        .speak-btn:hover {
            transform: scale(1.3);
        }

        /* Flashcard styles */
        .flashcard {
            background: rgba(255,255,255,0.95);
            padding: 50px 40px;
            border-radius: 25px;
            margin: 20px auto;
            max-width: 500px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            user-select: none;
        }

        .flashcard:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }

        .flashcard .card-emoji {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .flashcard .card-korean {
            font-size: 2.5em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .flashcard .card-romanization {
            font-size: 1.2em;
            color: #888;
            font-style: italic;
        }

        .flashcard .card-translation {
            font-size: 1.5em;
            color: #555;
            margin-top: 10px;
        }

        .flashcard-nav {
            text-align: center;
            margin-top: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .flashcard-nav .mode-btn {
            min-width: 130px;
        }

        .card-counter {
            color: white;
            font-size: 1.1em;
            font-weight: 500;
            min-width: 80px;
            text-align: center;
        }

        .card-hint {
            text-align: center;
            color: rgba(255,255,255,0.7);
            margin-top: 15px;
            font-size: 0.9em;
        }

        /* Quiz styles */
        .quiz-section {
            background: rgba(255,255,255,0.95);
            border-radius: 25px;
            padding: 40px;
            max-width: 600px;
            margin: 20px auto;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        .quiz-question {
            font-size: 1.5em;
            color: #2c3e50;
            margin-bottom: 25px;
            text-align: center;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .quiz-option {
            padding: 15px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            text-align: center;
            font-size: 1.1em;
        }

        .quiz-option:hover {
            background: #e9ecef;
            transform: translateY(-2px);
        }

        .quiz-option.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .quiz-option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        .quiz-result {
            text-align: center;
            font-size: 1.2em;
            margin-top: 20px;
            font-weight: 500;
        }

        .quiz-stats {
            text-align: center;
            margin-top: 15px;
            color: #666;
        }

        .quiz-buttons {
            text-align: center;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .quiz-buttons button {
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .quiz-buttons .next-btn {
            background: #E91E63;
            color: white;
        }

        .quiz-buttons .restart-btn {
            background: #6c757d;
            color: white;
        }

        .search-bar {
            max-width: 500px;
            margin: 0 auto 25px;
            padding: 0 20px;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .search-bar input::placeholder {
            color: rgba(255,255,255,0.6);
        }

        .search-bar input:focus {
            border-color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.25);
        }

        @media (max-width: 768px) {
            .vocab-header h1 { font-size: 1.8em; }
            .korean-title { font-size: 1.4em; }
            .vocabulary-grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
            .flashcard { padding: 30px 20px; min-height: 180px; }
            .flashcard .card-korean { font-size: 2em; }
            .quiz-options { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap;">
            <a href="../../level_1/index.html" style="color: white; text-decoration: none; font-size: 1.1em; padding: 12px 25px; background: rgba(255,255,255,0.15); border-radius: 15px; transition: all 0.3s ease; backdrop-filter: blur(10px);">← К 1급</a>
        </div>

        <div class="vocab-header">
            <h1>🏠 Дом и мебель</h1>
            <div class="korean-title">집과 가구 [чип-гва га-гу]</div>
            <p>Ваш уютный корейский дом!</p>
        </div>

        <div class="study-mode">
            <button class="mode-btn active" onclick="showMode('vocabulary')">📚 Словарь</button>
            <button class="mode-btn" onclick="showMode('flashcards')">🃏 Карточки</button>
            <button class="mode-btn" onclick="showMode('quiz')">🎯 Тест</button>
        </div>

        <!-- Vocabulary Section -->
        <div id="vocabulary-section">
            <div class="search-bar">
                <input type="text" id="vocabSearch" placeholder="🔍 Поиск слова..." oninput="filterVocabulary()">
            </div>
            <div class="vocabulary-grid" id="vocabularyGrid"></div>
        </div>

        <!-- Flashcard Section -->
        <div id="flashcard-section" style="display: none;">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div id="flashcard-content"></div>
            </div>
            <div class="flashcard-nav">
                <button class="mode-btn" onclick="prevCard()">← Назад</button>
                <span class="card-counter" id="card-counter">1 / 12</span>
                <button class="mode-btn" onclick="nextCard()">Вперёд →</button>
            </div>
            <div class="card-hint">Нажмите на карточку или пробел для переворота. ←→ для навигации</div>
        </div>

        <!-- Quiz Section -->
        <div id="quiz-section" style="display: none;">
            <div class="quiz-section">
                <h2 style="text-align: center; color: #2c3e50; margin-bottom: 20px;">🎯 Тест</h2>
                <div class="quiz-question" id="quiz-question"></div>
                <div class="quiz-options" id="quiz-options"></div>
                <div class="quiz-result" id="quiz-result"></div>
                <div class="quiz-buttons">
                    <button class="next-btn" onclick="nextQuestion()">Следующий вопрос</button>
                    <button class="restart-btn" onclick="restartQuiz()">Начать заново</button>
                </div>
                <div class="quiz-stats" id="quiz-stats">Правильно: <span id="correct-count">0</span> из <span id="total-count">0</span></div>
            </div>
        </div>

        <div style="text-align: center; margin: 40px 0; padding: 30px; background: rgba(255,255,255,0.95); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
            <h3 style="color: #2c3e50; margin-bottom: 20px;">🎉 Отлично!</h3>
            <a href="../../level_1/index.html" style="display: inline-block; background: #E91E63; color: white; padding: 15px 30px; border-radius: 25px; text-decoration: none; font-size: 1.1em; font-weight: 500; transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
                ← К урокам 1급
            </a>
        </div>
    
        <!-- Кнопка завершения урока -->
        <div style="text-align: center; margin: 40px 0; padding: 30px;">
            <button id="completeLessonBtn" onclick="completeLesson()" style="
                background: linear-gradient(135deg, #4CAF50, #45a049);
                color: white;
                border: none;
                padding: 18px 40px;
                font-size: 1.2em;
                font-weight: 600;
                border-radius: 30px;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 6px 20px rgba(76,175,80,0.3);
                font-family: 'Noto Sans KR', sans-serif;
            ">Отметить урок как пройденный</button>
        </div>
    </div>

    <script>
        const vocabulary = [
            {emoji: '🏠', korean: '집', romanization: 'jip', translation: 'дом'},
            {emoji: '🚪', korean: '방', romanization: 'bang', translation: 'комната'},
            {emoji: '🍳', korean: '부엌', romanization: 'bueok', translation: 'кухня'},
            {emoji: '🛁', korean: '화장실', romanization: 'hwajangsil', translation: 'туалет'},
            {emoji: '🛏️', korean: '침대', romanization: 'chimdae', translation: 'кровать'},
            {emoji: '🪑', korean: '의자', romanization: 'uija', translation: 'стул'},
            {emoji: '🍽️', korean: '테이블', romanization: 'teibeul', translation: 'стол'},
            {emoji: '🛋️', korean: '소파', romanization: 'sopa', translation: 'диван'},
            {emoji: '📺', korean: '텔레비전', romanization: 'tellebijeon', translation: 'телевизор'},
            {emoji: '❄️', korean: '냉장고', romanization: 'naengjango', translation: 'холодильник'},
            {emoji: '🪟', korean: '창문', romanization: 'changmun', translation: 'окно'},
            {emoji: '🚪', korean: '문', romanization: 'mun', translation: 'дверь'}
        ];

        let currentCardIndex = 0;
        let isFlipped = false;
        let quizCurrentIndex = 0;
        let correctAnswers = 0;
        let totalQuestions = 0;

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            }
        }

        function filterVocabulary() {
            const query = document.getElementById('vocabSearch').value.toLowerCase();
            const cards = document.querySelectorAll('.word-card');
            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(query) ? '' : 'none';
            });
        }

        function loadVocabulary() {
            const grid = document.getElementById('vocabularyGrid');
            grid.innerHTML = '';
            vocabulary.forEach(word => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.onclick = () => speak(word.korean);
                card.innerHTML = `
                    <div class="word-emoji" style="background: linear-gradient(135deg, #E91E63, #E91E63);">${word.emoji}</div>
                    <div class="word-korean">${word.korean}</div>
                    <div class="word-romanization">${word.romanization}</div>
                    <div class="word-translation">${word.translation}</div>
                    <button class="speak-btn" onclick="event.stopPropagation(); speak('${word.korean}')">🔊</button>
                `;
                grid.appendChild(card);
            });
        }

        function showMode(mode) {
            document.getElementById('vocabulary-section').style.display = mode === 'vocabulary' ? 'block' : 'none';
            document.getElementById('flashcard-section').style.display = mode === 'flashcards' ? 'block' : 'none';
            document.getElementById('quiz-section').style.display = mode === 'quiz' ? 'block' : 'none';
            
            const buttons = document.querySelectorAll('.study-mode .mode-btn');
            buttons.forEach((btn, i) => {
                btn.classList.toggle('active', 
                    (mode === 'vocabulary' && i === 0) ||
                    (mode === 'flashcards' && i === 1) ||
                    (mode === 'quiz' && i === 2)
                );
            });

            if (mode === 'flashcards') updateFlashcard();
            if (mode === 'quiz') generateQuizQuestion();
        }

        function updateFlashcard() {
            const word = vocabulary[currentCardIndex];
            const content = document.getElementById('flashcard-content');
            
            if (isFlipped) {
                content.innerHTML = `
                    <div class="card-emoji">${word.emoji}</div>
                    <div class="card-romanization">${word.romanization}</div>
                    <div class="card-translation">${word.translation}</div>
                `;
            } else {
                content.innerHTML = `
                    <div class="card-emoji">${word.emoji}</div>
                    <div class="card-korean">${word.korean}</div>
                    <button class="speak-btn" onclick="event.stopPropagation(); speak('${word.korean}')">🔊</button>
                `;
            }
            
            document.getElementById('card-counter').textContent = `${currentCardIndex + 1} / ${vocabulary.length}`;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            updateFlashcard();
        }

        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % vocabulary.length;
            isFlipped = false;
            updateFlashcard();
        }

        function prevCard() {
            currentCardIndex = (currentCardIndex - 1 + vocabulary.length) % vocabulary.length;
            isFlipped = false;
            updateFlashcard();
        }

        function generateQuizQuestion() {
            const word = vocabulary[quizCurrentIndex % vocabulary.length];
            const options = [word];
            
            while (options.length < 4) {
                const rw = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                if (!options.includes(rw)) options.push(rw);
            }
            options.sort(() => Math.random() - 0.5);
            
            document.getElementById('quiz-question').textContent = 'Как по-корейски "' + word.translation + '"?';
            
            const container = document.getElementById('quiz-options');
            container.innerHTML = '';
            options.forEach(opt => {
                const div = document.createElement('div');
                div.className = 'quiz-option';
                div.textContent = opt.korean + ' (' + opt.romanization + ')';
                div.onclick = () => checkAnswer(opt, word);
                container.appendChild(div);
            });
            
            document.getElementById('quiz-result').textContent = '';
        }

        function checkAnswer(selected, correct) {
            totalQuestions++;
            const options = document.querySelectorAll('.quiz-option');
            options.forEach(opt => {
                opt.onclick = null;
                if (opt.textContent.includes(correct.korean)) {
                    opt.classList.add('correct');
                } else if (opt.textContent.includes(selected.korean)) {
                    opt.classList.add('wrong');
                }
            });
            
            if (selected.korean === correct.korean) {
                correctAnswers++;
                document.getElementById('quiz-result').innerHTML = '✅ Правильно!';
                document.getElementById('quiz-result').style.color = '#28a745';
            } else {
                document.getElementById('quiz-result').innerHTML = '❌ Неправильно! Ответ: ' + correct.korean;
                document.getElementById('quiz-result').style.color = '#dc3545';
            }
            
            document.getElementById('correct-count').textContent = correctAnswers;
            document.getElementById('total-count').textContent = totalQuestions;
        }

        function nextQuestion() {
            quizCurrentIndex++;
            generateQuizQuestion();
        }

        function restartQuiz() {
            quizCurrentIndex = 0;
            correctAnswers = 0;
            totalQuestions = 0;
            document.getElementById('correct-count').textContent = '0';
            document.getElementById('total-count').textContent = '0';
            generateQuizQuestion();
        }

        // Init
        document.addEventListener('DOMContentLoaded', function() {
            loadVocabulary();
            updateFlashcard();
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('flashcard-section').style.display !== 'none') {
                if (e.code === 'Space') { e.preventDefault(); flipCard(); }
                else if (e.code === 'ArrowRight') { nextCard(); }
                else if (e.code === 'ArrowLeft') { prevCard(); }
            }
        });
    </script>
<script src="../../js/dictionary.js"></script>
    <script src="../../js/dictionary-inject.js"></script>
    <script src="../../js/global-nav.js"></script>
    <script src="../../js/progress-tracker.js"></script>
    <script>
        // Кнопка завершения урока
        var LESSON_ID = 'vocabulary_house';

        function completeLesson() {
            if (window.ProgressTracker) {
                ProgressTracker.markLessonCompleted(LESSON_ID);
                var btn = document.getElementById('completeLessonBtn');
                btn.textContent = 'Пройдено!';
                btn.style.background = '#2e7d32';
                btn.style.cursor = 'default';
                btn.disabled = true;
                btn.style.opacity = '0.85';
                console.log('[OK] Lesson completed:', LESSON_ID);
            }
        }

        // Проверяем статус при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            if (window.ProgressTracker) {
                var progress = ProgressTracker.get();
                if (progress && progress.completedLessons && progress.completedLessons[LESSON_ID]) {
                    var btn = document.getElementById('completeLessonBtn');
                    if (btn) {
                        btn.textContent = 'Пройдено!';
                        btn.style.background = '#2e7d32';
                        btn.style.cursor = 'default';
                        btn.disabled = true;
                        btn.style.opacity = '0.85';
                    }
                }
            }
        });
    </script>
</body>
</html>
