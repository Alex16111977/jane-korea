<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Социальные темы - 3급</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #059669, #0891B2, #7C3AED);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .nav {
            background: rgba(255,255,255,0.95);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .nav a {
            background: #059669;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 10px;
            margin: 0 10px;
            display: inline-block;
            transition: all 0.3s;
        }
        
        .nav a:hover {
            background: #047857;
            transform: translateY(-2px);
        }
        
        .lesson-header {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .lesson-header h1 {
            font-size: 2.5em;
            color: #059669;
            margin-bottom: 10px;
        }
        
        .social-animation {
            position: relative;
            height: 100px;
            margin: 20px 0;
            overflow: hidden;
            border-radius: 15px;
            background: linear-gradient(to bottom, #ECFDF5, #DBEAFE);
        }
        
        .social-emoji {
            position: absolute;
            font-size: 2.5em;
            animation: float 6s ease-in-out infinite;
        }
        
        .item1 {
            top: 20px;
            left: 10%;
            animation-delay: 0s;
        }
        
        .item2 {
            top: 40px;
            left: 30%;
            animation-delay: -1.5s;
        }
        
        .item3 {
            top: 15px;
            left: 50%;
            animation-delay: -3s;
        }
        
        .item4 {
            top: 35px;
            left: 70%;
            animation-delay: -4.5s;
        }
        
        .vocabulary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .vocab-card {
            background: rgba(255,255,255,0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .vocab-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #059669, #0891B2);
        }
        
        .vocab-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .korean-word {
            font-size: 1.8em;
            font-weight: bold;
            color: #059669;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .pronunciation {
            font-size: 1.1em;
            color: #0891B2;
            margin-bottom: 10px;
            font-style: italic;
            text-align: center;
        }
        
        .translation {
            font-size: 1.1em;
            color: #7C3AED;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 500;
        }
        
        .social-context {
            background: #ECFDF5;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: #065F46;
            border-left: 3px solid #059669;
        }
        
        .example-sentence {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #0891B2;
            font-size: 0.9em;
        }
        
        .korean-sentence {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .speak-btn {
            background: #7C3AED;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
            font-size: 0.9em;
            color: white;
        }
        
        .speak-btn:hover {
            background: #059669;
        }
        
        .study-mode {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .mode-btn {
            background: #7C3AED;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .mode-btn.active {
            background: #059669;
        }
        
        .flashcard {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 20px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .flashcard:hover {
            transform: rotateY(3deg) scale(1.02);
        }
        
        .flashcard::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #059669, #0891B2);
            border-radius: 20px 20px 0 0;
        }
        
        .quiz-section {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .quiz-question {
            font-size: 1.3em;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .quiz-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .quiz-option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .quiz-option:hover {
            background: #e9ecef;
        }
        
        .quiz-option.correct {
            background: #d4edda;
            border-color: #28a745;
        }
        
        .quiz-option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
        }
        
        .progress-bar {
            background: #e9ecef;
            border-radius: 10px;
            height: 20px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            background: linear-gradient(90deg, #059669, #0891B2);
            height: 100%;
            width: 0%;
            transition: width 0.5s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="../index.html">← К 3급</a>
            <a href="../../index.html">🏠 Главная</a>
        </div>
        
        <div class="lesson-header">
            <h1>🌍 Социальные темы</h1>
            <p>Изучаем лексику для обсуждения современных социальных вопросов</p>
            
            <div class="social-animation">
                <div class="social-emoji item1">🏛️</div>
                <div class="social-emoji item2">🗳️</div>
                <div class="social-emoji item3">🌱</div>
                <div class="social-emoji item4">⚖️</div>
            </div>
        </div>
        
        <div class="study-mode">
            <button class="mode-btn active" onclick="showVocabulary()">📚 Социальная лексика</button>
            <button class="mode-btn" onclick="showFlashcards()">🃏 Карточки</button>
            <button class="mode-btn" onclick="showQuiz()">🎯 Тест</button>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        
        <div id="vocabulary-section">
            <div class="vocabulary-grid" id="vocabularyGrid">
                <!-- Будет заполнено JS -->
            </div>
        </div>
        
        <div id="flashcard-section" style="display: none;">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div id="flashcard-content">
                    <div class="korean-word" id="flashcard-korean">사회</div>
                    <button class="speak-btn" onclick="speak(document.getElementById('flashcard-korean').textContent, event)">🔊</button>
                </div>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="mode-btn" onclick="prevCard()">← Предыдущая</button>
                <span id="card-counter">1 / 12</span>
                <button class="mode-btn" onclick="nextCard()">Следующая →</button>
            </div>
            <div style="text-align: center; margin-top: 10px; color: #666;">
                <small>Нажмите на карточку для переворота или используйте Пробел</small>
            </div>
        </div>
        
        <div id="quiz-section" style="display: none;">
            <div class="quiz-section">
                <h2>🎯 Тест: Социальные темы</h2>
                <div class="quiz-question" id="quiz-question">
                    Что означает "정치"?
                </div>
                <div class="quiz-options" id="quiz-options">
                    <!-- Будет заполнено JS -->
                </div>
                <div style="text-align: center; margin-top: 20px;">
                    <button class="mode-btn" onclick="nextQuestion()">Следующий вопрос</button>
                    <button class="mode-btn" onclick="restartQuiz()">Начать заново</button>
                </div>
                <div id="quiz-stats" style="text-align: center; margin-top: 20px;">
                    Правильных ответов: <span id="correct-count">0</span> из <span id="total-count">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const vocabulary = [
            {
                korean: '사회',
                pronunciation: 'са-хвэ',
                translation: 'общество',
                context: 'Основное понятие для обсуждения социальных вопросов',
                example: '현대 사회의 문제를 해결해야 합니다',
                exampleTranslation: 'Нужно решать проблемы современного общества'
            },
            {
                korean: '정치',
                pronunciation: 'чон-чхи',
                translation: 'политика',
                context: 'Государственное управление и политическая деятельность',
                example: '정치에 관심이 많아졌어요',
                exampleTranslation: 'Стал больше интересоваться политикой'
            },
            {
                korean: '민주주의',
                pronunciation: 'мин-джу-джу-ый',
                translation: 'демократия',
                context: 'Форма государственного устройства',
                example: '민주주의 가치를 지켜야 합니다',
                exampleTranslation: 'Нужно защищать демократические ценности'
            },
            {
                korean: '인권',
                pronunciation: 'ин-гвон',
                translation: 'права человека',
                context: 'Основные права и свободы человека',
                example: '모든 사람의 인권을 존중해야 해요',
                exampleTranslation: 'Нужно уважать права всех людей'
            },
            {
                korean: '평등',
                pronunciation: 'пхён-дын',
                translation: 'равенство',
                context: 'Принцип социальной справедливости',
                example: '성별에 관계없이 평등한 기회를 줘야 합니다',
                exampleTranslation: 'Нужно давать равные возможности независимо от пола'
            },
            {
                korean: '환경',
                pronunciation: 'хван-ген',
                translation: 'окружающая среда',
                context: 'Экологические вопросы и защита природы',
                example: '환경 보호가 시급한 문제예요',
                exampleTranslation: 'Защита окружающей среды - срочная проблема'
            },
            {
                korean: '교육',
                pronunciation: 'кё-ук',
                translation: 'образование',
                context: 'Система обучения и воспитания',
                example: '좋은 교육을 받을 권리가 있어요',
                exampleTranslation: 'Есть право на получение хорошего образования'
            },
            {
                korean: '복지',
                pronunciation: 'пок-чжи',
                translation: 'социальное обеспечение',
                context: 'Система поддержки граждан государством',
                example: '사회 복지 제도를 개선해야 합니다',
                exampleTranslation: 'Нужно улучшать систему социального обеспечения'
            },
            {
                korean: '차별',
                pronunciation: 'чха-бёль',
                translation: 'дискриминация',
                context: 'Несправедливое отношение к людям',
                example: '어떤 차별도 있어서는 안 됩니다',
                exampleTranslation: 'Никакой дискриминации быть не должно'
            },
            {
                korean: '갈등',
                pronunciation: 'каль-дын',
                translation: 'конфликт',
                context: 'Противоречия и споры в обществе',
                example: '사회적 갈등을 해결하는 것이 중요해요',
                exampleTranslation: 'Важно решать социальные конфликты'
            },
            {
                korean: '세대',
                pronunciation: 'се-дэ',
                translation: 'поколение',
                context: 'Группы людей одного возраста',
                example: '세대 간의 이해가 필요합니다',
                exampleTranslation: 'Нужно взаимопонимание между поколениями'
            },
            {
                korean: '문화',
                pronunciation: 'мун-хва',
                translation: 'культура',
                context: 'Традиции, искусство и образ жизни',
                example: '다양한 문화를 존중해야 해요',
                exampleTranslation: 'Нужно уважать разные культуры'
            }
        ];
        
        let currentCardIndex = 0;
        let isFlipped = false;
        let quizCurrentIndex = 0;
        let correctAnswers = 0;
        let totalQuestions = 0;
        
        function loadVocabulary() {
            const grid = document.getElementById('vocabularyGrid');
            grid.innerHTML = '';
            
            vocabulary.forEach((word, index) => {
                const card = document.createElement('div');
                card.className = 'vocab-card';
                card.innerHTML = `
                    <div class="korean-word">${word.korean}</div>
                    <div class="pronunciation">${word.pronunciation}</div>
                    <div class="translation">${word.translation}</div>
                    <div class="social-context">🏛️ ${word.context}</div>
                    <div class="example-sentence">
                        <div class="korean-sentence">${word.example}</div>
                        <div>${word.exampleTranslation}</div>
                    </div>
                    <button class="speak-btn" onclick="speak('${word.korean}', event)">🔊 Слово</button>
                    <button class="speak-btn" onclick="speak('${word.example}', event)">🔊 Пример</button>
                `;
                grid.appendChild(card);
            });
            
            updateProgress();
        }
        
        function speak(text, event) {
            if (event) {
                event.stopPropagation(); // Предотвращаем переворот карточки
            }
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            }
        }
        
        function showVocabulary() {
            document.getElementById('vocabulary-section').style.display = 'block';
            document.getElementById('flashcard-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'none';
            updateActiveButton(0);
        }
        
        function showFlashcards() {
            document.getElementById('vocabulary-section').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'block';
            document.getElementById('quiz-section').style.display = 'none';
            updateActiveButton(1);
            updateFlashcard();
        }
        
        function showQuiz() {
            document.getElementById('vocabulary-section').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            updateActiveButton(2);
            generateQuizQuestion();
        }
        
        function updateActiveButton(index) {
            const buttons = document.querySelectorAll('.mode-btn');
            buttons.forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        function updateFlashcard() {
            const word = vocabulary[currentCardIndex];
            const content = document.getElementById('flashcard-content');
            
            if (isFlipped) {
                content.innerHTML = `
                    <div class="pronunciation">${word.pronunciation}</div>
                    <div class="translation">${word.translation}</div>
                    <div class="social-context">🏛️ ${word.context}</div>
                    <div class="example-sentence" style="margin-top: 15px;">
                        <div class="korean-sentence">${word.example}</div>
                        <div style="font-size: 0.9em; color: #666;">${word.exampleTranslation}</div>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <div class="korean-word">${word.korean}</div>
                    <button class="speak-btn" onclick="speak('${word.korean}', event)">🔊 Произнести</button>
                `;
            }
            
            document.getElementById('card-counter').textContent = `${currentCardIndex + 1} / ${vocabulary.length}`;
        }
        
        function flipCard() {
            isFlipped = !isFlipped;
            const flashcard = document.getElementById('flashcard');
            flashcard.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
            setTimeout(() => {
                updateFlashcard();
                flashcard.style.transform = 'rotateY(0deg)';
            }, 150);
        }
        
        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % vocabulary.length;
            isFlipped = false;
            updateFlashcard();
        }
        
        function prevCard() {
            currentCardIndex = (currentCardIndex - 1 + vocabulary.length) % vocabulary.length;
            isFlipped = false;
            updateFlashcard();
        }
        
        function generateQuizQuestion() {
            const word = vocabulary[quizCurrentIndex % vocabulary.length];
            const options = [word];
            
            while (options.length < 4) {
                const randomWord = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                if (!options.includes(randomWord)) {
                    options.push(randomWord);
                }
            }
            
            options.sort(() => Math.random() - 0.5);
            
            const questionTypes = [
                `Что означает "${word.korean}"?`,
                `Как по-корейски "${word.translation}"?`
            ];
            
            const questionType = Math.floor(Math.random() * questionTypes.length);
            document.getElementById('quiz-question').textContent = questionTypes[questionType];
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            options.forEach(option => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'quiz-option';
                
                if (questionType === 0) {
                    optionDiv.textContent = option.translation;
                } else {
                    optionDiv.innerHTML = `${option.korean} <br><small>(${option.pronunciation})</small>`;
                }
                
                optionDiv.onclick = () => selectAnswer(option, word);
                optionsContainer.appendChild(optionDiv);
            });
        }
        
        function selectAnswer(selected, correct) {
            totalQuestions++;
            const options = document.querySelectorAll('.quiz-option');
            
            options.forEach(option => {
                option.onclick = null;
                if (option.textContent.includes(correct.korean) || option.textContent.includes(correct.translation)) {
                    option.classList.add('correct');
                } else if (option.textContent.includes(selected.korean) || option.textContent.includes(selected.translation)) {
                    option.classList.add('wrong');
                }
            });
            
            if (selected.korean === correct.korean) {
                correctAnswers++;
            }
            
            document.getElementById('correct-count').textContent = correctAnswers;
            document.getElementById('total-count').textContent = totalQuestions;
        }
        
        function nextQuestion() {
            quizCurrentIndex++;
            generateQuizQuestion();
        }
        
        function restartQuiz() {
            quizCurrentIndex = 0;
            correctAnswers = 0;
            totalQuestions = 0;
            document.getElementById('correct-count').textContent = '0';
            document.getElementById('total-count').textContent = '0';
            generateQuizQuestion();
        }
        
        function updateProgress() {
            const progress = 100;
            document.getElementById('progress').style.width = progress + '%';
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            loadVocabulary();
            updateFlashcard();
            generateQuizQuestion();
            
            // Анимация появления карточек
            const cards = document.querySelectorAll('.vocab-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.5s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 120);
            });
        });
        
        // Горячие клавиши
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('flashcard-section').style.display !== 'none') {
                if (e.code === 'Space') {
                    e.preventDefault();
                    flipCard();
                } else if (e.code === 'ArrowRight') {
                    nextCard();
                } else if (e.code === 'ArrowLeft') {
                    prevCard();
                }
            }
        });
    </script>
    <!-- Кнопка завершения урока -->
    <div style="text-align: center; margin: 40px 0; padding: 30px;">
        <button id="completeLessonBtn" onclick="completeLesson()" style="
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.2em;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(76,175,80,0.3);
            font-family: 'Noto Sans KR', sans-serif;
        ">Отметить урок как пройденный</button>
    </div>

    <script>
        var LESSON_ID = 'level3_lesson_social_topics';

        function completeLesson() {
            if (window.ProgressTracker) {
                if (!ProgressTracker.markLessonCompleted(LESSON_ID)) return;
                var btn = document.getElementById('completeLessonBtn');
                btn.textContent = 'Пройдено!';
                btn.style.background = '#2e7d32';
                btn.style.cursor = 'default';
                btn.disabled = true;
                btn.style.opacity = '0.85';
                console.log('[OK] Lesson completed:', LESSON_ID);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (window.ProgressTracker) {
                var progress = ProgressTracker.get();
                if (progress && progress.completedLessons && progress.completedLessons[LESSON_ID]) {
                    var btn = document.getElementById('completeLessonBtn');
                    if (btn) {
                        btn.textContent = 'Пройдено!';
                        btn.style.background = '#2e7d32';
                        btn.style.cursor = 'default';
                        btn.disabled = true;
                        btn.style.opacity = '0.85';
                    }
                }
            }
        });
    </script>
