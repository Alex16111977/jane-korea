<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест по уровню — Jane Korea</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 12%;
            right: 5%;
            font-size: 120px;
            opacity: 0.04;
            animation: floatSlow 10s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: 8%;
            left: 4%;
            font-size: 100px;
            opacity: 0.04;
            animation: floatSlow 13s ease-in-out infinite reverse;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(5deg); }
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .back-link {
            display: inline-block;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-size: 0.9em;
            margin-bottom: 15px;
            transition: color 0.3s;
        }
        .back-link:hover { color: white; }

        .test-header {
            text-align: center;
            padding: 30px 20px;
            margin-bottom: 25px;
        }
        .test-header h1 {
            color: white;
            font-size: 1.8em;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            margin-bottom: 8px;
        }
        .test-header p {
            color: rgba(255,255,255,0.85);
            font-size: 1em;
        }

        /* Progress */
        .progress-wrapper {
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 15px 20px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .progress-text {
            color: white;
            font-size: 0.9em;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .progress-bar { background: rgba(255,255,255,0.2); border-radius: 10px; height: 10px; overflow: hidden; }
        .progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
            width: 0%;
        }

        /* Question */
        .question-card {
            background: white;
            border-radius: 20px;
            padding: 35px 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            animation: cardIn 0.4s ease;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .question-number {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 500;
            margin-bottom: 15px;
            color: white;
        }
        .question-text {
            font-size: 1.25em;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .question-text .korean { font-size: 1.1em; }
        .question-context {
            background: #f8f5ff;
            border-left: 4px solid #764ba2;
            padding: 12px 16px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 20px;
            font-size: 0.95em;
            color: #555;
        }

        .options-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            display: block; width: 100%; text-align: left;
            padding: 16px 20px;
            background: #f8f9ff; border: 2px solid #e8eaf6;
            border-radius: 14px; font-size: 1.05em; color: #333;
            cursor: pointer; transition: all 0.25s ease; font-family: inherit;
        }
        .option-btn:hover:not(.disabled) {
            background: #ede7f6; border-color: #b39ddb; transform: translateX(5px);
        }
        .option-btn.correct {
            background: #e8f5e9; border-color: #4caf50; color: #2e7d32; font-weight: 600;
        }
        .option-btn.correct::after { content: ' [OK]'; color: #4caf50; font-weight: 700; }
        .option-btn.wrong {
            background: #ffebee; border-color: #f44336; color: #c62828;
        }
        .option-btn.wrong::after { content: ' [X]'; color: #f44336; font-weight: 700; }
        .option-btn.disabled { pointer-events: none; opacity: 0.7; }

        /* Results */
        .results-card {
            background: white; border-radius: 24px; padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); text-align: center;
            animation: cardIn 0.5s ease;
        }
        .result-emoji { font-size: 4em; margin-bottom: 10px; animation: bounceIn 0.6s ease; }
        @keyframes bounceIn {
            0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); }
        }
        .result-title {
            font-size: 1.8em; font-weight: 700; margin-bottom: 5px;
        }
        .result-score { font-size: 1.15em; color: #444; margin-bottom: 15px; }
        .result-bar-wrapper {
            background: #f0f0f0; border-radius: 10px; height: 14px; margin: 15px 0 25px; overflow: hidden;
        }
        .result-bar-fill { height: 100%; border-radius: 10px; transition: width 1s ease; }

        .result-verdict {
            border-radius: 14px; padding: 20px; margin-bottom: 25px; text-align: left; line-height: 1.7;
        }
        .result-verdict h3 { margin-bottom: 8px; }

        .result-buttons { display: flex; flex-direction: column; gap: 12px; }
        .result-btn {
            display: block; width: 100%; padding: 16px 20px; border: none;
            border-radius: 14px; font-size: 1.05em; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease; font-family: inherit;
            text-decoration: none; text-align: center;
        }
        .result-btn.primary { color: white; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .result-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .result-btn.secondary { background: #f0f0f0; color: #555; }
        .result-btn.secondary:hover { background: #e0e0e0; }
        .result-btn.outline { background: transparent; color: #764ba2; border: 2px solid #764ba2; }
        .result-btn.outline:hover { background: #f8f5ff; }

        /* Start */
        .start-card {
            background: white; border-radius: 24px; padding: 40px 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15); text-align: center;
            animation: cardIn 0.5s ease;
        }
        .start-card .start-emoji { font-size: 3.5em; margin-bottom: 15px; }
        .start-card h2 { font-size: 1.5em; color: #2c3e50; margin-bottom: 10px; }
        .start-card p { color: #666; margin-bottom: 8px; }
        .start-info {
            background: #f8f5ff; border-radius: 14px; padding: 20px; margin: 20px 0; text-align: left;
        }
        .start-info li {
            color: #555; margin-bottom: 6px; list-style: none; padding-left: 20px; position: relative;
        }
        .start-info li::before {
            content: ''; position: absolute; left: 0; top: 10px;
            width: 8px; height: 8px; border-radius: 50%;
        }
        .start-btn {
            display: inline-block; padding: 16px 50px; color: white; border: none;
            border-radius: 14px; font-size: 1.15em; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease; font-family: inherit;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2); margin-top: 10px;
        }
        .start-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }

        /* Review */
        .review-section { margin-top: 25px; }
        .review-toggle {
            background: none; border: none; font-size: 0.95em;
            cursor: pointer; font-family: inherit; text-decoration: underline; margin-bottom: 15px;
        }
        .review-list { display: none; text-align: left; }
        .review-list.open { display: block; }
        .review-item {
            background: #f8f9ff; border-radius: 12px; padding: 12px 16px;
            margin-bottom: 8px; font-size: 0.9em; border-left: 4px solid #ccc;
        }
        .review-item.correct-item { border-left-color: #4caf50; }
        .review-item.wrong-item { border-left-color: #f44336; }
        .review-item .q-text { font-weight: 600; color: #333; margin-bottom: 4px; }
        .review-item .q-answer { color: #666; }
        .review-item .q-answer .right { color: #4caf50; font-weight: 600; }
        .review-item .q-answer .wrong-text { color: #f44336; text-decoration: line-through; }

        @media (max-width: 768px) {
            .container { padding: 15px; }
            .test-header h1 { font-size: 1.4em; }
            .question-card { padding: 25px 20px; }
            .question-text { font-size: 1.1em; }
            .option-btn { padding: 14px 16px; font-size: 0.95em; }
            body::before { font-size: 80px; }
            body::after { font-size: 70px; }
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <a id="backLink" href="lessons.html" class="back-link">← Назад</a>

        <div class="test-header">
            <h1 id="testTitle">Тест по уровню</h1>
            <p id="testSubtitle">Проверьте свои знания</p>
        </div>

        <!-- START -->
        <div id="startScreen" class="start-card">
            <div class="start-emoji" id="startEmoji">📝</div>
            <h2 id="startTitle">Тест</h2>
            <p id="startDesc">Проверьте, насколько хорошо вы знаете материал</p>
            <div class="start-info">
                <ul>
                    <li>10 вопросов по материалу уровня</li>
                    <li>Лексика, грамматика, понимание</li>
                    <li>Около 3 минут</li>
                    <li>Результат покажет ваши сильные стороны</li>
                </ul>
            </div>
            <button class="start-btn" id="startBtn" onclick="startTest()">Начать тест</button>
        </div>

        <!-- PROGRESS -->
        <div id="progressWrapper" class="progress-wrapper hidden">
            <div class="progress-text">
                <span id="progressLabel">Вопрос 1 из 10</span>
                <span id="progressCategory"></span>
            </div>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
        </div>

        <!-- QUESTION -->
        <div id="questionCard" class="question-card hidden">
            <div id="questionNumber" class="question-number"></div>
            <div id="questionContext" class="question-context hidden"></div>
            <div id="questionText" class="question-text"></div>
            <ul id="optionsList" class="options-list"></ul>
        </div>

        <!-- RESULTS -->
        <div id="resultsCard" class="results-card hidden">
            <div class="result-emoji" id="resultEmoji">🎯</div>
            <div class="result-title" id="resultTitle"></div>
            <div class="result-score" id="resultScore"></div>
            <div class="result-bar-wrapper">
                <div id="resultBarFill" class="result-bar-fill" style="width:0%"></div>
            </div>
            <div id="resultVerdict" class="result-verdict"></div>
            <div class="result-buttons">
                <a id="btnLevel" class="result-btn primary" href="#">Перейти к уровню →</a>
                <button class="result-btn secondary" onclick="startTest()">Пройти заново</button>
                <a href="placement-test.html" class="result-btn outline">Пройти общий тест</a>
            </div>
            <div class="review-section">
                <button class="review-toggle" id="reviewToggle" onclick="toggleReview()">Показать ответы</button>
                <div id="reviewList" class="review-list"></div>
            </div>
        </div>
    </div>

    <script src="js/global-nav.js"></script>

        },
        5: {
            name: '5급 — Продвинутый',
            emoji: '🏆',
            color1: '#FF7043', color2: '#E64A19',
            backLink: 'level_5/index.html',
            subtitle: 'Способность, обязанность, сложные конструкции',
            questions: [
                { cat: 'Способность', q: '<span class="korean">한국어를 <u>할 수 있어요</u></span> — переведите:', opts: ['Должен учить корейский', 'Могу говорить по-корейски', 'Хочу говорить по-корейски', 'Учу корейский'], c: 1 },
                { cat: 'Обязанность', q: '<span class="korean">약을 <u>먹어야 해요</u></span> — 아야 하다:', opts: ['хочу принять лекарство', 'могу принять', 'должен принять лекарство', 'попробовал принять'], c: 2 },
                { cat: 'Помощь', q: '<span class="korean">짐을 들<u>어 줄까요</u>?</span> — 아/어 주다:', opts: ['делать вместо', 'делать для кого-то', 'перестать делать', 'заставить делать'], c: 1 },
                { cat: 'Разрешение', q: '<span class="korean">여기 앉<u>아도 돼요</u>?</span> — 아도 되다:', opts: ['нужно ли сесть?', 'можно ли сесть?', 'хочу сесть', 'уже сел'], c: 1 },
                { cat: 'Опыт', q: '<span class="korean">한복을 입<u>어 본 적이 있어요</u></span> — переведите:', opts: ['Хочу надеть ханбок', 'Надевал ханбок (есть опыт)', 'Должен надеть ханбок', 'Не надевал ханбок'], c: 1 },
                { cat: 'Невозможность', q: '<span class="korean">너무 매워서 <u>못 먹었어요</u></span> — 못:', opts: ['не хотел есть', 'не стал есть', 'не смог есть', 'не должен есть'], c: 2 },
                { cat: 'Уступка', q: '<span class="korean"><u>아무리</u> 힘들어도 포기하지 마세요</span> — аналог:', opts: ['потому что тяжело', 'если тяжело', 'как бы ни было тяжело', 'когда тяжело'], c: 2 },
                { cat: 'Условие', q: '<span class="korean">열심히 공부하<u>면</u> 합격할 거예요</span> — 면:', opts: ['потому что', 'если', 'хотя', 'после того как'], c: 1 },
                { cat: 'Цитата', q: '<span class="korean">내일 온<u>다고</u> 했어요</span> — 다고 하다:', opts: ['хочу прийти', 'сказал, что придёт', 'должен прийти', 'может прийти'], c: 1 },
                { cat: 'Намерение', q: '<span class="korean">한국에 <u>가려고</u> 돈을 모아요</span> — 려고:', opts: ['после поездки', 'вместо поездки', 'с целью поехать', 'если поеду'], c: 2 }
            ]
        },
        6: {
            name: '6급 — Мастер',
            emoji: '👑',
            color1: '#5C6BC0', color2: '#283593',
            backLink: 'level_6/index.html',
            subtitle: 'Литературный стиль, абстрактные конструкции',
            questions: [
                { cat: 'Уступка', q: '<span class="korean">노력했<u>음에도 불구하고</u> 실패했다</span> — переведите:', opts: ['Благодаря усилиям успех', 'Несмотря на усилия, провал', 'Из-за усилий устал', 'После усилий результат'], c: 1 },
                { cat: 'Повод', q: '<span class="korean">그 사건<u>을 계기로</u> 법이 바뀌었다</span> — 을 계기로:', opts: ['вопреки событию', 'это событие стало поводом', 'до этого события', 'вместо события'], c: 1 },
                { cat: 'Неизбежность', q: '<span class="korean">경제가 나아<u>질 수밖에 없다</u></span> — 수밖에 없다:', opts: ['невозможность', 'неизбежность', 'запрет', 'сожаление'], c: 1 },
                { cat: 'Способ', q: '<span class="korean">들은 <u>대로</u> 전해 주세요</span> — 대로:', opts: ['наоборот', 'вместо', 'так как (услышал)', 'до того как'], c: 2 },
                { cat: 'Гипотеза', q: '<span class="korean">로또에 당첨된<u>다면</u> 세계여행을 할 거예요</span> — 다면:', opts: ['когда', 'если бы (гипотеза)', 'потому что', 'хотя'], c: 1 },
                { cat: 'Время', q: '<span class="korean">도착하<u>자마자</u> 전화해 주세요</span> — 자마자:', opts: ['перед прибытием', 'после прибытия', 'как только (сразу)', 'во время прибытия'], c: 2 },
                { cat: 'Пассив', q: '<span class="korean">이 노래는 많은 사람들에게 <u>불린다</u></span> — пассив от 부르다:', opts: ['поёт', 'поётся (пассив)', 'заставляет петь', 'хочет петь'], c: 1 },
                { cat: 'Причина', q: '<span class="korean">교통사고<u>로 인해</u> 길이 막혔다</span> — 로 인해:', opts: ['несмотря на', 'вследствие, из-за', 'помимо', 'ради'], c: 1 },
                { cat: 'Стиль', q: 'Какой стиль: <span class="korean">~(으)ㄹ 것으로 보인다</span>?', opts: ['разговорный', 'официальный/газетный', 'детский', 'сленг'], c: 1 },
                { cat: 'Понимание', q: '<span class="korean">그는 성공<u>은커녕</u> 시작도 못 했다</span> — 은커녕:', opts: ['благодаря', 'не говоря уж о... (даже не)', 'ради', 'помимо'], c: 1 }
            ]
        }
    };

    // === STATE ===
    let currentLevel = 1;
    let currentQ = 0;
    let score = 0;
    let answers = [];
    let isAnswering = false;
    let currentQuestions = [];

    // === INIT ===
    function init() {
        const params = new URLSearchParams(window.location.search);
        currentLevel = parseInt(params.get('level')) || 1;
        if (!LEVELS[currentLevel]) currentLevel = 1;

        const lvl = LEVELS[currentLevel];
        currentQuestions = lvl.questions;

        // Theme
        document.body.style.background = 'radial-gradient(circle at 20% 80%, rgba(255,255,255,0.08) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255,255,255,0.08) 0%, transparent 50%), linear-gradient(135deg, ' + lvl.color1 + ' 0%, ' + lvl.color2 + ' 100%)';
        document.body.style.setProperty('--accent', lvl.color1);
        document.querySelector('.progress-fill').style.background = 'linear-gradient(90deg, ' + lvl.color1 + ', #ffc857)';
        document.querySelector('.result-bar-fill').style.background = 'linear-gradient(90deg, ' + lvl.color2 + ', ' + lvl.color1 + ', #4caf50)';

        // Dot colors in start-info
        document.querySelectorAll('.start-info li').forEach(function(li) {
            li.style.setProperty('--dot', lvl.color1);
            li.querySelector(':before') || (li.style.cssText += '');
        });
        var style = document.createElement('style');
        style.textContent = '.start-info li::before { background: ' + lvl.color1 + ' !important; } .question-number { background: linear-gradient(135deg, ' + lvl.color1 + ', ' + lvl.color2 + '); } .question-text .korean { color: ' + lvl.color2 + '; } .question-context { border-left-color: ' + lvl.color1 + '; } .start-btn { background: linear-gradient(135deg, ' + lvl.color1 + ', ' + lvl.color2 + '); } .result-btn.primary { background: linear-gradient(135deg, ' + lvl.color1 + ', ' + lvl.color2 + '); } .result-title { color: ' + lvl.color2 + '; } .review-toggle { color: ' + lvl.color2 + '; } .result-btn.outline { color: ' + lvl.color2 + '; border-color: ' + lvl.color2 + '; }';
        document.head.appendChild(style);

        // Content
        document.getElementById('backLink').href = lvl.backLink;
        document.getElementById('backLink').textContent = '\u2190 ' + lvl.name;
        document.getElementById('testTitle').textContent = 'Тест: ' + lvl.name;
        document.getElementById('testSubtitle').textContent = lvl.subtitle;
        document.getElementById('startEmoji').textContent = lvl.emoji;
        document.getElementById('startTitle').textContent = 'Тест ' + currentLevel + '\uAE09';
        document.getElementById('startDesc').textContent = lvl.subtitle;
        document.getElementById('btnLevel').href = lvl.backLink;
        document.getElementById('btnLevel').textContent = 'Вернуться к ' + currentLevel + '\uAE09 \u2192';

        document.body.style.setProperty('--before-emoji', '"' + lvl.emoji + '"');
        document.querySelector('title').textContent = 'Тест ' + currentLevel + '\uAE09 \u2014 Jane Korea';
    }

    function startTest() {
        currentQ = 0;
        score = 0;
        answers = [];
        isAnswering = false;

        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('resultsCard').classList.add('hidden');
        document.getElementById('progressWrapper').classList.remove('hidden');
        document.getElementById('questionCard').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const q = currentQuestions[currentQ];
        const total = currentQuestions.length;

        document.getElementById('progressLabel').textContent = 'Вопрос ' + (currentQ + 1) + ' из ' + total;
        document.getElementById('progressCategory').textContent = q.cat;
        document.getElementById('progressFill').style.width = ((currentQ / total) * 100) + '%';

        document.getElementById('questionNumber').textContent = q.cat;

        const ctx = document.getElementById('questionContext');
        if (q.context) {
            ctx.innerHTML = q.context;
            ctx.classList.remove('hidden');
        } else {
            ctx.classList.add('hidden');
        }

        document.getElementById('questionText').innerHTML = q.q;

        const list = document.getElementById('optionsList');
        list.innerHTML = '';
        q.opts.forEach(function(opt, i) {
            var li = document.createElement('li');
            var btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.onclick = function() { selectAnswer(i); };
            li.appendChild(btn);
            list.appendChild(li);
        });

        var card = document.getElementById('questionCard');
        card.style.animation = 'none';
        card.offsetHeight;
        card.style.animation = 'cardIn 0.4s ease';
    }

    function selectAnswer(index) {
        if (isAnswering) return;
        isAnswering = true;

        var q = currentQuestions[currentQ];
        var buttons = document.querySelectorAll('.option-btn');

        buttons.forEach(function(btn) { btn.classList.add('disabled'); });
        buttons[q.c].classList.add('correct');

        if (index !== q.c) {
            buttons[index].classList.add('wrong');
        } else {
            score++;
        }

        answers.push({
            question: q.q.replace(/<[^>]+>/g, ''),
            selected: q.opts[index],
            correct: q.opts[q.c],
            isCorrect: index === q.c,
            cat: q.cat
        });

        setTimeout(function() {
            currentQ++;
            isAnswering = false;
            if (currentQ < currentQuestions.length) {
                showQuestion();
            } else {
                showResults();
            }
        }, 800);
    }

    function showResults() {
        var total = currentQuestions.length;
        var pct = Math.round((score / total) * 100);
        var lvl = LEVELS[currentLevel];

        document.getElementById('progressWrapper').classList.add('hidden');
        document.getElementById('questionCard').classList.add('hidden');
        document.getElementById('resultsCard').classList.remove('hidden');

        var emoji, title, verdictClass, verdictHtml;

        if (pct >= 90) {
            emoji = '\uD83C\uDFC6'; title = 'Превосходно!';
            verdictHtml = '<h3>\uD83C\uDF1F Вы отлично знаете материал ' + currentLevel + '\uAE09!</h3><p>Вы готовы переходить к следующему уровню. Все темы усвоены на отлично.</p>';
            verdictClass = 'background: #e8f5e9; border-left: 4px solid #4caf50;';
        } else if (pct >= 70) {
            emoji = '\uD83D\uDC4D'; title = 'Хороший результат!';
            verdictHtml = '<h3>\u2705 Хорошее знание ' + currentLevel + '\uAE09</h3><p>Большинство тем усвоены. Повторите те, где ошиблись, и можно двигаться дальше.</p>';
            verdictClass = 'background: #fff8e1; border-left: 4px solid #ffc107;';
        } else if (pct >= 50) {
            emoji = '\uD83D\uDCAA'; title = 'Неплохо, но есть пробелы';
            verdictHtml = '<h3>\uD83D\uDCD6 Стоит повторить ' + currentLevel + '\uAE09</h3><p>Базовые темы есть, но некоторые нужно подтянуть. Пройдите уроки, в которых ошиблись.</p>';
            verdictClass = 'background: #fff3e0; border-left: 4px solid #ff9800;';
        } else {
            emoji = '\uD83D\uDCDA'; title = 'Нужно подучить';
            verdictHtml = '<h3>\uD83C\uDF31 Начните с уроков ' + currentLevel + '\uAE09</h3><p>Этот уровень ещё не освоен. Пройдите уроки по порядку \u2014 и скоро этот тест будет лёгким!</p>';
            verdictClass = 'background: #ffebee; border-left: 4px solid #f44336;';
        }

        document.getElementById('resultEmoji').textContent = emoji;
        document.getElementById('resultTitle').textContent = title;
        document.getElementById('resultScore').textContent = score + ' из ' + total + ' правильно (' + pct + '%)';

        var verdict = document.getElementById('resultVerdict');
        verdict.innerHTML = verdictHtml;
        verdict.style.cssText = verdictClass + ' border-radius: 0 14px 14px 0; padding: 20px;';

        setTimeout(function() {
            document.getElementById('resultBarFill').style.width = pct + '%';
        }, 100);

        // Build review
        var list = document.getElementById('reviewList');
        list.innerHTML = '';
        answers.forEach(function(a, i) {
            var div = document.createElement('div');
            div.className = 'review-item ' + (a.isCorrect ? 'correct-item' : 'wrong-item');
            var html = '<div class="q-text">' + (i + 1) + '. [' + a.cat + '] ' + a.question + '</div>';
            if (a.isCorrect) {
                html += '<div class="q-answer"><span class="right">' + a.correct + '</span></div>';
            } else {
                html += '<div class="q-answer"><span class="wrong-text">' + a.selected + '</span> \u2192 <span class="right">' + a.correct + '</span></div>';
            }
            div.innerHTML = html;
            list.appendChild(div);
        });

        // Save
        var key = 'levelTestResult_' + currentLevel;
        localStorage.setItem(key, JSON.stringify({ score: score, total: total, pct: pct, date: new Date().toISOString() }));
        console.log('[OK] Level ' + currentLevel + ' test: ' + score + '/' + total + ' (' + pct + '%)');
    }

    function toggleReview() {
        var list = document.getElementById('reviewList');
        var btn = document.getElementById('reviewToggle');
        list.classList.toggle('open');
        btn.textContent = list.classList.contains('open') ? 'Скрыть ответы' : 'Показать ответы';
    }

    init();
    </script>
