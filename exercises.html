<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="3152 задания по корейской грамматике с ключами, 92 диалога и 44 текста. Четыре курса от 1급 до 6급: грамматика, разговорные темы, учебник 서울대 한국어 1 и продвинутые конструкции TOPIK II. Проверка ответа сразу на странице."/>
    <meta property="og:title" content="Упражнения по грамматике — Miso: 한국어 수업"/>
    <meta property="og:description" content="99 уроков от 1급 до 6급, 567 упражнений, 3152 задания с ключами, диалоги и тексты."/>
    <meta name="theme-color" content="#667eea"/>
    <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
    <title>Упражнения по грамматике | Miso: 한국어 수업</title>
    <link href="css/style.css" rel="stylesheet"/>
    <link rel="stylesheet" href="css/progress.css">
    <link href="css/auth-styles.css" rel="stylesheet"/>
    <link href="css/exercises.css" rel="stylesheet"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

        body { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

        .ex-header { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 25px; padding: 40px; margin-bottom: 25px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        .ex-header h1 { font-size: 2.4em; color: #2c3e50; margin: 0 0 10px; }
        .ex-header .korean-title { font-size: 1.5em; color: #5b4bb5; font-weight: 600; margin-bottom: 12px; }
        .ex-header p { color: #55506e; font-size: 1.05em; margin: 0 auto; max-width: 640px; line-height: 1.6; }
        .ex-source { margin-top: 18px; font-size: 0.9em; color: #6b6684; }

        .level-filter { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .filter-btn { padding: 10px 22px; background: rgba(255,255,255,0.2); color: #fff; border: 2px solid rgba(255,255,255,0.45); border-radius: 25px; font-size: 0.95em; cursor: pointer; transition: all 0.3s ease; font-weight: 500; font-family: inherit; }
        .filter-btn:hover { background: rgba(255,255,255,0.32); }
        .filter-btn.active { background: #fff; color: #5b4bb5; border-color: #fff; }

        .src-head { margin: 8px 0 18px; color: #fff; }
        .src-head h2 { font-size: 1.25em; margin: 0 0 4px; font-weight: 600; }
        .src-head span { font-size: 0.9em; opacity: 0.85; }

        .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .unit-card { background: #fff; border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); cursor: pointer; transition: transform 0.3s ease, box-shadow 0.3s ease; border-top: 5px solid #667eea; text-decoration: none; display: block; color: inherit; }
        .unit-card:hover { transform: translateY(-5px); box-shadow: 0 18px 40px rgba(0,0,0,0.18); }
        .unit-card .unit-no { font-size: 0.82em; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5b4bb5; }
        .unit-card h3 { margin: 8px 0 10px; font-size: 1.15em; color: #2c3e50; line-height: 1.35; }
        .unit-card .unit-meta { font-size: 0.88em; color: #55506e; }
        .unit-card .unit-done { display: inline-block; margin-top: 10px; font-size: 0.82em; font-weight: 600; color: #2e7d32; }
        .unit-card[data-level="1"] { border-top-color: #4caf50; }
        .unit-card[data-level="2"] { border-top-color: #2196F3; }
        .unit-card[data-level="3"] { border-top-color: #FF9800; }
        .unit-card[data-level="4"] { border-top-color: #9C27B0; }
        .unit-card[data-level="5"] { border-top-color: #E91E63; }
        .unit-card[data-level="6"] { border-top-color: #263238; }

        .level-legend { display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
            gap: 6px 10px; margin: -10px 0 22px; color: #fff; font-size: 0.85em; opacity: 0.9; }
        .level-legend i { display: inline-block; width: 16px; height: 5px; border-radius: 3px;
            margin-left: 6px; background: #667eea; }
        .level-legend i[data-level="1"] { background: #4caf50; }
        .level-legend i[data-level="2"] { background: #2196F3; }
        .level-legend i[data-level="3"] { background: #FF9800; }
        .level-legend i[data-level="4"] { background: #9C27B0; }
        .level-legend i[data-level="5"] { background: #E91E63; }
        .level-legend i[data-level="6"] { background: #263238; }
        .level-legend .legend-note { flex: 1 1 100%; text-align: center; opacity: 0.75; }

        /* ---- страница урока ---- */
        .back-link { display: inline-block; margin-bottom: 18px; color: #fff; text-decoration: none; font-weight: 500; opacity: 0.9; }
        .back-link:hover { opacity: 1; }

        .ex-block { background: #fff; border-radius: 20px; padding: 28px; margin-bottom: 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .ex-block h2 { font-size: 1.1em; color: #2c3e50; margin: 0 0 6px; line-height: 1.45; }
        .ex-num { display: inline-block; background: #667eea; color: #fff; border-radius: 12px; padding: 3px 12px; font-size: 0.82em; font-weight: 700; margin-bottom: 10px; }
        .ex-kind { font-size: 0.82em; color: #6b6684; margin-bottom: 16px; }

        .task-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid #eceaf5; flex-wrap: wrap; }
        .task-row:last-child { border-bottom: none; }
        .task-no { flex: 0 0 26px; color: #8b86a3; font-weight: 600; padding-top: 9px; }
        .task-q { flex: 1 1 260px; font-size: 1.05em; color: #2c3e50; padding-top: 8px; line-height: 1.5; }
        .task-q .hint { display: block; font-size: 0.85em; color: #6b6684; }
        .task-a { flex: 0 0 auto; display: flex; gap: 8px; align-items: center; }
        .task-a input { font-family: inherit; font-size: 1em; padding: 9px 14px; border: 2px solid #dcd8ec; border-radius: 12px; width: 230px; outline: none; transition: border-color 0.3s ease; }
        .task-a input:focus { border-color: #667eea; }
        .task-row.correct input { border-color: #4caf50; background: #f1f8f1; }
        .task-row.wrong input { border-color: #f44336; background: #fdf1f0; }
        .task-row.near input { border-color: #ff9800; background: #fff8e6; }
        .task-row.near .answer { color: #8a5a00; background: #fff8e6; }
        .task-row.near .answer b { color: #7a5c00; }
        .task-row.near .answer::after { content: ' — почти, ошибка в одном символе'; opacity: 0.75; }
        .answer { flex: 1 1 100%; font-size: 1em; color: #2e7d32; background: #f1f8f1; border-radius: 12px; padding: 10px 14px; line-height: 1.55; }
        .answer.hidden { display: none; }
        .nudge { flex: 1 1 100%; font-size: 0.95em; color: #7a5c00; background: #fff8e6; border-radius: 12px;
            padding: 8px 14px; line-height: 1.5; letter-spacing: 0.06em; }
        .nudge.hidden { display: none; }
        .nudge b { color: #8a5a00; letter-spacing: normal; }
        .answer b { color: #1b5e20; }

        .btn { font-family: inherit; font-size: 0.95em; padding: 10px 22px; border: none; border-radius: 25px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; }
        .btn-check { background: #667eea; color: #fff; }
        .btn-check:hover { background: #5b4bb5; }
        .btn-show { background: #eceaf5; color: #5b4bb5; }
        .btn-show:hover { background: #dcd8ec; }
        .ex-actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .ex-score { font-size: 0.95em; font-weight: 600; color: #2e7d32; }

        .chip { display: inline-block; font-family: inherit; font-size: 1em; padding: 9px 16px; margin: 5px; border: 2px solid #dcd8ec; border-radius: 20px; background: #fff; cursor: pointer; transition: all 0.2s ease; }
        .chip.on { background: #667eea; border-color: #667eea; color: #fff; }
        .chip.ok { background: #4caf50; border-color: #4caf50; color: #fff; }
        .chip.no { background: #f44336; border-color: #f44336; color: #fff; }

        /* ---- порядок слов ---- */
        .order-task { padding: 14px 0; border-bottom: 1px solid #eceaf5; }
        .order-task:last-of-type { border-bottom: none; }
        .order-q { font-size: 1.02em; color: #2c3e50; line-height: 1.5; margin-bottom: 10px; }
        .order-slots { min-height: 44px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
            background: #f7f6fc; border: 2px dashed #dcd8ec; border-radius: 14px; padding: 8px 12px; }
        .order-slots span { background: #667eea; color: #fff; border-radius: 10px; padding: 5px 12px; font-size: 1.02em; }
        .order-slots .ph { background: none; color: #a5a0bb; font-size: 0.9em; padding: 0; }
        .order-words { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
        .order-words .word { font-family: inherit; font-size: 1.02em; padding: 8px 14px; border: 2px solid #dcd8ec;
            border-radius: 12px; background: #fff; cursor: pointer; transition: all 0.2s ease; color: #2c3e50; }
        .order-words .word:hover { border-color: #667eea; }
        .order-words .word.used { opacity: 0.35; border-style: dashed; }
        .order-task.correct .order-slots { border-color: #4caf50; background: #f1f8f1; border-style: solid; }
        .order-task.wrong .order-slots { border-color: #f44336; background: #fdf1f0; border-style: solid; }

        /* ---- сопоставление пар ---- */
        .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
        .match-col { display: flex; flex-direction: column; gap: 8px; }
        .mchip { font-family: inherit; font-size: 1em; text-align: left; padding: 10px 14px; border: 2px solid #dcd8ec;
            border-radius: 12px; background: #fff; cursor: pointer; color: #2c3e50; transition: all 0.2s ease; }
        .mchip:hover { border-color: #667eea; }
        .mchip.on { border-color: #667eea; background: #eceaf5; }
        .mchip.ok { border-color: #4caf50; background: #f1f8f1; color: #2e7d32; cursor: default; }
        .mchip.no { border-color: #f44336; background: #fdf1f0; }

        .read-list { font-size: 1.1em; line-height: 2; color: #2c3e50; }
        .open-note { background: #fff8e6; border-left: 4px solid #f0a500; border-radius: 10px; padding: 14px 18px; color: #7a5c00; line-height: 1.55; }

        /* ---- диалог, текст, словарик ---- */
        .book-block { background: #fff; border-radius: 20px; padding: 28px; margin-bottom: 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .book-block h2 { font-size: 1.25em; color: #2c3e50; margin: 0 0 6px; }
        .book-block .book-hint { font-size: 0.85em; color: #6b6684; margin-bottom: 18px; }

        .line-row { padding: 10px 0; border-bottom: 1px solid #eceaf5; }
        .line-row:last-child { border-bottom: none; }
        .line-ko { font-size: 1.12em; color: #2c3e50; line-height: 1.6; }
        .line-ru { font-size: 0.97em; color: #55506e; margin-top: 4px; line-height: 1.5; }
        .line-ru.hidden { display: none; }

        .gloss-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
        .gloss-item { background: #f5f3fb; border-radius: 12px; padding: 10px 14px; font-size: 0.95em; }
        .gloss-item b { display: block; color: #2c3e50; font-size: 1.1em; margin-bottom: 2px; }
        .gloss-item span { color: #55506e; }

        .unit-links { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 24px; margin-bottom: 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .unit-links h3 { margin: 0 0 12px; font-size: 1.05em; color: #2c3e50; }
        .unit-links a { display: inline-block; margin: 4px 8px 4px 0; padding: 8px 16px; background: #eceaf5; color: #5b4bb5; border-radius: 18px; text-decoration: none; font-size: 0.9em; font-weight: 500; }
        .unit-links a:hover { background: #dcd8ec; }

        .ex-links { margin: -6px 0 16px; font-size: 0.88em; color: #6b6684; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
        .ex-links a { display: inline-block; padding: 5px 12px; background: #eceaf5; color: #5b4bb5; border-radius: 14px; text-decoration: none; font-weight: 500; }
        .ex-links a:hover { background: #dcd8ec; }

        .unit-nav { display: flex; justify-content: space-between; gap: 12px; margin: 10px 0 40px; flex-wrap: wrap; }
        .unit-nav a { flex: 1 1 200px; background: rgba(255,255,255,0.95); border-radius: 16px; padding: 16px 20px; text-decoration: none; color: #2c3e50; box-shadow: 0 8px 20px rgba(0,0,0,0.1); font-weight: 500; }
        .unit-nav a:hover { background: #fff; }
        .unit-nav a.next { text-align: right; }
        .unit-nav span { display: block; font-size: 0.8em; color: #6b6684; }

        .complete-box { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 28px; text-align: center; margin-bottom: 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-complete { background: #4caf50; color: #fff; font-size: 1.05em; padding: 14px 34px; }
        .btn-complete:hover { background: #43a047; }

        @media (max-width: 768px) {
            .ex-header { padding: 26px 20px; }
            .ex-header h1 { font-size: 1.7em; }
            .ex-block { padding: 20px 16px; }
            .task-a input { width: 100%; }
            .task-a { flex: 1 1 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="app"></div>
    </div>

    <script src="js/progress-tracker.js"></script>
    <script src="js/book-exercises.js"></script>
    <script src="js/topic-exercises.js"></script>
    <script src="js/snu-exercises.js"></script>
    <script src="js/adv-exercises.js"></script>
    <script src="js/lesson-titles.js"></script>
    <script src="js/exercise-trainer.js"></script>
    <script>
        'use strict';

        // Три набора упражнений: грамматический курс, разговорные темы и курс СНУ
        var SOURCES = [
            { id: 'book',   title: 'Грамматический курс',
              note: '21 урок по порядку — от чтения патчхима до косвенной речи' },
            { id: 'topics', title: 'Разговорные темы',
              note: '10 уроков: знакомство, дом, семья, еда, день, покупки, транспорт, телефон, погода, каникулы' },
            { id: 'snu',    title: '서울대 한국어 1 — курс Сеульского университета',
              note: '30 уроков учебника Института языкового образования СНУ: диалог, словарик и подстановочные упражнения' },
            { id: 'adv',    title: 'Продвинутая грамматика 2–6급',
              note: '38 конструкций уровня TOPIK II: правило, образование формы, выбор варианта, работа над ошибками и перевод' }
        ];

        function allUnits() {
            var book = (window.bookExercises || []).map(function (u) {
                if (!u.src) { u.src = 'book'; }
                return u;
            });
            return book.concat(window.topicExercises || [],
                               window.snuExercises || [],
                               window.advExercises || []);
        }

        var KIND_LABEL = {
            input:  'Впишите ответ и нажмите «Проверить»',
            reveal: 'Переведите сами, потом откройте ключ',
            select: 'Отметьте подходящие слова',
            order:  'Нажимайте слова по порядку — повторный клик убирает слово',
            match:  'Сопоставьте пары: слово слева, перевод справа',
            read:   'Прочитайте вслух — ключа к заданию нет',
            open:   'Творческое задание — выполняется письменно'
        };

        function shuffled(list) {
            var a = list.slice();
            for (var i = a.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var t = a[i]; a[i] = a[j]; a[j] = t;
            }
            return a;
        }

        // Сравнение ответа: игнорируем регистр, пробелы и знаки препинания
        function norm(s) {
            return String(s || '').toLowerCase()
                .replace(/[.,!?;:()«»"'`—–\-]/g, '')
                .replace(/\s+/g, '');
        }

        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // Первая ошибка — не повод сразу показывать ответ: даём форму ключа,
        // где виден только первый слог каждого слова
        function mask(answer) {
            return String(answer || '').trim().split(/\s+/).map(function (word, i) {
                var body = new Array(word.length).join('·');
                return i === 0 ? word.charAt(0) + body : body;
            }).join(' ');
        }

        function unitId(n) { return 'book_unit_' + n; }

        function isDone(n) {
            if (!window.ProgressTracker) return false;
            var p = ProgressTracker.get();
            return !!(p && p.completedLessons && p.completedLessons[unitId(n)]);
        }

        // Ссылка на урок сайта: строка (старый формат) или {href, t} с готовым
        // названием. Для строк название берём из js/lesson-titles.js — иначе
        // пользователь видел бы английский слаг папки.
        function linkTag(link) {
            var href = typeof link === 'string' ? link : link.href;
            var name = typeof link === 'string' ? '' : link.t;
            if (!name) { name = (window.lessonTitles || {})[href] || ''; }
            if (!name) {
                name = href.split('/').pop().replace(/^lesson_\d+_/, '').replace(/_/g, ' ');
                if (href.indexOf('vocabulary/') === 0) name = 'словарь: ' + name;
            }
            return '<a href="' + esc(href) + '/index.html">' + esc(name) + '</a>';
        }

        function countTasks(u) {
            var t = 0;
            u.ex.forEach(function (e) { t += (e.items || []).length; });
            return t;
        }

        // Что ещё есть в уроке кроме упражнений — теги для карточки на хабе
        function extras(u) {
            var parts = [];
            if (u.dialog && u.dialog.length) parts.push('💬 диалог');
            if (u.text && u.text.ko && u.text.ko.length) parts.push('📖 текст');
            if (u.glossary && u.glossary.length) parts.push('🗂️ ' + u.glossary.length + ' слов');
            return parts.map(function (p) { return '<i>' + esc(p) + '</i>'; }).join('');
        }

        // =============================================
        // Список уроков
        // =============================================
        var hubLevel = 0, hubQuery = '';

        // Общая статистика по всем урокам
        function hubTotals(units) {
            var exTotal = 0, exDone = 0;
            units.forEach(function (u) {
                var p = ExerciseStats.unitProgress(u);
                exTotal += p.total;
                exDone += p.done;
            });
            return {
                exTotal: exTotal,
                exDone: exDone,
                pct: exTotal ? Math.round(exDone / exTotal * 100) : 0,
                xp: ExerciseStats.xp(),
                lessons: units.filter(function (u) { return isDone(u.n); }).length
            };
        }

        // Первый урок, где ещё не всё решено
        function nextUnit(units) {
            for (var i = 0; i < units.length; i++) {
                if (ExerciseStats.unitProgress(units[i]).pct < 100) return units[i];
            }
            return units[0];
        }

        function ring(pct) {
            var r = 40, c = 2 * Math.PI * r;
            return '<div class="hub-ring">' +
                '<svg width="92" height="92" viewBox="0 0 92 92">' +
                    '<defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">' +
                        '<stop offset="0%" stop-color="#667eea"/><stop offset="100%" stop-color="#764ba2"/>' +
                    '</linearGradient></defs>' +
                    '<circle class="ring-bg" cx="46" cy="46" r="' + r + '"/>' +
                    '<circle class="ring-fg" cx="46" cy="46" r="' + r + '" ' +
                        'stroke-dasharray="' + c.toFixed(1) + '" ' +
                        'stroke-dashoffset="' + (c * (1 - pct / 100)).toFixed(1) + '"/>' +
                '</svg>' +
                '<div class="ring-val">' + pct + '%</div></div>';
        }

        function renderHub() {
            var units = allUnits();
            var t = hubTotals(units);
            var nu = nextUnit(units);
            var levels = [0, 1, 2, 3, 4, 5, 6];

            var html = '' +
                '<div class="ex-header">' +
                    '<h1>Упражнения по грамматике</h1>' +
                    '<div class="korean-title">문법 연습 문제</div>' +
                    '<p>' + units.length + ' уроков, ' +
                        units.reduce(function (a, u) { return a + u.ex.length; }, 0) +
                        ' упражнений и ' + units.reduce(function (a, u) { return a + countTasks(u); }, 0) +
                        ' заданий с ключами. В тренажёре задания идут по одному, ' +
                        'ответ проверяется сразу, за серию верных ответов идёт бонус.</p>' +
                    '<div class="ex-source">Грамматический курс по порядку и разговорные темы для практики</div>' +
                '</div>' +

                '<div class="hub-stats">' +
                    ring(t.pct) +
                    '<div class="hub-stat"><div class="v">' + t.exDone + '<span style="font-size:.55em;color:#8b86a3"> / ' + t.exTotal + '</span></div>' +
                        '<div class="l">упражнений решено</div></div>' +
                    '<div class="hub-stat"><div class="v">' + t.xp + '</div><div class="l">XP за тренировки</div></div>' +
                    '<div class="hub-stat"><div class="v">' + t.lessons + '</div><div class="l">уроков пройдено</div></div>' +
                '</div>' +

                '<div class="hub-actions">' +
                    '<button class="btn-hero" data-go="' + nu.n + '">' +
                        '<span class="ico">▶️</span><span><b>Продолжить: ' + esc(nu.name) + '</b>' +
                        '<span>' + esc(nu.topic) + '</span></span></button>' +
                    '<button class="btn-hero" data-random="1">' +
                        '<span class="ico">🎲</span><span><b>Случайная тренировка</b>' +
                        '<span>~20 заданий наугад из разных уроков</span></span></button>' +
                '</div>' +

                '<div class="hub-search"><input type="search" id="hubSearch" placeholder="Поиск по теме: вежливость, числительные, погода…" value="' + esc(hubQuery) + '"/></div>' +

                '<div class="level-filter">';

            levels.forEach(function (l) {
                var label = l === 0 ? 'Все уроки' : l + '급';
                html += '<button class="filter-btn' + (l === hubLevel ? ' active' : '') +
                        '" data-level="' + l + '">' + label + '</button>';
            });
            html += '</div>';

            // Полоска над карточкой — это уровень; без подписи её принимали
            // за статус прохождения
            html += '<div class="level-legend"><span>Цвет карточки — уровень:</span>';
            levels.filter(function (l) { return l; }).forEach(function (l) {
                html += '<i data-level="' + l + '"></i>' + l + '급';
            });
            html += '<span class="legend-note">прогресс показывают полоса и 🔥 / 🏆 на самой карточке</span></div>';

            var q = hubQuery.trim().toLowerCase();
            var found = 0;

            SOURCES.forEach(function (src) {
                var list = units.filter(function (u) {
                    if (u.src !== src.id) return false;
                    if (hubLevel && u.level !== hubLevel) return false;
                    if (!q) return true;
                    return (u.topic + ' ' + u.name).toLowerCase().indexOf(q) !== -1;
                });
                if (!list.length) return;
                found += list.length;
                html += '<div class="src-head"><h2>' + esc(src.title) + '</h2>' +
                            '<span>' + esc(src.note) + '</span></div>' +
                        '<div class="unit-grid">';
                list.forEach(function (u, i) {
                    var p = ExerciseStats.unitProgress(u);
                    // Задержку копим только у первых карточек: при 38 уроках в
                    // секции сплошная лесенка тянулась бы почти две секунды и
                    // читалась как подвисшая отрисовка
                    html += '<a class="unit-card" data-level="' + u.level + '" href="?unit=' + u.n + '" ' +
                                'style="animation-delay:' + (Math.min(i, 7) * 45) + 'ms">' +
                                (p.pct === 100 ? '<div class="unit-fire">🏆</div>' : p.pct > 0 ? '<div class="unit-fire">🔥</div>' : '') +
                                '<div class="unit-no">' + esc(u.name) + ' · ' + u.level + '급</div>' +
                                '<h3>' + esc(u.topic) + '</h3>' +
                                '<div class="unit-meta">' + u.ex.length + ' упражнений · ' + countTasks(u) + ' заданий</div>' +
                                '<div class="unit-tags">' + extras(u) + '</div>' +
                                '<div class="unit-bar"><i style="width:' + p.pct + '%"></i></div>' +
                                '<div class="unit-pct">' + (p.pct ? p.done + ' из ' + p.total + ' упражнений · ' + p.pct + '%' : 'ещё не начат') + '</div>' +
                                (isDone(u.n) ? '<div class="unit-done">[OK] Пройдено</div>' : '') +
                            '</a>';
                });
                html += '</div>';
            });

            if (!found) {
                html += '<div class="ex-block" style="text-align:center">Ничего не нашлось — попробуйте другое слово.</div>';
            }

            document.getElementById('app').innerHTML = html;

            document.querySelectorAll('.filter-btn').forEach(function (b) {
                b.addEventListener('click', function () { hubLevel = Number(b.dataset.level); renderHub(); });
            });
            document.querySelectorAll('[data-go]').forEach(function (b) {
                b.addEventListener('click', function () { location.search = '?unit=' + b.dataset.go; });
            });
            var rnd = document.querySelector('[data-random]');
            if (rnd) rnd.addEventListener('click', randomTraining);

            var search = document.getElementById('hubSearch');
            if (search) {
                search.addEventListener('input', function () {
                    hubQuery = search.value;
                    var pos = search.selectionStart;
                    renderHub();
                    var s2 = document.getElementById('hubSearch');
                    s2.focus();
                    s2.setSelectionRange(pos, pos);
                });
            }

            // Подсветка карточки под курсором
            document.querySelectorAll('.unit-card').forEach(function (card) {
                card.addEventListener('mousemove', function (e) {
                    var r = card.getBoundingClientRect();
                    card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
                    card.style.setProperty('--my', (e.clientY - r.top) + 'px');
                });
            });
        }

        // Микс из случайных упражнений всех уроков
        function randomTraining() {
            var units = allUnits().filter(function (u) {
                return !hubLevel || u.level === hubLevel;
            });
            var pool = [];
            units.forEach(function (u) {
                (u.ex || []).forEach(function (e) {
                    if (ExerciseStats.playable(e)) pool.push({ u: u, e: e });
                });
            });
            if (!pool.length) return;
            for (var i = pool.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
            }
            // Набираем упражнения, пока не наберётся ~20 заданий.
            // Каждое упражнение помнит свой урок — прогресс запишется по месту
            var pick = [], count = 0;
            for (var k = 0; k < pool.length && count < 20; k++) {
                var copy = Object.assign({}, pool[k].e);
                copy._unit = pool[k].u;
                pick.push(copy);
                count += (copy.items || []).filter(function (it) { return !!it.a; }).length;
            }
            ExerciseTrainer.start({
                unit: { n: 'mix', name: 'Случайная тренировка', src: 'mix', ex: pick },
                exercises: pick,
                onClose: renderHub
            });
        }

        // =============================================
        // Один урок
        // =============================================
        function renderUnit(u) {
            var prog = ExerciseStats.unitProgress(u);
            var qCount = ExerciseTrainer.build(u, u.ex).length;
            var html = '<a class="back-link" href="exercises.html">&larr; Все уроки</a>' +
                '<div class="unit-sticky">' +
                    '<span class="s-name">' + esc(u.name) + '</span>' +
                    '<div class="s-bar"><i style="width:' + prog.pct + '%"></i></div>' +
                    '<span class="s-pct">' + prog.done + '/' + prog.total + '</span>' +
                    '<button class="btn-train" data-train="all">🎯 Тренажёр · ' + qCount + ' заданий</button>' +
                    (prog.done ? '<button class="btn-train" data-train="left" ' +
                        'style="background:#eceaf5;color:#5b4bb5;box-shadow:none">🔁 Нерешённые</button>' : '') +
                '</div>' +
                '<div class="ex-header">' +
                    '<h1>' + esc(u.name) + '</h1>' +
                    '<div class="korean-title">' + u.level + '급</div>' +
                    '<p>' + esc(u.topic) + '</p>' +
                    '<div class="ex-source">' + u.ex.length + ' упражнений · ' + countTasks(u) + ' заданий · ' +
                        esc((SOURCES.filter(function (s) { return s.id === u.src; })[0] || {}).title || '') +
                    '</div>' +
                '</div>';

            if (u.links && u.links.length) {
                html += '<div class="unit-links"><h3>Теория по этим темам на сайте</h3>';
                u.links.forEach(function (link) { html += linkTag(link); });
                html += '</div>';
            }

            if (u.dialog && u.dialog.length) {
                html += '<div class="book-block" id="dialogBlock">' +
                            '<h2>💬 Диалог урока</h2>' +
                            '<div class="book-hint">Прочитайте вслух. Перевод скрыт — откройте, когда проверите себя.</div>';
                u.dialog.forEach(function (row) {
                    html += '<div class="line-row">' +
                                '<div class="line-ko">' + esc(row.k) + '</div>' +
                                (row.r ? '<div class="line-ru hidden">' + esc(row.r) + '</div>' : '') +
                            '</div>';
                });
                html += '<div class="ex-actions">' +
                            '<button class="btn btn-show" data-act="toggle-ru">Показать перевод</button>' +
                        '</div></div>';
            }

            if (u.text && u.text.ko && u.text.ko.length) {
                html += '<div class="book-block" id="textBlock">' +
                            '<h2>📖 Текст урока</h2>' +
                            '<div class="book-hint">' +
                                (u.text.ru && u.text.ru.length
                                    ? 'Прочитайте и переведите, затем сверьтесь с переводом.'
                                    : 'Прочитайте и переведите. Перевода в книге нет — опирайтесь на словарик ниже.') +
                            '</div>';
                u.text.ko.forEach(function (line, i) {
                    html += '<div class="line-row">' +
                                '<div class="line-ko">' + esc(line) + '</div>' +
                                (u.text.ru && u.text.ru[i]
                                    ? '<div class="line-ru hidden">' + esc(u.text.ru[i]) + '</div>' : '') +
                            '</div>';
                });
                if (u.text.ru && u.text.ru.length) {
                    html += '<div class="ex-actions">' +
                                '<button class="btn btn-show" data-act="toggle-ru">Показать перевод</button>' +
                            '</div>';
                }
                html += '</div>';
            }

            if (u.glossary && u.glossary.length) {
                html += '<div class="book-block">' +
                            '<h2>🗂️ Словарик к тексту</h2>' +
                            '<div class="book-hint">' + u.glossary.length + ' слов из этого урока</div>' +
                            '<div class="gloss-grid">';
                u.glossary.forEach(function (w) {
                    html += '<div class="gloss-item"><b>' + esc(w.k) + '</b><span>' + esc(w.r) + '</span></div>';
                });
                html += '</div></div>';
            }

            u.ex.forEach(function (e, ei) {
                var best = ExerciseStats.get(u, e.id);
                html += '<div class="ex-block' + (best && best.pct >= 60 ? ' done-ex' : '') + '" data-ex="' + ei + '">' +
                            (best ? '<div class="ex-best">' + best.pct + '%</div>' : '') +
                            '<div class="ex-num">Упражнение ' + esc(e.id) + '</div>' +
                            '<h2>' + esc(e.title) + '</h2>' +
                            '<div class="ex-kind">' + KIND_LABEL[e.kind] + '</div>';

                if (e.links && e.links.length) {
                    html += '<div class="ex-links"><span>Теория:</span>';
                    e.links.forEach(function (link) { html += linkTag(link); });
                    html += '</div>';
                }

                if (e.kind === 'open') {
                    html += '<div class="open-note">Задание без ключа: выполните его письменно ' +
                            'и сверьтесь с примерами из теории.</div>';
                } else if (e.kind === 'read') {
                    html += '<div class="read-list">';
                    (e.items || []).forEach(function (it, i) {
                        html += '<div>' + (i + 1) + ') ' + esc(it.q) + '</div>';
                    });
                    html += '</div>';
                } else if (e.kind === 'order') {
                    // Слова перемешиваем при отрисовке: порядок в ключе
                    // подсказал бы ответ через исходную разметку
                    (e.items || []).forEach(function (it, i) {
                        var words = String(it.c || it.a).trim().split(/\s+/);
                        html += '<div class="order-task" data-i="' + i + '">' +
                                    '<div class="order-q">' + (i + 1) + '. ' + esc(it.q) +
                                        (it.h ? '<span class="hint">' + esc(it.h) + '</span>' : '') +
                                    '</div>' +
                                    '<div class="order-slots"><span class="ph">Нажимайте слова по порядку</span></div>' +
                                    '<div class="order-words">';
                        shuffled(words.map(function (w, n) { return { w: w, n: n }; }))
                            .forEach(function (o) {
                                html += '<button type="button" class="word" data-w="' + o.n + '">' +
                                            esc(o.w) + '</button>';
                            });
                        html += '</div>' +
                                '<div class="answer hidden"><b>Ключ:</b> ' + esc(it.a) + '</div>' +
                                '</div>';
                    });
                    html += '<div class="ex-actions">' +
                                '<button class="btn btn-check" data-act="check-order">Проверить</button>' +
                                '<button class="btn btn-show" data-act="show">Показать ключ</button>' +
                                '<span class="ex-score"></span></div>';
                } else if (e.kind === 'match') {
                    html += '<div class="match-grid"><div class="match-col">';
                    (e.items || []).forEach(function (it, i) {
                        html += '<button type="button" class="mchip" data-side="k" data-i="' + i + '">' +
                                    esc(it.q) + '</button>';
                    });
                    html += '</div><div class="match-col">';
                    shuffled((e.items || []).map(function (it, i) { return { a: it.a, i: i }; }))
                        .forEach(function (o) {
                            html += '<button type="button" class="mchip" data-side="r" data-i="' + o.i + '">' +
                                        esc(o.a) + '</button>';
                        });
                    html += '</div></div>' +
                            '<div class="ex-actions"><span class="ex-score">Найдено пар: 0 из ' +
                                (e.items || []).length + '</span></div>';
                } else if (e.kind === 'select') {
                    html += '<div>';
                    (e.items || []).forEach(function (it, i) {
                        html += '<button type="button" class="chip" data-i="' + i + '">' + esc(it.q) + '</button>';
                    });
                    html += '</div><div class="ex-actions">' +
                                '<button class="btn btn-check" data-act="check-select">Проверить</button>' +
                                '<span class="ex-score"></span></div>';
                } else {
                    (e.items || []).forEach(function (it, i) {
                        html += '<div class="task-row" data-i="' + i + '">' +
                                    '<div class="task-no">' + (i + 1) + '.</div>' +
                                    '<div class="task-q">' + esc(it.q) +
                                        (it.h ? '<span class="hint">' + esc(it.h) + '</span>' : '') +
                                    '</div>';
                        if (e.kind === 'input' && it.a) {
                            html += '<div class="task-a">' +
                                        '<input type="text" placeholder="Ваш ответ" autocomplete="off" ' +
                                            'data-check="' + esc(it.c || it.a) + '"/>' +
                                    '</div>' +
                                    '<div class="nudge hidden"><b>Подсказка:</b> ' +
                                        esc(mask(it.c || it.a)) + '</div>';
                        }
                        html += it.a
                            ? '<div class="answer hidden"><b>Ключ:</b> ' + esc(it.a) + '</div>'
                            : '<div class="answer hidden">Ключа к этому пункту в книге нет.</div>';
                        html += '</div>';
                    });
                    html += '<div class="ex-actions">';
                    if (e.kind === 'input') {
                        html += '<button class="btn btn-check" data-act="check">Проверить</button>';
                    }
                    html += '<button class="btn btn-show" data-act="show">Показать ключ</button>' +
                            '<span class="ex-score"></span></div>';
                }
                if (ExerciseStats.playable(e)) {
                    html += '<div class="ex-actions">' +
                                '<button class="btn btn-play" data-train="' + ei + '">▶ Пройти в тренажёре</button>' +
                            '</div>';
                }
                html += '</div>';
            });

            html += '<div class="complete-box">' +
                        '<button class="btn btn-complete" id="completeBtn">Отметить урок пройденным</button>' +
                    '</div>';

            // Листаем только внутри своего курса
            var units = allUnits().filter(function (x) { return x.src === u.src; });
            var i = units.indexOf(u);
            html += '<div class="unit-nav">';
            if (i > 0) {
                html += '<a href="?unit=' + units[i - 1].n + '"><span>&larr; Предыдущий</span>' +
                        esc(units[i - 1].name) + '</a>';
            }
            if (i < units.length - 1) {
                html += '<a class="next" href="?unit=' + units[i + 1].n + '"><span>Следующий &rarr;</span>' +
                        esc(units[i + 1].name) + '</a>';
            }
            html += '</div>';

            document.getElementById('app').innerHTML = html;
            bindUnit(u);
        }

        function bindUnit(u) {
            // Полоса в шапке урока должна двигаться сразу после проверки,
            // а не только после перезагрузки страницы
            function refreshSticky() {
                var prog = ExerciseStats.unitProgress(u);
                var bar = document.querySelector('.unit-sticky .s-bar i');
                var pctLabel = document.querySelector('.unit-sticky .s-pct');
                if (bar) { bar.style.width = prog.pct + '%'; }
                if (pctLabel) { pctLabel.textContent = prog.done + '/' + prog.total; }
            }

            // Запуск тренажёра: всё упражнение или весь урок
            document.querySelectorAll('[data-train]').forEach(function (b) {
                b.addEventListener('click', function () {
                    var v = b.dataset.train;
                    var list;
                    if (v === 'all') {
                        list = u.ex.filter(ExerciseStats.playable);
                    } else if (v === 'left') {
                        list = u.ex.filter(function (e) {
                            var r = ExerciseStats.get(u, e.id);
                            return ExerciseStats.playable(e) && (!r || r.pct < 60);
                        });
                        if (!list.length) { list = u.ex.filter(ExerciseStats.playable); }
                    } else {
                        list = [u.ex[Number(v)]];
                    }
                    if (!list.length) return;
                    var y = window.scrollY;
                    ExerciseTrainer.start({
                        unit: u,
                        exercises: list,
                        onClose: function () { renderUnit(u); window.scrollTo(0, y); }
                    });
                });
            });

            document.querySelectorAll('.book-block').forEach(function (block) {
                var btn = block.querySelector('[data-act="toggle-ru"]');
                if (!btn) return;
                btn.addEventListener('click', function () {
                    var hidden = block.querySelector('.line-ru.hidden');
                    block.querySelectorAll('.line-ru').forEach(function (el) {
                        el.classList.toggle('hidden', !hidden);
                    });
                    btn.textContent = hidden ? 'Скрыть перевод' : 'Показать перевод';
                });
            });

            document.querySelectorAll('.ex-block').forEach(function (block) {
                var ex = u.ex[Number(block.dataset.ex)];
                var score = block.querySelector('.ex-score');

                block.querySelectorAll('.chip').forEach(function (chip) {
                    chip.addEventListener('click', function () { chip.classList.toggle('on'); });
                });

                // ---- порядок слов: клик добавляет слово, повторный убирает ----
                block.querySelectorAll('.order-task').forEach(function (task) {
                    var picked = [];
                    var slots = task.querySelector('.order-slots');
                    function paint() {
                        slots.innerHTML = picked.length
                            ? picked.map(function (b) { return '<span>' + esc(b.textContent) + '</span>'; }).join('')
                            : '<span class="ph">Нажимайте слова по порядку</span>';
                    }
                    task.querySelectorAll('.word').forEach(function (btn) {
                        btn.addEventListener('click', function () {
                            var at = picked.indexOf(btn);
                            if (at === -1) { picked.push(btn); btn.classList.add('used'); }
                            else { picked.splice(at, 1); btn.classList.remove('used'); }
                            task.classList.remove('correct', 'wrong');
                            paint();
                        });
                    });
                    task.built = function () {
                        return picked.map(function (b) { return b.textContent; }).join(' ');
                    };
                });

                // ---- пары: сначала слово слева, потом перевод справа ----
                var mSel = null, mWrong = 0;
                var mTotal = block.querySelectorAll('.mchip[data-side="k"]').length;
                block.querySelectorAll('.mchip').forEach(function (chip) {
                    chip.addEventListener('click', function () {
                        if (chip.classList.contains('ok')) return;
                        if (chip.dataset.side === 'k') {
                            block.querySelectorAll('.mchip[data-side="k"]').forEach(function (c) {
                                c.classList.remove('on');
                            });
                            chip.classList.add('on');
                            mSel = chip;
                            return;
                        }
                        if (!mSel) return;
                        if (mSel.dataset.i === chip.dataset.i) {
                            mSel.classList.remove('on');
                            mSel.classList.add('ok');
                            chip.classList.add('ok');
                            mSel = null;
                        } else {
                            mWrong++;
                            chip.classList.add('no');
                            setTimeout(function () { chip.classList.remove('no'); }, 600);
                        }
                        var done = block.querySelectorAll('.mchip[data-side="k"].ok').length;
                        score.textContent = 'Найдено пар: ' + done + ' из ' + mTotal +
                            (mWrong ? ' · промахов: ' + mWrong : '');
                        if (done === mTotal) {
                            // В зачёт идут пары, найденные без промаха
                            ExerciseStats.setResult(u, ex.id, Math.max(0, mTotal - mWrong), mTotal);
                            refreshSticky();
                        }
                    });
                });

                block.addEventListener('click', function (evt) {
                    var act = evt.target.dataset && evt.target.dataset.act;
                    if (!act) return;

                    if (act === 'show') {
                        // Ключ открывается и закрывается одной кнопкой
                        var hidden = block.querySelector('.answer.hidden');
                        block.querySelectorAll('.answer').forEach(function (a) {
                            a.classList.toggle('hidden', !hidden);
                        });
                        evt.target.textContent = hidden ? 'Скрыть ключ' : 'Показать ключ';
                        return;
                    }

                    if (act === 'check') {
                        var ok = 0, near = 0, empty = 0, total = 0;
                        block.querySelectorAll('.task-row').forEach(function (row) {
                            var inp = row.querySelector('input');
                            if (!inp) return;
                            total++;
                            var it = ex.items[Number(row.dataset.i)] || {};
                            var res = ExerciseTrainer.match(it, inp.value);
                            row.classList.remove('correct', 'wrong', 'near');
                            if (res === 'ok') {
                                row.classList.add('correct');
                                ok++;
                            } else if (res === 'near') {
                                row.classList.add('near');
                                near++;
                                row.querySelector('.answer').classList.remove('hidden');
                            } else if (res === 'empty') {
                                empty++;   // пустое поле — не ошибка, ключ не открываем
                            } else {
                                row.classList.add('wrong');
                                // Первая ошибка — подсказка, вторая — ключ
                                var nudge = row.querySelector('.nudge');
                                if (nudge && nudge.classList.contains('hidden')) {
                                    nudge.classList.remove('hidden');
                                } else {
                                    row.querySelector('.answer').classList.remove('hidden');
                                }
                            }
                        });
                        // Результат со страницы урока тоже идёт в прогресс:
                        // раньше он сохранялся только из тренажёра и «сгорал»
                        // при перезагрузке. setResult пишет лишь улучшение,
                        // поэтому наполовину заполненная проверка не испортит
                        // прежний результат
                        ExerciseStats.setResult(u, ex.id, ok, total);
                        refreshSticky();

                        score.textContent = 'Верно: ' + ok + ' из ' + total +
                            (near ? ' · почти: ' + near : '') +
                            (empty ? ' · без ответа: ' + empty : '');
                        console.log('[OK] Упражнение ' + ex.id + ': ' + ok + '/' + total +
                            (near ? ', почти ' + near : '') + (empty ? ', пропущено ' + empty : ''));
                        return;
                    }

                    if (act === 'check-order') {
                        var okN = 0, totalN = 0, emptyN = 0;
                        block.querySelectorAll('.order-task').forEach(function (task) {
                            totalN++;
                            var it = ex.items[Number(task.dataset.i)] || {};
                            var res = ExerciseTrainer.match(it, task.built());
                            task.classList.remove('correct', 'wrong');
                            if (res === 'ok') {
                                task.classList.add('correct');
                                okN++;
                            } else if (res === 'empty') {
                                emptyN++;
                            } else {
                                task.classList.add('wrong');
                                task.querySelector('.answer').classList.remove('hidden');
                            }
                        });
                        ExerciseStats.setResult(u, ex.id, okN, totalN);
                        refreshSticky();
                        score.textContent = 'Верно: ' + okN + ' из ' + totalN +
                            (emptyN ? ' · не собрано: ' + emptyN : '');
                        console.log('[OK] Упражнение ' + ex.id + ': ' + okN + '/' + totalN);
                        return;
                    }

                    if (act === 'check-select') {
                        var right = 0;
                        block.querySelectorAll('.chip').forEach(function (chip) {
                            var it = ex.items[Number(chip.dataset.i)];
                            var should = it.a !== '—';
                            var picked = chip.classList.contains('on');
                            chip.classList.remove('on');
                            chip.classList.add(picked === should ? 'ok' : 'no');
                            if (picked === should) right++;
                        });
                        score.textContent = 'Верно: ' + right + ' из ' + ex.items.length;
                        evt.target.disabled = true;
                    }
                });
            });

            var btn = document.getElementById('completeBtn');
            if (btn) {
                if (isDone(u.n)) markDone(btn);
                btn.addEventListener('click', function () {
                    if (window.ProgressTracker) {
                        ProgressTracker.markLessonCompleted(unitId(u.n));
                        console.log('[OK] Урок отмечен пройденным:', unitId(u.n));
                    }
                    markDone(btn);
                });
            }
        }

        function markDone(btn) {
            btn.textContent = 'Пройдено!';
            btn.style.background = '#2e7d32';
            btn.style.cursor = 'default';
            btn.disabled = true;
        }

        // =============================================
        document.addEventListener('DOMContentLoaded', function () {
            if (!window.bookExercises && !window.topicExercises) {
                document.getElementById('app').innerHTML =
                    '<div class="ex-header"><h1>Не удалось загрузить упражнения</h1></div>';
                console.error('[ERROR] js/book-exercises.js не загружен');
                return;
            }
            var n = new URLSearchParams(window.location.search).get('unit');
            var unit = n === null ? null : allUnits().filter(function (u) {
                return String(u.n) === String(n);
            })[0];
            if (unit) { renderUnit(unit); } else { renderHub(); }
        });
    </script>
