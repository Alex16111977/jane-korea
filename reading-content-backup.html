<span class="korean-word" data-translation="дети" data-pronunciation="아이들은 [aideureun]">아이들은</span> <span class="korean-word" data-translation="старшим" data-pronunciation="어른들께 [eoreundeul-kke]">어른들께</span> <span class="korean-word" data-translation="поклон" data-pronunciation="세배를 [saebaereul]">세배를</span> <span class="korean-word" data-translation="делают" data-pronunciation="드려요 [deuryeoyo]">드려요</span>. <span class="korean-word" data-translation="тогда" data-pronunciation="그러면 [geureomyeon]">그러면</span> <span class="korean-word" data-translation="новогодние деньги" data-pronunciation="세뱃돈을 [saebaetdoneul]">세뱃돈을</span> <span class="korean-word" data-translation="получают" data-pronunciation="받아요 [badayo]">받아요</span>. <span class="korean-word" data-translation="Новый год" data-pronunciation="설날은 [seollaleun]">설날은</span> <span class="korean-word" data-translation="очень" data-pronunciation="정말 [jeongmal]">정말</span> <span class="korean-word" data-translation="счастливый" data-pronunciation="행복한 [haengbokan]">행복한</span> <span class="korean-word" data-translation="день" data-pronunciation="날이에요 [narieyo]">날이에요</span>!`,
                        translation: "Самый важный праздник в Корее — это Соллаль (корейский Новый год). Вся семья собирается вместе. Утром проводят чарье для предков. Потом едят суп с рисовыми клецками. Говорят, что если съесть рисовый суп, то станешь на год старше. Дети делают поклоны старшим. Тогда получают новогодние деньги. Соллаль — действительно счастливый день!",

                            {
                                question: "한국의 설날은 언제입니까? (Когда отмечается корейский Новый год?)",
                                options: ["양력 1월 1일", "음력 1월 1일", "12월 31일", "1월 15일"],

                            },
                            {
                                question: "나이를 한 살 더 먹으려면 무엇을 먹어야 합니까? (Что нужно съесть, чтобы стать старше?)",
                                options: ["밥", "떡국", "김치", "귤"],

                            {
                                question: "세뱃돈은 누가 누구에게 줍니까? (Кто кому даёт новогодние деньги?)",
                                options: ["아이들이 어른들에게", "어른들이 아이들에게", "친구들이 서로", "이웃들이 서로"],
                                correct: 1
                            }
                        ]
                    }
                ]
            }
        };

        // Category names
        const categoryNames = {
            personal: 'О себе',
            stories: 'Рассказы', 
            culture: 'Культура',
            science: 'Наука',
            travel: 'Путешествия',
            food: 'Еда'
        };

        function getCurrentTexts() {
            return storyDatabase[selectedLevel]?.[selectedCategory] || [];
        }

        function updateBackButton() {
            const backBtn = document.getElementById('backBtn');
            
            // Создаем ссылку назад в зависимости от уровня
            if (selectedLevel === 1) {
                backBtn.href = 'reading-texts.html';
            } else {
                backBtn.href = `level_${selectedLevel}/reading-texts-level-${selectedLevel}.html`;
            }
        }

        function updatePageInfo() {
            document.getElementById('levelBadge').textContent = `${selectedLevel}급`;
            document.getElementById('categoryBadge').textContent = categoryNames[selectedCategory];
            updateTextCounter();
        }

        function updateTextCounter() {
            const texts = getCurrentTexts();
            document.getElementById('textCounter').textContent = `${currentTextIndex + 1}/${texts.length}`;
        }

        function loadCurrentText() {
            const texts = getCurrentTexts();
            
            if (texts.length === 0) {
                document.getElementById('storyTitle').textContent = 'Тексты скоро появятся';
                document.getElementById('storySubtitle').textContent = '곧 올 예정';
                document.getElementById('koreanContent').innerHTML = 
                    '<span style="color: #666;">Тексты для этой категории пока добавляются. Попробуйте другую категорию!</span>';
                document.getElementById('translationText').textContent = 
                    'Скоро здесь появятся интересные истории!';
                return;
            }
            
            // Если указан конкретный textId, найти его индекс
            if (selectedTextId) {
                const textIndex = texts.findIndex(text => text.id === selectedTextId);
                if (textIndex !== -1) {
                    currentTextIndex = textIndex;
                }
            }
            
            if (currentTextIndex >= texts.length) {
                currentTextIndex = 0;
            }
            
            if (currentTextIndex < 0) {
                currentTextIndex = texts.length - 1;
            }
            
            const story = texts[currentTextIndex];
            
            // Update story info
            document.getElementById('storyTitle').textContent = story.title;
            document.getElementById('storySubtitle').textContent = story.subtitle;
            document.getElementById('koreanContent').innerHTML = story.korean;
            document.getElementById('translationText').textContent = story.translation;
            
            // Show image only for specific stories
            const storyImage = document.getElementById('storyImage');
            const storyImg = storyImage.querySelector('img');
            
            if (story.id === 'personal-1') {
                storyImg.src = 'images/флаг.jpg';
                storyImg.alt = 'Korean Flag';
                storyImage.style.display = 'block';
            } else if (story.id === 'personal-2') {
                storyImg.src = 'images/OIP.jpg';
                storyImg.alt = 'Korean Family';
                storyImage.style.display = 'block';
            } else if (story.id === 'personal-3') {
                storyImg.src = 'images/OIP (1).jpg';
                storyImg.alt = 'Korean Hobbies';
                storyImage.style.display = 'block';
            } else if (story.id === 'culture-1') {
                storyImg.src = 'images/новый год.jpg';
                storyImg.alt = 'Korean New Year';
                storyImage.style.display = 'block';
            } else {
                storyImage.style.display = 'none';
            }
            
            // Store current quiz
            currentQuiz = story.quiz || [];
            
            updateTextCounter();
            setupWordInteractions();
        }

        function setupWordInteractions() {
            const words = document.querySelectorAll('.korean-word');
            const translationHeader = document.getElementById('translationHeader');
            
            words.forEach(word => {
                word.addEventListener('click', (e) => {
                    const wordText = e.target.textContent;
                    const translation = e.target.dataset.translation;
                    
                    // Show Korean word and translation in header
                    translationHeader.innerHTML = `${wordText}<br><span style="color: #666; font-size: 16px;">${translation}</span>`;
                    
                    // Add to learned words
                    if (!learnedWords.find(w => w.korean === wordText)) {
                        learnedWords.push({
                            korean: wordText,
                            translation: translation
                        });
                        localStorage.setItem('koreanLearnedWords', JSON.stringify(learnedWords));
                    }
                    
                    // Visual feedback
                    e.target.classList.add('clicked');
                    setTimeout(() => {
                        e.target.classList.remove('clicked');
                    }, 1000);
                });
            });
        }

        function toggleTranslation() {
            translationVisible = !translationVisible;
            const section = document.getElementById('translationSection');
            
            if (translationVisible) {
                section.classList.add('show');
            } else {
                section.classList.remove('show');
            }
        }

        function toggleQuiz() {
            quizVisible = !quizVisible;
            const section = document.getElementById('quizSection');
            const koreanContent = document.getElementById('koreanContent');
            const translationSection = document.getElementById('translationSection');
            const quizBtn = document.getElementById('quizBtn');
            
            if (quizVisible && currentQuiz.length > 0) {
                // Reset quiz state
                currentQuestionIndex = 0;
                quizAnswers = [];
                loadQuiz();
                section.style.display = 'block';
                // Hide Korean text and translation while quiz is active
                koreanContent.style.display = 'none';
                translationSection.style.display = 'none';
                translationVisible = false;
                // Update button
                quizBtn.innerHTML = '<span>❌</span> Закрыть тест';
                quizBtn.classList.add('active');
            } else {
                section.style.display = 'none';
                // Show Korean text back
                koreanContent.style.display = 'block';
                // Keep translation section hidden unless it was manually shown
                if (translationVisible) {
                    translationSection.classList.add('show');
                }
                // Reset button
                quizBtn.innerHTML = '<span>🧠</span> Тест';
                quizBtn.classList.remove('active');
            }
        }

        function loadQuiz() {
            const quizContent = document.getElementById('quizContent');
            
            if (currentQuestionIndex >= currentQuiz.length) {
                showQuizResults();
                return;
            }
            
            const q = currentQuiz[currentQuestionIndex];
            const progressText = `Вопрос ${currentQuestionIndex + 1} из ${currentQuiz.length}`;
            
            let html = `
                <div style="text-align: center; margin-bottom: 20px; color: #667eea; font-weight: 600;">${progressText}</div>
                <div class="quiz-question" data-question="${currentQuestionIndex}">
                    <div class="question-text">${q.question}</div>
                    <div class="quiz-options">
                        ${q.options.map((option, optIndex) => 
                            `<div class="quiz-option" data-option="${optIndex}" onclick="selectOption(${optIndex})">${option}</div>`
                        ).join('')}
                    </div>
                    <div class="quiz-result" id="currentResult" style="display: none;"></div>
                </div>
            `;
            
            quizContent.innerHTML = html;
        }
        
        function selectOption(optionIndex) {
            const question = currentQuiz[currentQuestionIndex];
            const questionEl = document.querySelector(`[data-question="${currentQuestionIndex}"]`);
            const options = questionEl.querySelectorAll('.quiz-option');
            const resultEl = document.getElementById('currentResult');
            
            // Disable all options
            options.forEach(opt => {
                opt.style.pointerEvents = 'none';
                opt.classList.remove('selected', 'correct', 'incorrect');
            });
            
            // Mark selected option
            options[optionIndex].classList.add('selected');
            
            // Save answer
            const isCorrect = optionIndex === question.correct;
            quizAnswers.push({
                questionIndex: currentQuestionIndex,
                selectedOption: optionIndex,
                correct: isCorrect
            });
            
            // Show correct answer after 1 second
            setTimeout(() => {
                options[question.correct].classList.add('correct');
                if (optionIndex !== question.correct) {
                    options[optionIndex].classList.add('incorrect');
                }
                
                // Show result
                if (isCorrect) {
                    resultEl.innerHTML = '✓ 맞습니다! (Правильно!)';
                    resultEl.className = 'quiz-result correct';
                } else {
                    resultEl.innerHTML = `✗ 틀렸습니다. 정답: ${question.options[question.correct]} (Неправильно. Правильный ответ: ${question.options[question.correct]})`;
                    resultEl.className = 'quiz-result incorrect';
                }
                resultEl.style.display = 'block';
                
                // Move to next question after 3 seconds
                setTimeout(() => {
                    currentQuestionIndex++;
                    loadQuiz();
                }, 3000);
            }, 1000);
        }
        
        function showQuizResults() {
            const quizContent = document.getElementById('quizContent');
            const correctAnswers = quizAnswers.filter(answer => answer.correct).length;
            const totalQuestions = currentQuiz.length;
            const percentage = Math.round((correctAnswers / totalQuestions) * 100);
            
            let resultMessage = '';
            let resultColor = '';
            
            if (percentage >= 90) {
                resultMessage = '🎉 우수합니다! (Отлично!)';
                resultColor = '#4caf50';
            } else if (percentage >= 75) {
                resultMessage = '😊 좋습니다! (Хорошо!)';
                resultColor = '#2196f3';
            } else if (percentage >= 50) {
                resultMessage = '😐 보통입니다 (Неплохо)';
                resultColor = '#ff9800';
            } else {
                resultMessage = '😔 더 공부하세요 (Нужно больше учиться)';
                resultColor = '#f44336';
            }
            
            let html = `
                <div style="text-align: center; padding: 30px;">
                    <div style="font-size: 48px; color: ${resultColor}; margin-bottom: 20px;">${percentage}%</div>
                    <div style="font-size: 24px; font-weight: 700; margin-bottom: 15px; color: ${resultColor};">${resultMessage}</div>
                    <div style="font-size: 18px; color: #666; margin-bottom: 30px;">
                        정답: ${correctAnswers} / ${totalQuestions} (Правильных ответов: ${correctAnswers} из ${totalQuestions})
                    </div>
                    <button class="control-btn" onclick="toggleQuiz()" style="font-size: 16px; padding: 12px 24px;">
                        🔄 다시 시도 (Попробовать снова)
                    </button>
                </div>
            `;
            
            quizContent.innerHTML = html;
        }

        function toggleVocab() {
            vocabVisible = !vocabVisible;
            const section = document.getElementById('vocabSection');
            
            if (vocabVisible) {
                loadVocab();
                section.style.display = 'block';
            } else {
                section.style.display = 'none';
            }
        }

        function loadVocab() {
            const vocabGrid = document.getElementById('vocabGrid');
            let html = '';
            
            learnedWords.slice(-12).forEach(word => {
                html += `
                    <div class="vocab-card">
                        <div class="vocab-korean">${word.korean}</div>
                        <div class="vocab-translation">${word.translation}</div>
                        <div class="vocab-pronunciation">${word.pronunciation || ''}</div>
                    </div>
                `;
            });
            
            if (html === '') {
                html = '<div style="grid-column: 1/-1; text-align: center; color: #666;">Кликайте на слова в тексте, чтобы добавить их сюда!</div>';
            }
            
            vocabGrid.innerHTML = html;
        }

        // Переменные для аудио
        let currentAudio = null;

        // Подготовка данных для синхронизации аудио (автоматическое распределение)


        async function playAudio() {
            const btn = event.target.closest('.control-btn');
            const originalText = btn.innerHTML;
            
            try {
                // Получаем ID текущего текста
                const texts = getCurrentTexts();
                if (texts.length === 0) return;
                
                const currentStory = texts[currentTextIndex];
                const audioFileName = `${selectedLevel}-${selectedCategory}-${currentStory.id}.mp3`;
                const audioPath = `audio/${audioFileName}`;
                
                // Останавливаем предыдущее аудио если есть
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
                
                btn.innerHTML = '<span>🔊</span> Загружаю...';
                btn.disabled = true;
                btn.classList.add('loading');
                
                // Создаем новое аудио
                currentAudio = new Audio(audioPath);
                
                // Обработка событий
                currentAudio.oncanplaythrough = () => {
                    btn.innerHTML = '<span>⏸️</span> Остановить';
                    btn.classList.remove('loading');
                    btn.classList.add('playing');
                    btn.disabled = false;
                };
                
                currentAudio.onended = () => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    btn.classList.remove('playing', 'loading');
                    btn.onclick = playAudio;
                    currentAudio = null;
                };
                
                currentAudio.onerror = () => {
                    throw new Error(`Аудио файл не найден: ${audioFileName}`);
                };
                
                // Функционал паузы/воспроизведения
                btn.onclick = (e) => {
                    e.preventDefault();
                    if (currentAudio.paused) {
                        currentAudio.play();
                        btn.innerHTML = '<span>⏸️</span> Остановить';
                        btn.classList.add('playing');
                    } else {
                        currentAudio.pause();
                        btn.innerHTML = '<span>▶️</span> Продолжить';
                        btn.classList.remove('playing');
                    }
                };
                
                // Начинаем воспроизведение
                await currentAudio.play();
                
            } catch (error) {
                console.error('Ошибка воспроизведения:', error);
                btn.innerHTML = '<span>⚠️</span> Нет аудио';
                btn.classList.remove('loading', 'playing');
                currentAudio = null;
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 3000);
            }
        }

        // Кнопка назад - ПРАВИЛЬНО ИСПРАВЛЕНО!
        function updateBackButton() {
            const backBtn = document.getElementById('backBtn');
            if (backBtn) {
                backBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    
                    // Получаем параметры из URL
                    const urlParams = new URLSearchParams(window.location.search);
                    const level = urlParams.get('level') || '1';
                    const category = urlParams.get('category') || 'personal';
                    
                    // Возвращаемся с параметрами
                    window.location.href = `reading-texts.html?level=${level}&category=${category}`;
                });
            }
        }

        // Очистка при выходе со страницы
        window.addEventListener('beforeunload', function() {
            if (currentAudio) {
                currentAudio.pause();
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updatePageInfo();
            updateBackButton();
            loadCurrentText();
        });
    </script>
</body>
