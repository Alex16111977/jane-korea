<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Урок 3: Время и дни недели</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #d97706, #92400e);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .navigation {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .navigation a {
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            transition: all 0.3s ease;
        }
        
        .navigation a:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        
        .header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .content-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 35px;
            margin-bottom: 25px;
        }
        
        .time-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .time-card {
            background: linear-gradient(135deg, #2e9e5b, #14663a);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        
        .korean-time {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .time-translation {
            font-size: 1em;
            opacity: 0.9;
        }
    </style>
    <link rel="stylesheet" href="../../../css/visual-boost.css">
    <link rel="stylesheet" href="../../../css/lesson-theme.css">
</head>

<div class="jk-bg-decor" aria-hidden="true"><span class="jk-blob jk-blob-1"></span><span class="jk-blob jk-blob-2"></span><span class="jk-blob jk-blob-3"></span><span class="jk-han jk-han-1">한</span><span class="jk-han jk-han-2">글</span><span class="jk-han jk-han-3">안녕</span><span class="jk-han jk-han-4">사랑</span><span class="jk-han jk-han-5">꿈</span></div>
