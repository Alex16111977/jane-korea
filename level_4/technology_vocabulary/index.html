        let filteredVocabulary = vocabulary;
        let currentCardIndex = 0;
        let isFlipped = false;
        
        function loadVocabulary() {
            const grid = document.getElementById('vocabularyGrid');
            grid.innerHTML = '';
            
            filteredVocabulary.forEach((word, index) => {
                const card = document.createElement('div');
                card.className = `tech-card ${word.category}`;
                
                // Создаём индикатор сложности
                let levelDots = '';
                for (let i = 1; i <= 5; i++) {
                    levelDots += `<div class="level-dot ${i <= word.level ? 'active' : ''}"></div>`;
                }
                
                card.innerHTML = `
                    <div class="tech-emoji">${word.emoji}</div>
                    <div class="korean-word">${word.korean}</div>
                    <div class="pronunciation">${word.pronunciation}</div>
                    <div class="translation">${word.translation}</div>
                    <div class="tech-level">
                        ${levelDots}
                    </div>
                    <small style="text-align: center; display: block; color: #888;">Сложность: ${word.level}/5</small>
                    <div class="example-sentence">
                        <div class="korean-sentence">${word.example}</div>
                        <div>${word.exampleTranslation}</div>
                    </div>
                    <button class="speak-btn" onclick="speak('${word.korean}')">🔊 Слово</button>
                    <button class="speak-btn" onclick="speak('${word.example}')">🔊 Пример</button>
                `;
                grid.appendChild(card);
                
                // Анимация появления
                setTimeout(() => {
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(20px)';
                    card.style.transition = 'all 0.5s ease';
                    setTimeout(() => {
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(0)';
                    }, 50);
                }, index * 100);
            });
        }
        
        function filterTech(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (category === 'all') {
                filteredVocabulary = vocabulary;
            } else {
                filteredVocabulary = vocabulary.filter(word => word.category === category);
            }
            
            loadVocabulary();
        }
        
        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            }
        }
        
        function showVocabulary() {
            document.getElementById('vocabulary-section').style.display = 'block';
            document.getElementById('flashcard-section').style.display = 'none';
            document.getElementById('filter-section').style.display = 'flex';
            updateActiveButton(0);
        }
        
        function showFlashcards() {
            document.getElementById('vocabulary-section').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'block';
            document.getElementById('filter-section').style.display = 'none';
            updateActiveButton(1);
            updateFlashcard();
        }
        
        function updateFlashcard() {
            const word = vocabulary[currentCardIndex];
            const flashcard = document.getElementById('flashcard');
            const content = document.getElementById('flashcard-content');
            
            if (isFlipped) {
                // Создаём индикатор сложности
                let levelDots = '';
                for (let i = 1; i <= 5; i++) {
                    levelDots += `<div class="level-dot ${i <= word.level ? 'active' : ''}"></div>`;
                }
                
                content.innerHTML = `
                    <div class="tech-emoji">${word.emoji}</div>
                    <div class="pronunciation">${word.pronunciation}</div>
                    <div class="translation">${word.translation}</div>
                    <div class="tech-level" style="margin: 15px 0;">
                        ${levelDots}
                    </div>
                    <small style="color: #888;">Сложность: ${word.level}/5</small>
                    <div class="example-sentence" style="margin-top: 15px;">
                        <div class="korean-sentence">${word.example}</div>
                        <div style="font-size: 0.9em; color: #666;">${word.exampleTranslation}</div>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <div class="tech-emoji">${word.emoji}</div>
                    <div class="korean-word">${word.korean}</div>
                    <button class="speak-btn" onclick="speak('${word.korean}')">🔊 Слово</button>
                `;
            }
            
            document.getElementById('card-counter').textContent = `${currentCardIndex + 1} / ${vocabulary.length}`;
        }
        
        function flipCard() {
            isFlipped = !isFlipped;
            const flashcard = document.getElementById('flashcard');
            flashcard.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
            setTimeout(() => {
                updateFlashcard();
                flashcard.style.transform = 'rotateY(0deg)';
            }, 150);
        }
        
        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % vocabulary.length;
            isFlipped = false;
            updateFlashcard();
        }
        
        function prevCard() {
            currentCardIndex = (currentCardIndex - 1 + vocabulary.length) % vocabulary.length;
            isFlipped = false;
            updateFlashcard();
        }
        
        function updateActiveButton(index) {
            const buttons = document.querySelectorAll('.mode-btn');
            buttons.forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            loadVocabulary();
            updateFlashcard();
        });
        
        // Горячие клавиши
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('flashcard-section').style.display !== 'none') {
                if (e.code === 'Space') {
                    e.preventDefault();
                    flipCard();
                } else if (e.code === 'ArrowRight') {
                    nextCard();
                } else if (e.code === 'ArrowLeft') {
                    prevCard();
                }
            }
        });
    </script>
    <!-- Кнопка завершения урока -->
    <div style="text-align: center; margin: 40px 0; padding: 30px;">
        <button id="completeLessonBtn" onclick="completeLesson()" style="
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.2em;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(76,175,80,0.3);
            font-family: 'Noto Sans KR', sans-serif;
        ">Отметить урок как пройденный</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="../../js/firebase-config.js"></script>
    <script src="../../js/firebase-sync.js"></script>
    <script src="../../js/firebase-auth.js"></script>
    <script src="../../js/progress-tracker.js"></script>
    <script>
        var LESSON_ID = 'level4_vocab_technology';

        function completeLesson() {
            if (window.ProgressTracker) {
                if (!ProgressTracker.markLessonCompleted(LESSON_ID)) return;
                var btn = document.getElementById('completeLessonBtn');
                btn.textContent = 'Пройдено!';
                btn.style.background = '#2e7d32';
                btn.style.cursor = 'default';
                btn.disabled = true;
                btn.style.opacity = '0.85';
                console.log('[OK] Lesson completed:', LESSON_ID);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (window.ProgressTracker) {
                var progress = ProgressTracker.get();
                if (progress && progress.completedLessons && progress.completedLessons[LESSON_ID]) {
                    var btn = document.getElementById('completeLessonBtn');
                    if (btn) {
                        btn.textContent = 'Пройдено!';
                        btn.style.background = '#2e7d32';
                        btn.style.cursor = 'default';
                        btn.disabled = true;
                        btn.style.opacity = '0.85';
                    }
                }
            }
        });
    </script>
